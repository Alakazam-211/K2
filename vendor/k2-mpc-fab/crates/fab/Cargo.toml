[package]
name = "k2-mpc-fab"
version = "0.1.2"
description = "Reads PCB fabrication outputs (photoplot and drill files), read-only: a type pack for the multiplayer kit."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test-only: the properties every reader keeps on any input (`k2_mpc_fab::fuzzing`), for the
# fuzz targets in `fuzz/` and the seed tests. No host enables it.
fuzzing = []
# Test-only: planted bugs (`k2_mpc_fab::mutant`), for `tests/mutants.rs`. No host enables it.
mutants = []

[dependencies]
# The kit (k2-mpc-base), by path: its checkout sits beside this repo's (a host vendors both side
# by side: vendor/k2-mpc-base beside vendor/k2-mpc-fab), at the kit release CHANGELOG.md names,
# v0.23.0. Run `cargo update -p k2-mpc-base` and commit the lock when it moves.
k2-mpc-base = { path = "../../../k2-mpc-base/crates/base" }

[dev-dependencies]
# The seed tests run the fuzz properties: this crate's own test-only feature.
k2-mpc-fab = { path = ".", features = ["fuzzing"] }
