[package]
name = "k2-daemon"
version = "0.46.11"
edition = "2021"
license = "MIT"
publish = false
description = "K2 persistent-agent daemon: launchd-managed device-local process that runs the scheduler and agent orchestration so agents keep working while the Tauri app is quit and the laptop lid is closed."

[[bin]]
name = "k2-daemon"
path = "src/main.rs"
# `main.rs` only calls `k2_daemon::daemon_main::run()`; every unit test
# lives in (and runs once from) the library.
test = false

# Hostmail root door. Not setuid. User k2 runs it only via sudo -n.
# Not feature-gated: provision installs the release bin beside the daemon.
[[bin]]
name = "k2-mail-helper"
path = "src/bin/k2-mail-helper.rs"

# Heartbeat S2 (D11) — macOS power door: wake events (and S6's lid-closed
# keep-awake). Copied to /Library/PrivilegedHelperTools by one admin
# dialog; run only via sudo -n. A stub that exits 1 off macOS.
[[bin]]
name = "k2-power-helper"
path = "src/bin/k2-power-helper.rs"

# Sandbox P2b — the privilege-dropped libkrun VMM jail. The real body is
# linux+sandbox-microvm only and links libkrun (see build.rs); on every other
# build it is the stub `main` that exits 1. `required-features` keeps it out of
# a default `cargo build` entirely (it's only ever built with the feature on).
[[bin]]
name = "k2-vmm-worker"
path = "src/bin/k2-vmm-worker.rs"
required-features = ["sandbox-microvm"]

# The daemon itself. `src/main.rs` is a shim over `daemon_main::run()`;
# integration tests (crates/k2-daemon/tests/*) reach modules through it.
[lib]
name = "k2_daemon"
path = "src/lib.rs"

[features]
# Session-sandboxing P2a/P2b — forwards k2-core's microVM backend feature so
# `resolve_sandbox`'s Linux-only `SandboxSpec::Microvm` arm can compile, and
# pulls in the worker-only deps (`nix`, `seccompiler`) that build the host jail.
# Default OFF: on a default build, `resolve_sandbox` always degrades a sandbox
# request to Passthrough (logged, no isolation) and the worker is not built.
# `dep:` keeps the optional deps from auto-creating implicit features.
sandbox-microvm = ["k2-core/sandbox-microvm", "dep:nix", "dep:seccompiler"]

# Custom/enterprise air-gap compile (not a GitHub Release asset). Forwards
# k2-core's baked air-gap and compiles the GitHub daemon-latest.json URL
# out of this crate (see update_routes).
airgap = ["k2-core/airgap"]

# TEST ONLY (Sew S29 cycle in a throwaway VM): pin Sew's test builds
# instead of the placeholder pin table. Release builds never enable it;
# the helper built with it refuses to sign. Build the daemon and the helper
# with the same value or the daemon refuses the helper (pin mismatch).
sew-test-pins = ["k2-root-proto/sew-test-pins"]

# TEST ONLY (prd-app-mail-calendar-surfaces-v1 §8.2 / §9.10): compile the
# provider base-URL override (`K2_PROVIDER_FAKES_URL`) so a headless daemon
# talks to tests/fakes/oauth-providers instead of Google / Microsoft. Release
# builds never enable it, so nothing that can set env can redirect tokens.
provider-fakes = []
sew-test-pins-upgrade = ["sew-test-pins", "k2-root-proto/sew-test-pins-upgrade"]
# TEST ONLY (V22): the real pins plus Sew's next test build as the pin,
# so a box on the real pin upgrades to it. Build the helper with it too.
sew-test-pin-next = ["sew-test-pins", "k2-root-proto/sew-test-pin-next"]

[dependencies]
# Sew chat (S30 K15): the real `SewChat` backend talks to Sew's mgmt
# socket through Sew's own client, vendored at Sew 0.3.0 (release-0.3.0 @
# 8252db23, private tags sew-proto-v0.3.0 / sew-client-v0.3.0; Sew's canonical
# tarballs) with a per-file sha256 manifest (third_party/SEW-VENDOR.txt).
# mgmt + sync only: no gateway (no tungstenite/zstd/webpki pulled in).
sew-client = { path = "../../third_party/sew-client", default-features = false, features = ["mgmt", "sync"] }
# Session Stream + Awareness Bus primitives are now always compiled
# into k2so-core (the `session_stream` feature flag was retired in
# 0.39.0e).
k2-core = { path = "../k2-core" }
# The root-helper contract (paths, verb catalog, Stalwart pin table,
# templates, signed-build check). The helper binary itself is its own
# crate (k2-root-helper) and is never linked here.
k2-root-proto = { path = "../k2-root-proto" }
# The update-signing key list and the shared verify (prd-security-sweep-0464-v1
# SS4): the daemon self-update checks `sig2` with it.
k2-release-keys = { path = "../k2-release-keys" }
# K2 vault (prd-k2-vault-v1): the store and its pure fetch policy; the daemon
# does the I/O (`egress`, `vault_fetch`).
k2-vault = { path = "../k2-vault" }
# Markdown multiplayer v1 (K1): the multiplayer kit and its Markdown pack,
# vendored side by side with `git subtree` (vendor/, pinned shas until they
# tag). Their own workspaces are excluded from ours; they resolve into our
# Cargo.lock. Licences in NOTICE.md (yrs MIT, similar Apache-2.0, thiserror
# MIT/Apache-2.0; redb is the copy k2-core already links).
k2-mpc-base = { path = "../../vendor/k2-mpc-base/crates/base" }
k2-mpc-board = { path = "../../vendor/k2-mpc-board/crates/board" }
# The board pack's bridge (v0.1.2): its parser, the kit's rows (MPC-E830 to E859),
# dry runs and the file registry for capabilities. Its own workspace, as the
# pack's; it resolves into our Cargo.lock with the kit and the board crate above.
k2-mpc-board-bridge = { path = "../../vendor/k2-mpc-board/bridge" }
k2-mpc-markdown = { path = "../../vendor/k2-mpc-markdown/crates/markdown" }
# The PSD/PSB pack (K2 Cores): reads a layered image's versions into the kit's
# structure index, beside the blob; agents never write these files. Its own
# workspace (vendor/k2-mpc-psd, without its fuzz/), as the other packs.
k2-mpc-psd = { path = "../../vendor/k2-mpc-psd/crates/psd" }
k2-mpc-text = { path = "../../vendor/k2-mpc-text/crates/text" }
# URL hosts for the egress gate; the same `url` 2 k2-vault and reqwest use.
url = "2"

# Cryptographic randomness for the per-boot hook auth token.
getrandom = "0.2"

# Constant-time equality for the owner-token compare (the crown-jewel
# credential). `==` on &str/&[u8] short-circuits on first mismatch, leaking
# a byte-by-byte timing side-channel; subtle::ConstantTimeEq does not.
subtle = "2.6"

# Home-directory lookup for ~/.k2so/{daemon.port,daemon.token,daemon.log}.
dirs = "5"
# canonicalize without the Windows \\?\ verbatim prefix (git, stored
# workspace paths and path comparisons need the plain C:\ form); exactly
# std::fs::canonicalize on Unix. Already in Cargo.lock.
dunce = "1"

# Async runtime. The daemon is async-first by convention — scheduler ticks,
# the HTTP server, and the daemon->Tauri WS event channel all live on the
# same multi-thread runtime.
tokio = { version = "1", features = ["full"] }

# Async WS server for the daemon->Tauri event channel (GET /events).
tokio-tungstenite = "0.23"

# JSON serialization for HookEvent frames going over /events.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `.k2/compute.toml` (compute presets, CE-3): the daemon parses it. Same
# version k2-core uses (already in Cargo.lock).
toml = "0.8"

# chrono — agent-reply event payload needs an RFC-3339 timestamp.
chrono = { version = "0.4", features = ["serde"] }
# MCS3: IANA zone math for Microsoft calendar writes (same version k2-core uses).
chrono-tz = "0.10"

# rusqlite — the per-project heartbeat-schedule route in cli.rs pokes
# the `projects` table directly (it's the only daemon code that touches
# a column k2so-core doesn't already wrap). Bundled feature matches
# what k2so-core uses so rusqlite resolves to a single crate version.
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }

# Futures helpers (Stream trait / StreamExt / SinkExt) needed by
# tokio-tungstenite's async message loop.
futures-util = "0.3"

# UUIDs — pre-allocated for `claude --session-id` pinning so each
# heartbeat fire owns a deterministic, unique session id from spawn
# time (closes the concurrent-fires-share-session race).
uuid = { version = "1", features = ["v4"] }

# rustls — the daemon installs the aws-lc-rs CryptoProvider at boot.
# Rustls 0.23 refuses to auto-pick when more than one provider is
# compiled into the binary and panics on first TLS use, so the daemon
# names one explicitly. Same pattern as src-tauri.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# K2 Connect E2E encryption (Option A) — the daemon's second listener
# terminates TLS itself (rustls) for the user's <sub>.k2.dev subdomain and
# splices the decrypted stream to the existing HTTP listener, so the relay
# carries only ciphertext. tokio-rustls wraps accepted sockets with the
# TlsAcceptor; rustls-pemfile parses the (self-signed in the spike) cert PEM
# on the client side of the listener's own test. Gated on K2_E2E at runtime
# (see tunnel_tls_listener.rs); compiled unconditionally. aws-lc-rs matches
# the provider installed at boot (main.rs:223) so a single provider resolves.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
# 0.46.3 client IP: parse request / response heads where the E2E listener
# splices to an App, to strip client-sent forwarding headers and add
# X-K2-Client-IP (already in the tree via hyper / tungstenite).
httparse = "1"
# Hostmail L1: parse the captured TLS leaf (issuer/CN + NotAfter) so status
# can tell rcgen self-signed from ACME-issued without a certs dir. Same
# crate k2-core already pins — no new dependency.
x509-parser = { version = "0.18", default-features = false }
# Lock-free hot-swap of the live rustls ServerConfig: the cert auto-renewal
# loop (PRD §6) swaps a freshly-issued chain in WITHOUT dropping the TLS
# listener. Already in the tree via k2-core's cert_broker, so no new crate.
arc-swap = "1"

# reqwest blocking — Phase 2 Unit 5 Claude Auth OAuth refresh. Same
# features the Tauri side and k2-core use, so reqwest resolves to a
# single crate version.
# `http2` (prd-custom-app-push-v1 CP18): APNs is HTTP/2 only; Apple picks
# h2 by ALPN. `h2` was already in Cargo.lock through hyper.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }

# prd-vault-for-agents-v1 A3: the vault's loopback proxy (`vault/proxy.rs`) is
# one hyper listener with streamed responses. All three were already in
# Cargo.lock through reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Direct libc calls (forked helpers' `_exit`, process and socket calls).
# Same crate version k2-core already pulls in transitively.
libc = "0.2"

# parking_lot Mutex. k2-core already pins this version; declaring
# directly so daemon code can import it without a re-export hop.
parking_lot = "0.12"

# k2-ptyd S3: boot adoption reads ptyd's session list (wire types only;
# already linked through k2-core — no new crate).
k2-ptyd = { path = "../k2-ptyd" }

# Exports (prd-k2-core-exports-v1, vs-live §3): the worker's wire and the
# host-side runner (spawn, limits, watchdog). The worker binary itself never
# links k2-core; the daemon embeds it like k2-ptyd (build.rs).
k2-export = { path = "../k2-export" }

# Remote desktop (prd-remote-desktop-tab-v1 D3): the wire to k2-deskd ("K2
# Screen"). Only the protocol crate: k2-deskd itself (AppKit, x11rb, zbus)
# is never linked; Linux release daemons embed its binary (build.rs).
k2-deskd-proto = { path = "../k2-deskd-proto" }

# base64 — Phase 2 Unit 6 `/cli/fs/read-binary` encodes file bytes
# into the JSON response so the existing `/cli/*` dispatcher (JSON
# only) can carry them. ~33% wire overhead, but stays within the
# 50 MB binary-read cap which is the renderer's worst case (PDFs,
# DOCX, images). A streaming WS endpoint is Phase 3 work.
base64 = "0.22"

# Host-session capability envelope (PRD S1–S3): ES256 JWT mint + JWKS.
# `jsonwebtoken` signs/verifies compact JWS (use_pem for EncodingKey from
# PKCS8 PEM); `p256` generates + parses ~/.k2/capability-signing.pem and
# extracts JWKS x/y coordinates.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "pem",
    "pkcs8",
    "std",
    "arithmetic",
] }

# Files-drawer multi-writer live refresh — recursive FS watcher on the
# daemon machine so agent shell writes + other-client mutations fan out
# as SessionEvent::FsChanged. Same notify 7 line as src-tauri (macos_fsevent
# is a no-op feature on Linux; inotify is the portable default there).
notify = { version = "7", features = ["macos_fsevent"] }

# P3 remote daemon self-update (binary-swap shape). `sha2` verifies the
# downloaded artifact's SHA-256 against the manifest; `minisign-verify`
# is the verify-ONLY pure-Rust minisign implementation used to check the
# artifact signature against the embedded `plugins.updater.pubkey`. No
# signing keys ever live in the daemon — verify only.
sha2 = "0.10"
minisign-verify = "0.2"
# Sew S29 (K12): the KEK id check — Sew's S4 §5.3 formula is a blake3
# derive_key over the master key. Only for that id; tarballs stay sha2.
blake3 = "1"
# Hostmail root helper extracts the pinned stalwart tarball in-process.
# No shell `tar`. Both crates are already in Cargo.lock.
flate2 = "1.1.9"
tar = "0.4.45"

# K2 Mail S2 — DNS verification for domain onboarding (prd-email-server-v1
# §6.3). hickory-resolver (the maintained trust-dns successor; nothing else
# in the tree links a DNS client) provides the blocking system-conf resolver
# behind `mail::dns_verify::SystemResolver`; handlers + the poller call it
# from spawn_blocking. Tests NEVER use it — every test goes through the
# `DnsResolver` trait with canned answers (no real DNS in tests, ever).
hickory-resolver = "0.24"

# K2 Mail S9 — external assistant inboxes (prd-email-server-v1 §17.5): a
# sync IMAP client for the user's OWN accounts (Gmail app-passwords,
# Fastmail, company IMAP). `imap` 3.x is the maintained line (2.x is
# frozen); rustls-tls ONLY — TLS verification is always on (rustls-connector
# + platform root store), and native-tls stays out of the tree. Every
# protocol effect is wrapped behind `mail::external::ImapOps`, so unit
# tests use fakes / a scripted loopback mock — never a real mail host.
# imap-proto is imap's wire-type crate (NameAttribute::Drafts for the
# SPECIAL-USE detection); pinned to the minor imap itself uses.
# mail-parser (Apache-2.0/MIT standalone LIBRARY — not the Stalwart server;
# the §4 no-linking rule is about the AGPL sidecar) parses fetched RFC 822
# bytes into text/html/attachments; `full_encoding` pulls encoding_rs so
# non-UTF-8 charsets in real human inboxes (ISO-8859-*, Shift-JIS, …)
# decode instead of mojibake.
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }

# K2 Mail — LINKED inbox SEND (prd-email-server-v1 §17.5): a blocking SMTP
# submission client for the user's OWN external accounts (same
# app-password as the IMAP read/draft path). `lettre` is the maintained
# Rust SMTP line; rustls-tls ONLY — certificate verification is ALWAYS on
# (no code path relaxes it; native-tls stays out of the tree, matching the
# imap client above). Every SMTP effect is wrapped behind
# `mail::external_smtp::SmtpOps`, so unit tests use a scripted loopback
# mock on an ephemeral high port — never a real mail host.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
    "hostname",
    "pool",
] }
# On-box Let's Encrypt client for custom-domain certs (prd-custom-domains C17).
# CSR mint uses the same rcgen 0.13 pin as k2-core (must be a runtime dep —
# acme.rs is not test-only). aws-lc-rs matches the rustls provider at boot.
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "aws-lc-rs"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# PostgreSQL 17 grammar (libpg_query 17-6.x) for the guest doors only
# (POST /cli/db/query, guest rows). One grammar per binary: 5.x (16) and
# 6.x can't link together (same C symbols). 16's guest SQL parses under 17
# (corpus test in sql/query.rs); 18-only syntax is refused until a crate
# with the 18 grammar exists (prd-pg17-and-db-upgrade-v1 §8, V14/V49).
# 6.1.0+ carries the macOS strchrnul fix, so no vendored patch.
pg_query = "=6.2.1"

# Constant-time zeroing of key buffers read from key stores.
zeroize = "1"

# K2 vault on macOS (KV5, KV7): the box key in the login Keychain through
# Security.framework (never /usr/bin/security), and the owner confirm via
# LocalAuthentication (system-drawn Touch ID / password sheet).
# Signer pairing, server side (0.46.10 C3a, vs-live V17): `k2 ci signer
# add` runs k2-signer's own `pairing::server_*` (one protocol, no copy).
# The signer is macOS/Linux only (its library uses unix calls), so the
# routes are too; a Windows server answers `not_supported`.
[target.'cfg(unix)'.dependencies]
k2-signer = { path = "../k2-signer" }

# Windows: the machine's own addresses for the egress / vault-fetch guard
# (GetAdaptersAddresses). windows-sys 0.61 is already in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"

# Sandbox P2b worker — Linux-only deps for the host jail. Both are OPTIONAL and
# pulled in ONLY by the `sandbox-microvm` feature (via `dep:`), so a default or
# macOS build never compiles them. `nix` gives us the namespace / mount /
# pivot_root / cred-drop / signal syscalls; `seccompiler` builds + applies the
# seccomp-bpf allowlist. `libc` (prctl/pipe2/ioctl/FFI) is already a base dep.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = [
    "sched",
    "mount",
    "fs",
    "user",
    "process",
    "signal",
], optional = true }
seccompiler = { version = "0.4", optional = true }

[build-dependencies]
# k2-ptyd P84: build.rs hashes the embedded k2-ptyd binary.
sha2 = "0.10"

[dev-dependencies]
# Enable k2so-core's `test-util` feature for integration tests that
# need the in-memory DB helper (`db::init_for_tests`). Production
# binaries don't link this path — only `cargo test` does.
k2-core = { path = "../k2-core", features = ["test-util"] }
# Vault route tests run on a temp vault with the fake key store.
k2-vault = { path = "../k2-vault", features = ["test-util"] }
# The changes card's tests (workbench-v1 B7) build temp repos. Same git2
# version/features k2-core uses: the one crate already in the lock tree.
git2 = { version = "0.19", default-features = false }
# Federation route tests mint a fresh "peer" keypair to pin (distinct from
# the daemon's own tunnel key). Same rcgen version/features k2-core uses, so
# it resolves to the one crate already in the lock tree — no new dep.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# `tokio::time::pause` for the grid-emitter frame-budget tests —
# cadence assertions run on the paused virtual clock (deterministic,
# no sleep-and-hope). `full` does NOT include `test-util`; feature
# unification applies this to test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
# Grid-emitter tests feed bytes straight into a session's Term via
# `vte::ansi::Processor` (standing in for alacritty's IO thread).
# Same version/features k2-core pins, so Cargo resolves it to the
# one `vte` already in the lock tree — no new crate.
vte = { version = "0.15", features = ["std", "ansi"] }
# Thread image tests (thread-images-v1) encode one fixture per image type.
# Same version/features k2-core pins: the one `image` already in the tree.
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp", "gif", "bmp", "tiff"] }
k2-node-proto = { path = "../k2-node-proto" }
# Root-helper heal tests sign fixture builds with the TEST key.
k2-root-proto = { path = "../k2-root-proto", features = ["test-signer"] }
# k2-ptyd P76 test lists ptyd's sessions over its protocol (already linked
# through k2-core; no new crate).
k2-ptyd = { path = "../k2-ptyd" }
# `k2 mail send --from-name` contract test: the HOSTED From header is
# composed by Stalwart from the JMAP `from[].name` we hand it, with
# Stalwart's own builder (stalwartlabs/mail-builder 1.0 — the version
# Stalwart 0.16.x pins). The test renders the same name with it and parses
# the header back with mail-parser. Test-only, no transitive deps
# (gethostname feature off).
mail-builder = { version = "1.0", default-features = false }
# Docs test (kit v0.9.5 rollback): writes a newer kit's table into a temp
# docs store, as that kit would. The redb k2-core and the kit already link.
redb = "2"

# K2 compute nodes: the headless contract test drives the REAL node runtime
# (a separate crate that never links k2-core) against the in-process daemon.
# pending k2-node Windows port: k2-node is Unix-only until then.
[target.'cfg(unix)'.dev-dependencies]
k2-node = { path = "../k2-node" }
