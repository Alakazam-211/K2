[package]
name = "k2-mpc-opc"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads and writes docx, pptx and xlsx packages (the Open Packaging Conventions): a bounded zip reader and byte-exact writer, content types, relationships, and a three-way package merge that re-mints colliding part names and relationship ids."

[lib]
name = "k2_mpc_opc"

[features]
# Test-only: planted bugs (`mutant::active`), to prove the tests catch them. Never in a build.
mutants = []

[dependencies]
# XML with byte ranges per node and attribute (MIT OR Apache-2.0); DTDs are refused.
roxmltree = "0.21"
# Deflate (MIT OR Apache-2.0) on miniz_oxide (MIT OR Zlib OR Apache-2.0); no C library.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The zip CRC-32 (MIT OR Apache-2.0).
crc32fast = "1"

[dev-dependencies]
# Test-only judge, independent of this crate's own reader and writer: a second zip reader and
# writer (MIT), deflate only, no other method or crypto.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
