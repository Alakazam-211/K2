# The k5 brand: the name after the rename. crates/k2-brand reads this file
# when K2_BRAND_DIR points here. Alias modes: silent, notice, tombstone.
id = "k5"
schema = 1

[names]
product = "K5"
short = "K5"
company = "Alakazam Labs"
lockup = "K5 by Alakazam Labs"
server = "K5 Server"
# The sign-in screen still says K2 Connect; K2 rules before it changes.
login = "K2 Connect"

[cli]
name = "k5"
aliases = [
    { name = "k2", mode = "notice" },
    { name = "k2so", mode = "silent" },
]

# Packaging values (scripts/brand-values.mjs). Kept as the k2 brand's for
# now: the rename is in place, so the bundle id and the update feed carry
# over (installs update, and what macOS keeps per app id stays). K2 rules
# before any of these changes.
[package]
bundle_id = "dev.k2.app"
update_feed = "https://github.com/Alakazam-211/K2/releases/latest/download/latest.json"
desktop_id = "k2"
gui_binary = "k2-gui"

# The update-signing public keys (see brand/k2; they also carry the Sew
# pins' trust): the same keys as k2, so installs keep updating across the
# rename.
[update]
keys = [
    { role = "primary", key_id = "76CA14D3B7EE2B69", pubkey = "RWRpK+630xTKdopKvlpWVqvnEwqyK1CZ+F5deeRjpGA2ywyWS8NnOrpv" },
    { role = "backup", key_id = "5101A5781A5102A4", pubkey = "RWSkAlEaeKUBUZhQA52GoMLa0rt8KLdEoto26gLHRpm9QIC5ColsvG/Y" },
]

# The fields a hosted box of a brand needs (crates/k2-brand reads them;
# brand/k2 says what each is). Today's values, the same as brand/k2's but
# the names made from the product; K2 rules before any of these changes.

# Where boxes are named. label: the zone a box's name is under
# (<label>.<zone>) until the enrolment answer names it. A partner's box
# has its partner address only, no second name under our zone.
[zones]
label = "k2.dev"

# [control] is left out: brand/k2 spells our control endpoints, and an
# our-brand file may not set them while the bash CLI keeps its own copy
# (brand lint names the line).

# Where updates come from, besides [package] update_feed (the app's):
# the headless daemon's manifest, and where a release's files are.
[feeds]
daemon = "https://github.com/Alakazam-211/K2/releases/latest/download/daemon-latest.json"
downloads = "https://github.com/Alakazam-211/K2/releases/download"

# The names ops scripts find on a box: the home folder, what the programs'
# file names start with (k2-daemon), and what the systemd units' names
# start with (k2-daemon.service). Every brand has these for now.
[machine]
home = ".k2"
binary_prefix = "k2"
unit_prefix = "k2"

# Icons and colours. icons: a folder from the brand folder; left out, the
# app's own (src-tauri/icons). accent: #RRGGBB; left out, the style's own.
[look]

# Where people are sent.
[links]
site = "https://k2.dev"
support_email = "support@k2.dev"
# contact_email and repo: brand/k2 says what each is.
contact_email = "hello@alakazamlabs.com"
repo = "https://github.com/Alakazam-211/K2"
support_url = ""
terms = ""
privacy = ""
dashboard = "https://k2.dev/dashboard"
feedback = "https://feedback.akzm.k2.dev"

# System mail, and whether the brand's boxes may join Postal. There is no
# fleet-wide sender: each box sends from its own server name ({server},
# its <label>.<zone>) through its own hostmail, so SPF, DKIM and DMARC go
# on that name, never on a brand's apex domain.
[mail]
system_from = "noreply@{server}"
system_from_name = "K5"
postal = true

# The phone app the brand's boxes pair with.
[phone]
bundle_id = "com.alakazamlabs.k2so.companion"
team_id = "36B8R93HXV"
push_topic = "com.alakazamlabs.k2so.companion"

# What calls and chat name the service.
[sew]
call_name = "K5"
