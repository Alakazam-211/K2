<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Absolute origin path: edge Worker serves /favicon.ico from R2 loader/. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <title>K2</title>
    <script>
      // Hosted web tab title before React boots: `<sub> | K2` on *.app.k2.dev.
      (function () {
        try {
          var h = (location.hostname || '').toLowerCase();
          if (!h || h === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(h)) {
            if (h === 'localhost') document.title = 'localhost | K2';
            return;
          }
          var sub = h.split('.')[0];
          if (sub) document.title = sub + ' | K2';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      /* Prevent white flash while loading */
      html, body { background: #0a0a0a; margin: 0; padding: 0; }
    </style>
    <script>
      // Stamp Style attributes before first paint so styles.generated.css
      // resolves without a flash. localStorage is this client's own record
      // of the choice (never the daemon's); defaults = the Terminal style.
      // Runs before any module, so retired ids are mapped here too: keep
      // this in step with STYLE_ID_ALIASES (lib/style-resolve.ts).
      (function () {
        var html = document.documentElement;
        function read(key, fallback) {
          try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
        }
        var savedStyle = read('k2.style', 'terminal');
        var style = savedStyle === 'square' || savedStyle === 'bezel' ? 'terminal' : savedStyle;
        html.setAttribute('data-style', style);
        var scheme = read('k2.scheme', 'dark');
        if (scheme === 'auto') {
          scheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        html.setAttribute('data-scheme', scheme);
        // Per-scheme mirror wins: after an OS appearance flip while the
        // app was closed, k2.palette (written under the OLD scheme) is
        // stale but k2.palette.<scheme> is right. stores/style.ts keeps
        // both in sync on every apply.
        var palette = read('k2.palette.' + scheme, '') || read('k2.palette', '');
        // A palette from a retired style (Bezel's graphite / porcelain) is
        // not on Terminal: use Terminal's default for this scheme.
        if (style === 'terminal' && palette !== 'charcoal' && palette !== 'paper') {
          palette = scheme === 'light' ? 'paper' : 'charcoal';
        }
        html.setAttribute('data-palette', palette || 'charcoal');
        // Bezel had no density control, so its saved gaps never carry over.
        var gaps = savedStyle === 'bezel' ? '' : read('k2.gaps', '');
        if (gaps) html.setAttribute('data-gaps', gaps);
        if (scheme === 'light') {
          // Override the dark anti-flash <style> above before first paint.
          html.style.background = '#fafafa';
          document.addEventListener('DOMContentLoaded', function () {
            document.body.style.background = '#fafafa';
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
