[package]
name = "k2-ptyd"
# ptyd has its own version line, independent of the K2 release: the owner
# compares it against its minimum ptyd version, and it is bound into the
# handshake MAC. release.sh does not bump it; it changes only when ptyd
# itself changes. 0.2.0 added exec self-upgrade (`upgrade`, `--selftest`,
# `--resume-state-fd`); a 0.1.x ptyd answers `upgrade` with `unsupported`.
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
description = "A small per-user PTY host: owns terminal sessions in its own process so they survive restarts of the program that drives them."
readme = "README.md"
keywords = ["pty", "terminal", "session", "daemon", "unix"]
categories = ["command-line-interface", "os::unix-apis"]
# repository = TODO: set when this crate is published as kessel-pty.
publish = false

# Deliberately tiny. No tokio, alacritty_terminal, rusqlite, network or TLS
# crates: ptyd is a single point of failure for every session it hosts, so
# its dependency surface stays small and auditable.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "k2-ptyd"
path = "src/main.rs"

# Fake child program used by the integration tests. A plain bin so
# `CARGO_BIN_EXE_k2-ptyd-test-agent` resolves; it is never shipped.
[[bin]]
name = "k2-ptyd-test-agent"
path = "tests/fixtures/test_agent.rs"
test = false
doc = false
