# The pipeline's settings (pipeline/driver.sh reads this file).
# One `key = value` per line; `#` starts a comment line. Nothing here is
# run as shell code. No secrets here: they go in your CI's secret store.

# K5's public repo, the only source the pipeline builds from. It is cloned
# at a release tag on every build; nothing of it is copied into your repo.
upstream = https://github.com/Alakazam-211/K2.git

# Which of its tags are releases: an extended regex on the tag name.
tag_regex = ^v[0-9]+\.[0-9]+\.[0-9]+$

# The first release you build from. Older tags are never picked, even if
# you hold nothing (they predate brand builds).
first_tag = v0.47.0

# Your brand folder, relative to your repo's root.
brand_dir = brand

# Run the live name checks (this host's shells, the package indexes) on
# every build: on or off. They need the network; keep them on in CI.
lint_live = on

# The Rust target the reference pipeline builds. Add more by running the
# driver once per target (see the README, "More targets").
target = x86_64-unknown-linux-gnu

# Publish to your update feed after signing: on or off. Leave it off until
# the K5 tag you build lets a brand build trust its own update key (the
# driver checks the built binaries and refuses otherwise; README, "What a
# K5 tag gives you today").
publish = off

# Your update feed's address, as your users' builds will read it.
feed_url = https://updates.globex.example/studio/

# The public half of your update key (minisign, the base64 line of its
# .pub file). Before signing, the driver checks that the built daemon and
# CLI carry this key and none of K5's own.
update_pubkey = RWQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
