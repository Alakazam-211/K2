reason = "DoS only (abort on a symlink entry with a huge declared size), in ZipArchive::extract(). K2's own zip readers (k2-core fs_extract.rs extract_entries, sim/android/sdk.rs extract, jscheck/inspect.rs load_zip, sim/android/apk.rs read) walk by_index/by_name and read the bytes; none calls extract(). The one extract() caller is tauri-plugin-updater 2.13 extract_zip (Windows only), and src-tauri commands/updater.rs app_update_install passes it only bytes already verified with k2_release_keys. k2-core is on zip 9.0.5 (fixed); left: the updater's zip 4.6.1. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test (its install() changes)."

# zip 4.6.1
[[IgnoredVulns]]
id = "RUSTSEC-2026-0545"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "zip 4.6.1 only, via tauri-plugin-updater 2.13.0 (Windows target only); k2-core, k2-node and k2-deckrender are on zip 9.0.5 (fixed). The flaw is on the AES password read paths (by_index_decrypt, by_name_decrypt) with the aes-crypto feature; this zip build has no features (no aes/hmac deps in Cargo.lock) and the updater never decrypts: its extract_zip reads with ZipArchive, and only bytes app_update_install has already verified. The plugin's webview commands are not granted: src-tauri/capabilities/default.json grants no updater:* permission and the web build shims @tauri-apps/plugin-updater to a no-op; installs go only through K2's own command (src-tauri/src/commands/updater.rs) after k2_release_keys::verify_app_update. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test."

# zip 4.6.1
[[IgnoredVulns]]
id = "RUSTSEC-2026-0548"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "zip 4.6.1 only, via tauri-plugin-updater 2.13.0 (Windows target only); k2-core, k2-node and k2-deckrender are on zip 9.0.5 (fixed). The flaw is in ZipStreamReader / read_zipfile_from_stream, which trust the local headers; the updater's extract_zip reads with ZipArchive (the central directory), and only bytes app_update_install has already verified; k2 zen inspect refuses a bundle whose local headers disagree with its central directory (validate_header_consistency). The plugin's webview commands are not granted: src-tauri/capabilities/default.json grants no updater:* permission and the web build shims @tauri-apps/plugin-updater to a no-op; installs go only through K2's own command (src-tauri/src/commands/updater.rs) after k2_release_keys::verify_app_update. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test."

