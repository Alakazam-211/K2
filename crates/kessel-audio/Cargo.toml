[package]
name = "kessel-audio"
version = "0.1.0"
edition = "2021"
# sonora's MSRV.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "A real-time voice audio pipeline in pure Rust: devices, echo cancellation, noise suppression and gain control, Opus, jitter buffers with loss concealment, mixing and levels."
authors = ["Alakazam Labs"]
readme = "README.md"
keywords = ["audio", "voice", "opus", "echo-cancellation", "jitter-buffer"]
categories = ["multimedia::audio"]
# Not published until the API settles and the release is approved.
publish = false

[features]
default = ["cpal"]
# System audio devices through cpal (CoreAudio, WASAPI, ALSA). Without it only
# the null device backend is available, which needs no audio hardware or
# system libraries. cpal's `realtime` feature stays off: it pulls an MPL-2.0
# crate.
cpal = ["dep:cpal"]
# cpal's PulseAudio host (a pure-Rust protocol client; works on PipeWire
# through pipewire-pulse).
pulseaudio = ["cpal", "cpal/pulseaudio"]

[dependencies]
bytes = "1"
crossbeam-queue = "0.3"
rtrb = "0.3"
# Pinned exactly: echo cancellation behaviour and the AGC2 tuning were
# measured against this version. Changing it means re-running the metric tests.
sonora = "=0.2.0"
# Pure-Rust Opus, bit-exact with the reference implementation (encode and
# decode, including DTX, in-band FEC and PLC).
ropus = "=0.12.18"
rubato = "5.0.1"
cpal = { version = "0.18.2", optional = true, default-features = false }

[dev-dependencies]
rustfft = "6"
serde_json = "1"

[lints.rust]
missing_docs = "warn"
