[package]
name = "k5-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The k5 command line in Rust, built piece by piece: it answers --version itself and hands every other verb, byte for byte, to the shell CLI it carries inside; and the JSON printer, query escaping, name, settings and paths that write and resolve what the shell CLI does, through k2-client."

[lib]
path = "src/lib.rs"

# Never named `k5`: the binary is k5-cli everywhere it ships (K2.app's
# Contents/MacOS, beside the Linux daemon); only the owner's "New k5
# command (Beta)" switch points the k2 and k5 links at it
# (tests/packaging/k5_cli_shipped_off_by_default.sh).
[[bin]]
name = "k5-cli"
path = "src/main.rs"

# The JSON printer has to match Python byte for byte, and serde_json differs
# on numbers and key order, so it is our own. k2-client holds the one
# registry of setting names, the brand's names and the K2 home's paths; the
# CLI reads them there and keeps no copy. flate2 unpacks the shell CLI the
# binary carries and blake3 checks it, in full, every run, before it runs:
# on an x86_64 CPU without SHA instructions sha256 took about 21 ms of each
# run for the 5.6 MB script, BLAKE3 under 2 ms (tests/cli/perf_cli.sh).
# blake3 has k2-daemon's requirement and its default features. All three
# are already in the workspace, so Cargo.lock gains no crate.
[dependencies]
blake3 = "1"
flate2 = "1.1.9"
k2-client = { path = "../k2-client" }
# The person's proxy as curl picks it from the environment, and the tunnel
# through it (HTTP CONNECT, an https:// proxy, SOCKS4/4a/5/5h): our own
# crate, MIT OR Apache-2.0, std and rustls only (no provider: the
# transport hands it the ring config every https:// call uses).
proxy-env = { path = "../proxy-env" }
# The update keys `daemon install` verifies with: the daemon's own list,
# compiled from this build's brand file. Verify-only and light (minisign-verify,
# base64, serde_json); all already in Cargo.lock.
k2-release-keys = { path = "../k2-release-keys" }
# TLS for a server on another machine (`talk ws@host`, `read ws@host`,
# a Connect host's tray upload). rustls with the ring
# provider (no aws-lc-rs, so no C toolchain and no OpenSSL terms), over
# our own HTTP/1.1 client (src/transport/tls.rs), and the OS's root
# certificates as curl trusts them (rustls-native-certs; it reads
# SSL_CERT_FILE too). The daemon uses both at these versions, so
# Cargo.lock gains no package.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# libc (Unix): a broken pipe on stdout ends the process by SIGPIPE, as the
# shell CLI's does (src/out/mod.rs); the notice test opens a pseudo
# terminal; and bash inherits the one descriptor of the file the front
# hashed, so it runs that very file (`/dev/fd/N`). k2-client already
# depends on it, so Cargo.lock gains no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys (Windows): the console for `app shell` (raw mode, the
# window's size), what stdin is (a pipe or a file, `app exec`), and the
# system's random bytes where Unix reads /dev/urandom (src/sysrand.rs).
# k2-client and k2-core already use 0.61, so Cargo.lock gains no crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# build.rs packs cli/k2 into the binary: gzip, and its BLAKE3 (a brand
# with no shell CLI, cli.no_bash, packs nothing). k2-brand gives it the
# command's name of this build (K2_BRAND_DIR), so a brand's build embeds
# its pages with its own name (src/brand_text.rs), and cli.no_bash. k2-brand
# is in the workspace already, so Cargo.lock gains no crate.
[build-dependencies]
blake3 = "1"
flate2 = "1.1.9"
k2-brand = { path = "../k2-brand" }

# The TLS tests mint a throwaway CA and server certificate at run time, so
# no key is committed. ring, as the client; the version k2-core uses.
[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
