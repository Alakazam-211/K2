# Built-in Zen page template `k2.texting@1` (prd-zen-mode-v1 Z10,
# prd-zen-gardens-v1 G11): Garden 1, the first Garden.
#
# Data, not special code: `/cli/zen/get?garden=` returns this layout, these
# widgets and these controls as the resolved page, and the renderer draws
# from it. A Garden file (`gardens/<id>.toml`) may replace the layout and
# the built-in widgets with the same shape (G38); the controls always come
# from the template.
id = "k2.texting@1"
schema = 1

[layout]
kind = "columns"

[[layout.column]]
widget = "agents"
size = 34
min-width = 240

[[layout.column]]
widget = "conversation"
size = 66
min-width = 360

# Every widget, built-ins included, reaches K2 only through the Zen bridge.
# `caps` are the bridge verbs' capabilities this widget is granted; a
# built-in is granted by K2 (source "builtin"), never by grants.json.
[[widget]]
id = "agents"
kind = "agents"
column = 0
caps = ["agents:read", "agents:add", "presence:read"]

[widget.props]
# The widget's own Home picker (G27): it shows any Home's agents without
# moving the Home page's selection.
home-picker = true
order = "home"
server-tag = true
preview = true
status = ["working", "idle", "needs-you"]

[[widget]]
id = "conversation"
kind = "conversation"
column = 1
caps = ["agents:read", "presence:read", "thread:read", "thread:post"]

[widget.props]
compose = true
attachments = true
load-older = true

# The thin left rail (Rosson 2026-10-04): My Home (current), Agents,
# Projects, Tickets. Drawn at the left edge of column 0, outside the Agents
# box; the app pages leave Zen in this window. Blank Gardens don't get it.
[[widget]]
id = "nav"
kind = "nav-rail"
column = 0
caps = ["app:navigate"]

# Controls (Z27, G24). The page draws them; K2 binds them and checks the
# required two (`zen-toggle`, `garden-switcher`). The drag strip is bound for
# window drag but never checked. One top band: the Garden switcher (top
# left), the drag strip, then the top-right cluster — K2's theme control
# immediately left of the Zen toggle, the way out, in the top-right corner
# (where the top bar's Zen toggle is outside Zen). Add agent is the Agents
# widget's last row, in its bottom-left corner.
[[control]]
kind = "garden-switcher"
placement = "top-left"

[[control]]
kind = "drag-region"
placement = "top"

[[control]]
kind = "zen-toggle"
placement = "top-right"

# Optional: opens K2's Add agent picker for the Agents widget's Home
# (`agents.add`). Drawn by that widget as its list's last row.
[[control]]
kind = "add-agent"
placement = "widget-bottom-left"
widget = "agents"
