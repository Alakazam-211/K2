# Linux app bundles (0.40.31 "K2 on Linux").
#
# release.sh (maintainer macOS box) builds + signs + notarizes the macOS
# app; daemon-binaries.yml builds the standalone Linux daemon. This
# workflow produces the Linux APP bundles (deb / rpm / AppImage) on the
# AX41 self-hosted runner (`k2-linux`) and uploads them to the SAME
# GitHub release. Not GitHub-hosted ubuntu-latest.
#
# Trigger: a pushed release tag (v<x.y.z>), same convention as
# daemon-binaries.yml. x86_64 only for now — aarch64 app bundles need a
# native arm runner (webkit2gtk is not realistically cross-compiled) and
# are deliberately out of scope until we have one.
#
# The tauri beforeBuildCommand runs `vite:build` + scripts/fetch-frpc.sh,
# which on Linux downloads the pinned frp release from GitHub, verifies
# its sha256 against the release manifest, and stages the frpc sidecar
# for the target triple. No secrets required: Linux bundles are unsigned
# today (apt-repo GPG signing is a separate, maintainer-keyed step).

name: app-linux

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag that already exists (e.g. CI was added after
  # the tag, or a transient failure). Provide the tag, e.g. v0.40.31.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build + attach Linux app bundles to (e.g. v0.40.31)"
        required: true

permissions:
  contents: write # upload assets to the GitHub release

# Shared with daemon-binaries.yml — one AX41 runner, no parallel pile-up.
concurrency:
  group: k2-linux-ship
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: /home/k2-ci/cargo-target

jobs:
  build-linux-app:
    name: Build K2 app bundles (x86_64 deb/rpm/AppImage)
    runs-on: [self-hosted, linux, k2-linux]
    outputs:
      sums_b64: ${{ steps.collect.outputs.sums_b64 }}
    steps:
      - name: Checkout (at the release tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-22)

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app-linux-x86_64
          # Self-hosted k2-linux shares k2-ci's ~/.cargo with the release gate.
          # rust-cache's bin cleanup deleted ~/.cargo/bin/rustup after a job
          # (0.41.6 daemon-binaries ended 05:46Z, the moment rustup vanished),
          # which broke the next release gate with `cargo: command not found`.
          cache-bin: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # webkit2gtk/gtk stack for the Tauri app + the same C/C++ toolchain
      # daemon-binaries.yml uses for ggml/libgit2/sqlite build scripts.
      # AX41 already has these once; skip apt when k2-ci has no sudo.
      - name: Install build dependencies
        run: |
          if ! sudo -n true 2>/dev/null; then
            echo "no passwordless sudo — using preinstalled AX41 toolchain"
            command -v cmake
            command -v pkg-config
            pkg-config --exists webkit2gtk-4.1
            exit 0
          fi
          # Leftover ubuntu-latest third-party apt repos (microsoft/azure-cli)
          # whose mirror intermittently serves a corrupt InRelease ("NOSPLIT"),
          # failing `apt-get update` with exit 100. We don't install anything
          # from those repos, so drop them before updating.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev file \
            xdg-utils

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The runner keeps CARGO_TARGET_DIR (and the workspace) between runs,
      # so the bundle folders still hold every earlier version's .deb/.rpm/
      # .AppImage. Empty them first; the collect step below also matches
      # this build's exact version, so a leftover can never ride along.
      - name: Clean old bundle outputs
        run: |
          TARGET_DIR="${CARGO_TARGET_DIR:-target}"
          rm -rf "$TARGET_DIR/release/bundle/deb" \
                 "$TARGET_DIR/release/bundle/rpm" \
                 "$TARGET_DIR/release/bundle/appimage" \
                 dist-linux

      # beforeBuildCommand handles vite:build + fetch-frpc (sidecar).
      - name: Build Linux bundles (deb, rpm, AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # linuxdeploy without FUSE
        run: bunx tauri build --bundles deb,rpm,appimage

      - name: Collect + checksum artifacts
        id: collect
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # The tag and the app's own version must agree, or the names
          # below would pick nothing (or the wrong build).
          # python3, not node: the k2-linux runner has no node on PATH
          # (bun runs the build; node only exists inside bunx).
          CONF_VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if [ "$CONF_VERSION" != "$VERSION" ]; then
            echo "tag $TAG but tauri.conf.json says $CONF_VERSION" >&2
            exit 1
          fi
          # Runner .env sets CARGO_TARGET_DIR=/home/k2-ci/cargo-target
          TARGET_DIR="${CARGO_TARGET_DIR:-target}"
          B="$TARGET_DIR/release/bundle"
          rm -rf dist-linux
          mkdir -p dist-linux
          # Exactly this build's three files, by exact name (tauri's naming:
          # productName K2). A missing one fails the job instead of
          # uploading a partial or stale set.
          for f in "$B/deb/K2_${VERSION}_amd64.deb" \
                   "$B/rpm/K2-${VERSION}-1.x86_64.rpm" \
                   "$B/appimage/K2_${VERSION}_amd64.AppImage"; do
            if [ ! -f "$f" ]; then
              echo "missing bundle: $f" >&2
              ls -la "$B"/deb "$B"/rpm "$B"/appimage >&2 || true
              exit 1
            fi
            cp "$f" dist-linux/
          done
          # Our three lines only. The `sums` job merges them into the
          # release's SHA256SUMS-linux-x86_64.txt, keeping the Arch
          # package's line (arch-package.yml) whichever run finishes last.
          (cd dist-linux && sha256sum K2_* K2-* | tee app-linux.sums)
          echo "sums_b64=$(base64 -w0 dist-linux/app-linux.sums)" >> "$GITHUB_OUTPUT"
          ls -la dist-linux

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Name every file: never a glob over a folder that could hold
          # another build's output.
          gh release upload "$TAG" --clobber \
            "dist-linux/K2_${VERSION}_amd64.deb" \
            "dist-linux/K2-${VERSION}-1.x86_64.rpm" \
            "dist-linux/K2_${VERSION}_amd64.AppImage"

  # Merge our three lines into the release's SHA256SUMS-linux-x86_64.txt
  # (scripts/linux-sums.sh): create it on the first run, otherwise replace
  # our lines and keep every other line (the Arch package's). Shares
  # k2-linux-sums-<tag> with arch-package.yml's merge job so the two
  # read-modify-writes never overlap. Never --clobber a whole new file.
  sums:
    name: Merge into SHA256SUMS-linux-x86_64.txt
    needs: build-linux-app
    runs-on: [self-hosted, linux, k2-linux]
    timeout-minutes: 15
    concurrency:
      group: k2-linux-sums-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout (for scripts/linux-sums.sh)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Merge the lines into the release SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          K2_RELEASE_REPO: ${{ github.repository }}
          SUMS_B64: ${{ needs.build-linux-app.outputs.sums_b64 }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test -n "$SUMS_B64"
          printf '%s' "$SUMS_B64" | base64 -d > "$RUNNER_TEMP/app-linux.sums"
          test "$(grep -c . "$RUNNER_TEMP/app-linux.sums")" = 3
          scripts/linux-sums.sh merge "$TAG" "$RUNNER_TEMP/app-linux.sums" --create-if-missing
