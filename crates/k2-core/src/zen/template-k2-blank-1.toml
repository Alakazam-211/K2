# Built-in Zen page template `k2.blank@1` (prd-zen-gardens-v1 G11, G28):
# Garden 2 (made by setup) and every new Garden start here.
#
# One column holding the `garden-empty` widget: "This Garden is empty. Ask
# your agents to add things to this Garden." plus an Ask my agent button
# and "Start with the default", which turns this Garden into Garden 1's
# texting page (`gardens.useTemplate`, cap `gardens:template`).
# When the Garden's file declares `[[widget]]`, those widgets replace it;
# the controls below stay.
id = "k2.blank@1"
schema = 1

[layout]
kind = "columns"

[[layout.column]]
widget = "garden-empty"
size = 100
min-width = 320

[[widget]]
id = "garden-empty"
kind = "garden-empty"
column = 0
caps = ["agents:read", "thread:read", "thread:post", "gardens:template"]

# Controls (G24). K2 binds them and checks the required two (`zen-toggle`,
# `garden-switcher`); the drag strip is bound, never checked. Same top band
# as Garden 1: switcher top left, Zen toggle top right. No Add agent: a
# blank Garden has no Agents widget to add to.
[[control]]
kind = "garden-switcher"
placement = "top-left"

[[control]]
kind = "drag-region"
placement = "top"

[[control]]
kind = "zen-toggle"
placement = "top-right"
