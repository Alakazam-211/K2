<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diary</title>
  <link rel="stylesheet" href="diary.css">
</head>
<body>
  <main class="book" id="book" aria-live="polite">
    <div class="ribbon" id="ribbon" aria-hidden="true"></div>

    <section class="page contents" id="contents" aria-label="Contents">
      <header class="page-head">
        <h1 class="title" id="title">Diary</h1>
        <p class="subtitle">Choose who to write to.</p>
      </header>
      <label class="search">
        <span class="sr">Search your agents</span>
        <input id="search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      </label>
      <ol class="toc" id="toc"></ol>
      <p class="empty" id="toc-empty" hidden></p>
    </section>

    <section class="page leaf" id="leaf" aria-label="Diary page" hidden>
      <header class="page-head leaf-head">
        <button class="link back" id="back" type="button" title="Contents">Contents</button>
        <div class="who">
          <h2 class="agent" id="agent"></h2>
          <p class="where" id="where"></p>
        </div>
        <span class="bookmark" id="bookmark" title="Needs you" hidden></span>
      </header>

      <div class="sheet" id="sheet">
        <p class="date" id="date"></p>
        <div class="entries" id="entries"></div>
        <div class="shimmer" id="shimmer" hidden aria-label="Writing…"><span></span><span></span><span></span></div>
        <p class="note" id="note" hidden></p>
        <form class="pen" id="pen" hidden>
          <label class="sr" for="ink">Write to this agent</label>
          <textarea id="ink" rows="4" placeholder="Write here…" spellcheck="true"></textarea>
          <div class="soak" id="soak" aria-hidden="true"></div>
          <div class="pen-row">
            <span class="hint" id="hint">Enter to send · Shift+Enter for a new line</span>
            <button class="link send" id="send" type="submit">Send</button>
          </div>
        </form>
      </div>

      <footer class="page-foot">
        <button class="turn" id="prev" type="button" title="Earlier page" aria-label="Earlier page">‹</button>
        <span class="folio" id="folio"></span>
        <button class="turn" id="next" type="button" title="Later page" aria-label="Later page">›</button>
      </footer>
    </section>
  </main>
  <script src="diary.js"></script>
</body>
</html>
