[package]
name = "k2-node"
# Versioned by k2-node-proto's PROTOCOL, not the product version.
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "K2 compute node runtime: runs a controller's jobs as its own OS user. Never links k2-core or k2-daemon (CN26)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "k2-node"
path = "src/main.rs"

[features]
# TEST ONLY: also trust the TEST minisign key for self-update, honour the
# K2_NODE_ADMIN_TEST_HOOK service-manager stand-in, and allow build.rs's
# version/broken overrides. Release builds never enable it; release
# signing refuses a binary containing K2_NODE_TEST_KEYS_ENABLED.
test-keys = ["k2-root-proto/test-signer"]
# The live iPhone test (tests/sim_live_macos.rs): a whole session through
# k2-node and simhost on a Mac with Xcode and an iOS runtime. Without this
# feature it doesn't compile; with it, a missing Xcode is a failure, never a skip.
sim-live = []

[[test]]
name = "sim_live_macos"
path = "tests/sim_live_macos.rs"
required-features = ["sim-live"]

[[example]]
name = "k2-node-testsign"
path = "examples/testsign.rs"
required-features = ["test-keys"]

[dependencies]
k2-node-proto = { path = "../k2-node-proto" }
# The vault's exact-value redactor (compute secret-env SE23/SE24b): a secret
# job's output is redacted before it reaches the journal.
k2-redact = { path = "../k2-redact" }
# Signed node builds use the root-helper key + verifier (node admin §8.1).
k2-root-proto = { path = "../k2-root-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "fs", "sync", "signal"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip 9's deflate-flate2 takes flate2 with no backend; without a crate that
# picks one, `cargo test -p k2-node` alone stops at flate2's compile_error.
# flate2's default (rust_backend, miniz_oxide) is the one already in the tree.
flate2 = "1.1.9"
tokio = { version = "1", features = ["full", "test-util"] }
k2-root-proto = { path = "../k2-root-proto", features = ["test-signer"] }
# Hostile `.app` uploads in simhost's tests (k2-node-proto already uses it).
tar = "0.4"
