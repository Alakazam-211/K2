# bincode 1.3.3
[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2026-12-05T00:00:00Z
reason = "Unmaintained (no known vulnerability). One use: k2-core's ptyd saved-screen file (terminal/ptyd/snapshot.rs, 0.46.5 S4), K2's own file (0600 in a 0700 dir under <K2 home>/run), written and read by the same daemon user. Decode is bounded: magic + FORMAT header, a file of at most 64 MiB, gzip inflate capped at 256 MiB, bincode with_limit, then a trial restore under catch_unwind; anything else is removed and the session replays from the ring. Fix: 0.46.6 replaces the codec (postcard as FORMAT 2, keeping a read-only FORMAT 1 reader for one release), then drop bincode."

# block-buffer 0.10.4
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "The advisory is the inline cursor of block-buffer 0.11+/0.12 (EagerBuffer's position in the block's last byte, ReadBuffer::write_block). 0.10.4 keeps the cursor in its own pos: u8 field and has no ReadBuffer: a compress that panics leaves pos at its old, in-bounds value. It also needs the hash's own compress to panic and a caller to catch it and keep hashing; RustCrypto's compress functions don't panic. Comes through digest 0.10 (sha2, hmac, rsa, ed25519...). Fix: the RustCrypto digest 0.11 generation (a major bump)."

