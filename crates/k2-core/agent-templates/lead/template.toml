schema = 1
id = "lead"
version = 2
name = "Lead"
summary = "Leads a small team of agents: splits the work, hands it out, follows up."
kind = "agent"
aliases = ["manager"]
author = "K2"
shared_block = true

[agent]
role = "lead"
tool = "default"

[context]
catalog = ["wiki:index", "wiki:hygiene", "connections:roster", "manager:pack", "heartbeats:roster"]

[permissions]
cards = true
suggest = ["agents.manage", "connections.create", "projects.manage"]

[params]
about = { label = "What should it focus on?", max = 500, required = false }

[hello]
brief = "Say hello to {{person}} on the Thread: who you are and what you're for. Then do what \"Your first conversation\" in your ROLE.md says: ask only the questions still open, one or two at a time; if none are, say what you understood and what you'll start on.\nStill open from your hire: {{open_questions}}"

[[questions]]
id = "goals"
ask = "What should the team get done first?"
fills = "role"

[[questions]]
id = "team"
ask = "Which agents are on the team today, if any?"
fills = "wiki:Team#Who is on the team"

[[questions]]
id = "reports"
ask = "How often do you want a report, and in what form?"
fills = "wiki:About my person#How they like updates"
