[package]
name = "vp8-decoder"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
# A port of the RFC 6386 Section 20 reference decoder (BSD-3-Clause, see
# NOTICE and PROVENANCE.md); our own code is MIT OR Apache-2.0.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
description = "A VP8 video decoder in pure Rust (RFC 6386), conformance-tested on the WebM test vectors, with NEON and SSE2 loop filters."
authors = ["Alakazam Labs"]
readme = "README.md"
homepage = "https://github.com/Alakazam-211/K2/tree/main/crates/vp8-decoder"
documentation = "https://docs.rs/vp8-decoder"
repository = "https://github.com/Alakazam-211/K2"
keywords = ["vp8", "video", "decoder", "codec", "webrtc"]
categories = ["multimedia::video", "multimedia::encoding"]
# What the .crate holds: the source, README, CHANGELOG, the licences, NOTICE
# (the BSD-3-Clause notice, which the licence requires to travel with the
# code) and PROVENANCE.md. Tests, examples, benches and scripts stay in the
# repository.
include = ["/src/**/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/PROVENANCE.md"]

[lib]
name = "vp8_decoder"

[features]
# Tests only: the WebM test vectors (needs VP8_TEST_VECTORS; see
# scripts/fetch-test-vectors.sh).
conformance = []

[dev-dependencies]
serde_json = "1"

[[test]]
name = "conformance"
required-features = ["conformance"]

[[bench]]
name = "decode"
harness = false

[lints.rust]
missing_docs = "warn"
# `--cfg vp8_stage_timers`: per-stage timers for profiling (decode_speed).
# `--cfg vp8_portable`: no NEON on aarch64, to compare the two paths.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vp8_stage_timers)", "cfg(vp8_portable)"] }
