[package]
name = "kessel-video"
version = "0.1.5"
edition = "2021"
# zbus 5's minimum (with zvariant and zbus_macros), for the Linux backend.
# The windows crate (0.62) needs 1.82.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Cameras, screen capture, pixels and video codecs for apps that bring their own transport: H.264 through the operating system's codecs, VP8 in pure Rust, a codec-neutral submit-and-poll API, and a scripted fake backend for tests."
authors = ["Alakazam Labs"]
readme = "README.md"
documentation = "https://docs.rs/kessel-video"
repository = "https://github.com/Alakazam-211/K2"
keywords = ["video", "camera", "screen-capture", "h264", "vp8"]
categories = ["multimedia::video", "multimedia::encoding"]
# Only the code, the README, the changelog and the licences ship. Everything
# else stays in the repository: tests/ (tests/scrub.rs is the repository's own
# publish check), scripts/ and deny.toml. The leading / anchors each pattern at
# the crate root, so a file of the same name deeper in the tree can't match.
include = ["/src/", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[features]
# The API types and traits, `null()` and `fake` need no feature, no OS
# library and no `unsafe`.
default = ["system"]
# `fake::FakeBackend` is always compiled; this feature exists so a
# consumer's own test feature can name it.
fake = []
# macOS and iOS: AVFoundation, VideoToolbox, and ScreenCaptureKit (macOS
# only). System frameworks through FFI; no codec library is linked or shipped.
apple = ["dep:objc2", "dep:block2"]
# Media Foundation cameras, Windows Graphics Capture screens, and H.264
# through Media Foundation's MFTs (the GPU driver's or Microsoft's own). OS
# components through the `windows` crate.
windows = ["dep:windows", "dep:windows-future"]
# V4L2 cameras (raw ioctls) and the xdg-desktop-portal ScreenCast (zbus,
# pure Rust) with PipeWire (the system's libpipewire, loaded at run time:
# nothing to install at build time). No H.264: Linux has no OS codec.
linux = ["dep:libc", "dep:zbus", "dep:serde"]
# Camera2 cameras and MediaCodec H.264 encoding through the NDK's system
# libraries (libcamera2ndk, libmediandk), declared in Rust: no build script,
# no C, nothing vendored. Needs API 24. Screen capture runs from a
# MediaProjection the app hands over (its consent and foreground service
# are the app's Java or Kotlin), through JNI, on API 26+.
android = []
# VP8 encoding and decoding in pure Rust (the vp8-encoder and vp8-decoder
# crates) as software codecs in every backend.
vp8 = ["dep:vp8-decoder", "dep:vp8-encoder"]
# The OS backend for the target, plus VP8. Naming all four is safe: each
# backend's dependencies are target-specific and its code is cfg-gated to
# its OS, so a Linux build compiles only the Linux backend (Cargo features
# can't be target-gated themselves).
system = ["apple", "windows", "linux", "android", "vp8"]

# Every dependency comes from crates.io as a caret requirement, so library
# users get patch and security releases (vp8-decoder decodes frames that come
# from the network); apps pin through their Cargo.lock.
[dependencies]
# 1.9: `Bytes::from_owner`, which hands converted frames' memory back to
# their pool.
bytes = "1.9"
crossbeam-queue = "0.3"
thiserror = "2"
# The published VP8 crates. vp8-encoder pins vp8-decoder exactly (they share
# hidden modules), so the two always resolve as a matching pair.
vp8-decoder = { version = "0.1", optional = true }
vp8-encoder = { version = "0.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
serde = { version = "1", optional = true }
zbus = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
