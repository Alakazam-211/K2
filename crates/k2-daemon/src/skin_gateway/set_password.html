<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set your password — K2</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f6f4; color: #1d1d1b; }
    main { max-width: 22rem; margin: 12vh auto; padding: 1.5rem; background: #fff; border: 1px solid #ddd; }
    h1 { font-size: 1.1rem; margin: 0 0 .75rem; }
    label { display: block; margin: .75rem 0; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; border: 1px solid #bbb; }
    button { padding: .5rem 1rem; font: inherit; background: #1d1d1b; color: #fff; border: 0; cursor: pointer; }
    .err { color: #a4262c; }
    .fine { font-size: .8rem; color: #666; }
  </style>
</head>
<body>
  <!-- K2's own set-password page (agent-app-users): served by K2, never by
       an App, so a link K2 sends for the owner always lands here. -->
  <main>
    <h1>Set your password</h1>
    <form id="f">
      <label>New password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <p id="err" class="err" hidden></p>
      <p id="ok" hidden>Your password is set. Sign in with it now.</p>
      <button type="submit">Set password</button>
    </form>
    <p class="fine">This link works once. If you didn't ask for it, close this page.</p>
  </main>
  <script>
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    const fromHash = (h) => {
      const raw = decodeURIComponent((h || "").replace(/^#/, ""));
      return raw.startsWith("token=") ? raw.slice(6) : raw;
    };
    // The token leaves the address bar at once (it never sits in history),
    // but this tab keeps it, so a reload or the same URL pasted again here
    // still works (0.46.6). It is cleared once the password is set.
    const KEY = "k2-set-password-token";
    const keep = {
      get() { try { return sessionStorage.getItem(KEY) || ""; } catch (_) { return ""; } },
      set(v) { try { sessionStorage.setItem(KEY, v); } catch (_) {} },
      clear() { try { sessionStorage.removeItem(KEY); } catch (_) {} },
    };
    const fresh = fromHash(location.hash);
    if (fresh) keep.set(fresh);
    const token = fresh || keep.get();
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      err.hidden = true;
      ok.hidden = true;
      if (!token) {
        err.textContent = "This page needs the link from your email.";
        err.hidden = false;
        return;
      }
      const fd = new FormData(e.target);
      const r = await fetch("/cli/skin/password/reset", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token, password: fd.get("password") }),
        credentials: "omit",
        referrerPolicy: "no-referrer",
      });
      if (!r.ok) {
        let code = "";
        try { code = ((await r.json()).error || {}).code || ""; } catch (_) { code = ""; }
        err.textContent = code === "password_unchanged"
          ? "Choose a new password, not the temporary one you were given."
          : r.status === 400 ? "The password must be at least 8 characters." : "This link was already used or has expired.";
        err.hidden = false;
        return;
      }
      keep.clear();
      ok.hidden = false;
    });
  </script>
</body>
</html>
