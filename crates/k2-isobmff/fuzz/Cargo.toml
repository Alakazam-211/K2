[package]
name = "k2-isobmff-fuzz"
version = "0.0.0"
license = "MIT"
edition = "2021"
publish = false
description = "cargo-fuzz targets for k2-isobmff: the reader (open, every sample, sample bytes, timecode, configurations) and the H.264 Annex B conversion. A panic, a fault, a hang or an allocation past libFuzzer's limit is a finding."

[package.metadata]
cargo-fuzz = true

# Its own workspace: never a member of the repository's, so a normal build
# doesn't pull libFuzzer, and nothing here ships.
[workspace]

[dependencies]
# MIT OR Apache-2.0 with libFuzzer's NCSA: test tooling only, never shipped.
libfuzzer-sys = "0.4"
k2-isobmff = { path = ".." }

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annexb"
path = "fuzz_targets/annexb.rs"
test = false
doc = false
bench = false
