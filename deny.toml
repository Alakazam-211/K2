# The app-wide cargo-deny policy: what K2 ships (the app, the daemon and
# their workers), checked against the real Cargo.lock.
#
#   bash scripts/ci/cargo-deny.sh            (scripts/ci/checks.sh audit runs it)
#
# The script runs `cargo deny --manifest-path <crate>/Cargo.toml check
# --config deny.toml advisories bans licenses sources` once per shipped
# crate, each with its own default features: the features the release
# builds use (scripts/lib/build-binaries.sh, scripts/ci/build-linux-bins.sh,
# scripts/windows/build-nsis-release.ps1). Never --all-features: test-only
# features (test-keys, test-hostile, provider-fakes, sew-test-pins...) are
# not shipped. The shipped crate list is in that script.
#
# One policy for the app. The deny.toml files under crates/ stay for those
# crates' own published checks; this gate reads only this file.

[graph]
# Every target the app and its workers ship: Linux x86 and Arm (the daemon,
# k2-node, the root helper, the App engine, the Linux app), the Mac (Apple
# silicon only: no Intel build ships) and Windows (the NSIS Alpha).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    # Once a wasm build ships:
    # "wasm32-unknown-unknown",
]
# Dev-dependencies are not shipped. Build-time (proc-macro, build-script)
# dependencies stay in the check.
exclude-dev = true

[advisories]
# The RustSec database, fetched at check time. A vulnerability in a shipped
# crate fails the check, and so do unmaintained and unsound notices (the
# cargo-deny defaults, kept). Every ignore carries its reason here and has
# its entry, with a review-by date, in osv-scanner.toml (the advisory
# ledger; scripts/ci/audit-ignores.py checks both). The reasons below are
# the ledger's; renew or drop an entry in both places.
# The list covers all twelve crate trees, so most runs meet only some of it.
unused-ignored-advisory = "allow"
ignore = [
    # rsa 0.9.10 (k2-vault directly and via ssh-key 0.6.7)
    { id = "RUSTSEC-2023-0071", reason = "K2's only RSA private-key operation is k2-vault's ssh-agent signing (ssh_agent.rs AgentKey::sign): PKCS#1 v1.5 signatures, SHA-2 only, through rsa's try_sign_with_rng, which blinds the exponentiation with a fresh random factor and checks the result (rsa_decrypt_and_check). K2 does no RSA decryption, so Marvin's padding oracle has nothing to query, and ssh-key's own unblinded RSA signer is never called (RSA keys go through to_rsa). The agent socket serves same-uid peers only (SO_PEERCRED / getpeereid). A remote ssh server can time only signatures over a padded hash it can't choose, a burst of 60 and 240/min per (session, secret) by default; forwarded connections are refused by default (that check trusts the client's session-bind). No fixed rsa release exists: revisit when upstream's constant-time rewrite (rsa 0.10) ships." },
    # proc-macro-error 1.0.4
    { id = "RUSTSEC-2024-0370", reason = "Unmaintained proc-macro helper (build time only), via gtk-rs 0.18 macros of the Linux Tauri stack. Revisit with Tauri's gtk-rs update." },
    # instant 0.1.13
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained (no known vulnerability); via notify 7 -> notify-types. Revisit with notify 8." },
    # unsafe-libyaml 0.2.11
    { id = "RUSTSEC-2024-0449", reason = "Unmaintained; via serde_yaml (deprecated) in k2-core for frontmatter/YAML the workspace owns. Replace serde_yaml (dependency PRD)." },
    # rustls-pemfile 2.2.0
    { id = "RUSTSEC-2025-0134", reason = "Unmaintained (functionality moved into rustls-pki-types); used to read local PEM files (k2-core, k2-daemon, native-certs). No known vulnerability. Replace with rustls-pki-types' PEM API." },
    # bincode 1.3.3
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained (no known vulnerability). One use: k2-core's ptyd saved-screen file (terminal/ptyd/snapshot.rs, 0.46.5 S4), K2's own file (0600 in a 0700 dir under <K2 home>/run), written and read by the same daemon user. Decode is bounded: magic + FORMAT header, a file of at most 64 MiB, gzip inflate capped at 256 MiB, bincode with_limit, then a trial restore under catch_unwind; anything else is removed and the session replays from the ring. Fix: 0.46.6 replaces the codec (postcard as FORMAT 2, keeping a read-only FORMAT 1 reader for one release), then drop bincode." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0008", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature; K2 calls none of these (grep: git_changes.rs uses status/diff only). Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # rustls-webpki 0.102.8
    { id = "RUSTSEC-2026-0049", reason = "0.102.8 only via imap -> rustls-connector 0.19 (IMAP client, OS roots via native-certs). K2 parses no CRLs; name-constraint and distrusted-intermediate issues matter only with a hostile CA. Fix: move imap off rustls-connector 0.19." },
    # rustls-webpki 0.102.8
    { id = "RUSTSEC-2026-0098", reason = "0.102.8 only via imap -> rustls-connector 0.19 (IMAP client, OS roots via native-certs). K2 parses no CRLs; name-constraint and distrusted-intermediate issues matter only with a hostile CA. Fix: move imap off rustls-connector 0.19." },
    # rustls-webpki 0.102.8
    { id = "RUSTSEC-2026-0099", reason = "0.102.8 only via imap -> rustls-connector 0.19 (IMAP client, OS roots via native-certs). K2 parses no CRLs; name-constraint and distrusted-intermediate issues matter only with a hostile CA. Fix: move imap off rustls-connector 0.19." },
    # rustls-webpki 0.102.8
    { id = "RUSTSEC-2026-0104", reason = "0.102.8 only via imap -> rustls-connector 0.19 (IMAP client, OS roots via native-certs). K2 parses no CRLs; name-constraint and distrusted-intermediate issues matter only with a hostile CA. Fix: move imap off rustls-connector 0.19." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0183", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature; K2 calls none of these (grep: git_changes.rs uses status/diff only). Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0184", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature; K2 calls none of these (grep: git_changes.rs uses status/diff only). Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # ttf-parser 0.21.1
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained (no known vulnerability); via fontdue in k2-core's terminal font renderer, which only loads K2's own bundled Meslo font (include_bytes). Revisit with a fontdue update." },
    # quick-xml 0.38.4, quick-xml 0.39.2
    { id = "RUSTSEC-2026-0194", reason = "Quadratic attribute check / NsReader allocation DoS. 0.38: k2-core thumbs.rs and k2-node-proto results.rs parse local or job-produced XML (no NsReader), plus tauri's plist at build time; 0.39: wayland-scanner proc-macro at build time. Fix: quick-xml 0.41." },
    # quick-xml 0.38.4, quick-xml 0.39.2
    { id = "RUSTSEC-2026-0195", reason = "Quadratic attribute check / NsReader allocation DoS. 0.38: k2-core thumbs.rs and k2-node-proto results.rs parse local or job-produced XML (no NsReader), plus tauri's plist at build time; 0.39: wayland-scanner proc-macro at build time. Fix: quick-xml 0.41." },
    # smallstr 0.3.1
    { id = "RUSTSEC-2026-0215", reason = "unmaintained advisory only; reached through the vendored yrs fork, in maintenance mode and leaving text at the native switch" },
    # rustls 0.22.4
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.22.4 only via imap -> rustls-connector 0.19 (mail IMAP client). 0346 needs Debug-logging session values (not done); 0349 needs an active MITM and only downgrades key exchange. Fix: move imap off rustls-connector 0.19." },
    # rustls 0.22.4
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.22.4 only via imap -> rustls-connector 0.19 (mail IMAP client). 0346 needs Debug-logging session values (not done); 0349 needs an active MITM and only downgrades key exchange. Fix: move imap off rustls-connector 0.19." },
    # zip 2.4.2, zip 4.6.1
    { id = "RUSTSEC-2026-0367", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). Fix: zip 9." },
    # zip 2.4.2, zip 4.6.1
    { id = "RUSTSEC-2026-0368", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). Fix: zip 9." },
    # zip 2.4.2, zip 4.6.1
    { id = "RUSTSEC-2026-0369", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). Fix: zip 9." },
    # zvariant 5.10.0
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener). No known vulnerability. Revisit with zbus 6." },
    # zbus_names 4.3.1
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener). No known vulnerability. Revisit with zbus 6." },
    # zvariant_derive 5.10.0
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener). No known vulnerability. Revisit with zbus 6." },
    # rustls-webpki 0.102.8
    { id = "RUSTSEC-2026-0382", reason = "0.102.8 only via imap -> rustls-connector 0.19 (IMAP client, OS roots via native-certs). K2 parses no CRLs; name-constraint and distrusted-intermediate issues matter only with a hostile CA. Fix: move imap off rustls-connector 0.19." },
    # tokio 1.52.1
    { id = "RUSTSEC-2026-0386", reason = "AsyncFd::new I/O-safety unsoundness; no K2 crate constructs AsyncFd (grep). Fix: tokio 1.53.3 (lockfile bump; 1.52.x has no patched release)." },
    # crypto-bigint 0.5.5
    { id = "RUSTSEC-2026-0387", reason = "Timing variability in constant-time ops; via p256 <- hpke in k2-core (sealed secret handoff). A remote timing attack would need many precise measurements of local HPKE ops. Fix needs crypto-bigint 0.7 via an elliptic-curve/p256 major bump." },
    # zip 2.4.2, zip 4.6.1
    { id = "RUSTSEC-2026-0429", reason = "DoS only (abort on a symlink entry with a huge declared size), in ZipArchive::extract(). K2's own zip readers (k2-core fs_extract.rs extract_entries, sim/android/sdk.rs extract, jscheck/inspect.rs load_zip, sim/android/apk.rs read) walk by_index/by_name and read the bytes; none calls extract(). The one extract() caller is tauri-plugin-updater 2.13 extract_zip (Windows only), and src-tauri commands/updater.rs app_update_install passes it only bytes already verified with k2_release_keys. Fix: zip 9 (k2-core direct dep; tauri-plugin-updater 2.14.1, whose install() changes need their own updater test)." },
]

[licenses]
# The Kessel licence allowlist. A dual (OR) licence passes when one of its
# options is here. Anything not here is rejected, including MPL-2.0, GPL,
# LGPL, CC0 (but see the one exception below), OFL-1.1 and Ubuntu-font-1.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# One policy for twelve crate trees: a licence on the list that one tree
# doesn't use is expected, not a finding.
unused-allowed-license = "allow"

# The one named exception: CC0-1.0 for the crate `to_method` only, not
# globally.
[[licenses.exceptions]]
crate = "to_method"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "allow"
deny = [
    # deckcraft's bundled-font crate must be disabled, not licensed.
    { crate = "epaint_default_fonts" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is pinned by commit (rev = <full sha>);
# scripts/ci/cargo-deny.sh checks the Cargo.toml files for that.
required-git-spec = "rev"
# Only the app (src-tauri, native voice) reaches the two git sources; the
# other trees don't, and that is not a finding.
unused-allowed-source = "allow"
allow-git = [
    # Sew's public mirror (sew-proto 0.9, sew-call-client, tauri-plugin-sew-voice
    # and their crates). Retires when sew-call-client and tauri-plugin-sew-voice
    # are on crates.io.
    "https://github.com/Alakazam-211/sew-crates",
    # The str0m fork (str0m, str0m-proto, is, str0m-aws-lc-rs). Retires when
    # sew-call-client depends on crates.io sew-str0m and sew-str0m-is.
    "https://github.com/Alakazam-211/str0m",
]
