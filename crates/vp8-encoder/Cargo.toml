[package]
name = "vp8-encoder"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
# Uses vp8-decoder's RFC 6386 Section 20 derived code (BSD-3-Clause, see
# NOTICE and PROVENANCE.md); our own code is MIT OR Apache-2.0.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
description = "A real-time VP8 video encoder in pure, safe Rust: rate control, keyframes on request, temporal layers."
authors = ["Alakazam Labs"]
readme = "README.md"
homepage = "https://github.com/Alakazam-211/K2/tree/main/crates/vp8-encoder"
documentation = "https://docs.rs/vp8-encoder"
repository = "https://github.com/Alakazam-211/K2"
keywords = ["vp8", "video", "encoder", "codec", "webrtc"]
categories = ["multimedia::video", "multimedia::encoding"]
# What the .crate holds: the source, README, CHANGELOG, the licences, NOTICE
# (the BSD-3-Clause notice, which the licence requires to travel with the
# code) and PROVENANCE.md. Tests, examples, benches and scripts stay in the
# repository.
include = ["/src/**/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/PROVENANCE.md"]

[lib]
name = "vp8_encoder"

[dependencies]
# Exact: the encoder uses vp8-decoder's hidden shared modules, which are
# not a stable API.
vp8-decoder = { path = "../vp8-decoder", version = "=0.1.2" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
# `--cfg vp8_stage_timers`: per-stage timers for profiling (decode_speed).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vp8_stage_timers)"] }
