[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/k2-client",
    "crates/k2-core",
    "crates/k2-daemon",
    "crates/k2-menubar",
    "crates/k2-node-proto",
    "crates/k2-node",
    "crates/k2-root-proto",
    "crates/k2-root-helper",
    "crates/k2-app-engine",
    "crates/k2-vault",
    "crates/k2-redact",
    # The Mobile tab's device stream as video (VideoToolbox FFI, flow control).
    "crates/k2-simvideo",
    "crates/k2-winsec",
    # The update-signing key list + verify (SS4); daemon and app link it.
    "crates/k2-release-keys",
    # TEST ONLY: Google / Microsoft OAuth + Graph fakes for the headless
    # mail smokes (prd-app-mail-calendar-surfaces-v1 §8.2). Never shipped.
    "tests/fakes/oauth-providers",
    # TEST ONLY (Windows): runs the sh-script fakes tests write as .exe files
    # (k2_core::test_env::write_executable). Never shipped.
    "tests/fakes/sh-shim",
    "crates/k2-ptyd",
    # The terminal grid model and its wire codec (to be kessel-grid and
    # kessel-wire); k2-core re-exports them.
    "crates/k2-term-grid",
    "crates/k2-term-wire",
    "crates/k2-export",
    # Voice audio pipeline (devices, AEC/NS/AGC, Opus, jitter buffers);
    # MIT OR Apache-2.0, Kessel family.
    "crates/kessel-audio",
    # Cameras, screen capture, pixels and video codecs (H.264 through the OS
    # codecs only); MIT OR Apache-2.0, Kessel family.
    "crates/kessel-video",
    # NV12 frames from one process to another through a shared-memory ring
    # (an iOS broadcast upload extension to its app); MIT OR Apache-2.0,
    # Kessel family.
    "crates/kessel-frame-ring",
    # A pure-Rust VP8 decoder (RFC 6386) for receiving browser video.
    "crates/vp8-decoder",
    # A pure-Rust real-time VP8 encoder for sending video.
    "crates/vp8-encoder",
    # Resumable uploads and downloads against K2's transfer door, for a
    # Tauri app's Rust side; MIT OR Apache-2.0.
    "crates/k2-transfer-client",
    # The release signer for clients (prd-ci-on-compute-for-clients-v1 C4):
    # runs as the `_k2sign` role user beside k2sign; checks evidence
    # bundles v2 and signs minisign/Tauri updater files.
    "crates/k2-signer",
    # The remote desktop helper "K2 Screen" (prd-remote-desktop-tab-v1
    # D3/D4) and its wire, which the daemon links (no platform code).
    "crates/k2-deskd-proto",
    "crates/k2-deskd",
]
# Sew's vendored client crates (S30 K15, third_party/SEW-VENDOR.txt) keep
# their own manifests and lints: never workspace members. Vendored repos
# with their own [workspace] (git subtree; Markdown multiplayer K1) are
# built as path dependencies of k2-daemon, never as members.
exclude = [
    "third_party/sew-proto",
    "third_party/sew-client",
    "vendor/k2-mpc-base",
    "vendor/k2-mpc-board",
    "vendor/k2-mpc-markdown",
    "vendor/k2-mpc-psd",
    "vendor/k2-mpc-text",
]

# Dev profile: lightly optimized so PTY reads + LLM inference don't crawl.
# Hot-path crates below escalate to opt-level=3 in dev too.
[profile.dev]
opt-level = 1

# k2-signer: minisign secret keys are scrypt-encrypted (N = 2^20, 1 GiB):
# its tests decrypt one, which crawls unoptimized.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.fontdue]
opt-level = 3

# kessel-audio's DSP and codec dependencies: real-time audio needs them
# optimised even in dev builds (and its CPU tests measure them).
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
[profile.dev.package.ropus]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
# Video decoding is real time too.
[profile.dev.package.vp8-decoder]
opt-level = 3
[profile.dev.package.vp8-encoder]
opt-level = 3
# Sew's video path (capture and convert, the engine's video bridge, the media
# transport): unoptimised, it falls behind real time (Sew measured VP8 at about
# 22 fps in a debug build), so dev builds optimise it too.
[profile.dev.package.kessel-video]
opt-level = 3
[profile.dev.package.sew-call-client]
opt-level = 3
[profile.dev.package.str0m]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1

# wry 0.57 still unwraps a nil NSURL (URLWithString / IPC / nav). The
# path patch skips those instead of aborting the macOS main thread.
# objc2 0.6.5 still expects a non-null selector (aborts sendEvent). tao 0.37.1
# then dereferences the null superclass pointer. Path-patched the same way.
#
# tauri-runtime-wry 2.12.0: on Linux, child webviews (the Browser tab) go
# into a per-window gtk::Fixed instead of the window's gtk::Box, so their
# position and size hold (tauri#10420); see its src/child_container.rs.
# Paired with the vendored wry's gtk::Fixed set_bounds/bounds/reparent.
#
# wry also carries a guard against URIs with an empty path (`ipc:foo`), which
# panic Tauri 2.12.0's IPC and asset handlers and abort the macOS client.
# third_party/upstream/wry-0005-*: DROP IT ON THE TAURI 2.12.5 MOVE (0.46.9);
# 2.12.4 has the real fix (tauri#16197).
#
# vte 0.15.0 (alacritty_terminal's parser, so every K2 terminal) drops one
# ASCII byte when a 2-byte UTF-8 char is split across PTY reads after its
# lead byte and the next read continues with that ASCII byte plus another
# non-ASCII char ("ïcø" → "ïø"). advance_partial_utf8 returned valid_up_to
# instead of the printed char's length. One-line fix + regression test;
# same bug on upstream master as of 2026-10-18, nothing filed yet. Diff and
# PR text: third_party/upstream/vte-0001-*. Drop when a fixed vte ships.
[patch.crates-io]
wry = { path = "third_party/wry" }
objc2 = { path = "third_party/objc2" }
tao = { path = "third_party/tao" }
tauri-runtime-wry = { path = "third_party/tauri-runtime-wry" }
vte = { path = "third_party/vte" }
# Sew 0.3.0's wire types (S30 K15): sew-client names `sew-proto = "0.3.0"`
# from crates.io; K2 points it at the vendored, sha-pinned copy
# (third_party/SEW-VENDOR.txt). Never fetched from a registry or git.
sew-proto = { path = "third_party/sew-proto" }
# Native voice (src-tauri's `native-voice` feature, prd-k2-voice-rooms-v1 §14).
# THE ONE PLACE that says where Sew's crates come from: Sew's public mirror, pinned
# by commit (Sew release 0.9.2: sew-proto 0.9.2, sew-call-client and
# tauri-plugin-sew-voice 0.6.1; the mirror has no tags). K2 names them by version,
# so moving to crates.io later only removes these rows. sew-proto here is 0.9, beside
# the 0.3 above that sew-client uses, hence the rename.
sew-proto-native = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0", package = "sew-proto" }
sew-lkproto = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
sew-mls-crypto = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
sew-e2ee = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
sew-lk-compat = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
sew-call-client = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
tauri-plugin-sew-voice = { git = "https://github.com/Alakazam-211/sew-crates", rev = "85f5c87f93b301823629d920da5bc31015bd64b0" }
# A [patch] applies only from the workspace root: the mirror's fork rows, copied
# (Sew 0.8.3 on: str0m at 907e050b, upstream's fixes; dimpl 0.9 comes from crates.io,
# so the dimpl row is gone).
str0m = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
str0m-proto = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
is = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
str0m-aws-lc-rs = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
# K2's own audio crate, so one kessel-audio is built and no git source on K2 is locked.
kessel-audio = { path = "crates/kessel-audio" }
# kessel-video names the VP8 crates by version only (crates.io); in this
# workspace they resolve to the in-tree copies, so one of each is built. The
# in-tree copies are 0.1.1 (faster loop filter and inter prediction), ahead
# of the published 0.1.0 until they are released.
vp8-decoder = { path = "crates/vp8-decoder" }
vp8-encoder = { path = "crates/vp8-encoder" }
# sew-call-client's video names kessel-video ^0.1.3 from crates.io; here it is
# K2's in-tree crate (0.1.5), so one kessel-video is built, as with kessel-audio.
kessel-video = { path = "crates/kessel-video" }
