[package]
name = "k2-daemon"
version = "0.40.52"
edition = "2021"
license = "FSL-1.1-Apache-2.0"
description = "K2 persistent-agent daemon: launchd-managed device-local process that runs the scheduler, companion tunnel, and agent orchestration so agents keep working while the Tauri app is quit and the laptop lid is closed."

[[bin]]
name = "k2-daemon"
path = "src/main.rs"

# Sandbox P2b — the privilege-dropped libkrun VMM jail. The real body is
# linux+sandbox-microvm only and links libkrun (see build.rs); on every other
# build it is the stub `main` that exits 1. `required-features` keeps it out of
# a default `cargo build` entirely (it's only ever built with the feature on).
[[bin]]
name = "k2-vmm-worker"
path = "src/bin/k2-vmm-worker.rs"
required-features = ["sandbox-microvm"]

# Thin library surface so integration tests (crates/k2so-daemon/tests/*)
# can reach modules like `sessions_ws` directly. The daemon has always
# been a binary — this lib entry just re-exports the internal modules
# for the test binaries. Production artifacts unchanged.
[lib]
name = "k2_daemon"
path = "src/lib.rs"

[features]
# Session-sandboxing P2a/P2b — forwards k2-core's microVM backend feature so
# `resolve_sandbox`'s Linux-only `SandboxSpec::Microvm` arm can compile, and
# pulls in the worker-only deps (`nix`, `seccompiler`) that build the host jail.
# Default OFF: on a default build, `resolve_sandbox` always degrades a sandbox
# request to Passthrough (logged, no isolation) and the worker is not built.
# `dep:` keeps the optional deps from auto-creating implicit features.
sandbox-microvm = ["k2-core/sandbox-microvm", "dep:nix", "dep:seccompiler"]

[dependencies]
# Session Stream + Awareness Bus primitives are now always compiled
# into k2so-core (the `session_stream` feature flag was retired in
# 0.39.0e).
k2-core = { path = "../k2-core" }

# Cryptographic randomness for the per-boot hook auth token.
getrandom = "0.2"

# Constant-time equality for the owner-token compare (the crown-jewel
# credential). `==` on &str/&[u8] short-circuits on first mismatch, leaking
# a byte-by-byte timing side-channel; subtle::ConstantTimeEq does not.
subtle = "2.6"

# Home-directory lookup for ~/.k2so/{daemon.port,daemon.token,daemon.log}.
dirs = "5"

# Async runtime. The daemon is async-first by convention — scheduler ticks,
# companion WS, the HTTP server, and the daemon->Tauri WS event channel all
# live on the same multi-thread runtime.
tokio = { version = "1", features = ["full"] }

# Async WS server for the daemon->Tauri event channel (GET /events). The
# existing tungstenite 0.24 dep in the workspace is the sync flavor used
# by companion::websocket; tokio-tungstenite tracks the same protocol
# version so frames interop if we ever bridge the two.
tokio-tungstenite = "0.23"

# JSON serialization for HookEvent frames going over /events.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# chrono — agent-reply event payload needs an RFC-3339 timestamp.
chrono = { version = "0.4", features = ["serde"] }

# rusqlite — the per-project heartbeat-schedule route in cli.rs pokes
# the `projects` table directly (it's the only daemon code that touches
# a column k2so-core doesn't already wrap). Bundled feature matches
# what k2so-core uses so rusqlite resolves to a single crate version.
rusqlite = { version = "0.31", features = ["bundled"] }

# Futures helpers (Stream trait / StreamExt / SinkExt) needed by
# tokio-tungstenite's async message loop.
futures-util = "0.3"

# UUIDs — pre-allocated for `claude --session-id` pinning so each
# heartbeat fire owns a deterministic, unique session id from spawn
# time (closes the concurrent-fires-share-session race).
uuid = { version = "1", features = ["v4"] }

# rustls — installed at daemon boot so the companion ngrok tunnel
# can build a TLS session. Rustls 0.23 compiles both aws-lc-rs (via
# reqwest's rustls-tls) and ring (via ngrok) into the binary; it
# refuses to auto-pick and panics on first TLS use unless a
# CryptoProvider is explicitly installed. Same pattern as src-tauri.
# Required by Phase 2 Unit 1's daemon-owned companion autostart.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# K2 Connect E2E encryption (Option A) — the daemon's second listener
# terminates TLS itself (rustls) for the user's <sub>.k2.dev subdomain and
# splices the decrypted stream to the existing HTTP listener, so the relay
# carries only ciphertext. tokio-rustls wraps accepted sockets with the
# TlsAcceptor; rustls-pemfile parses the (self-signed in the spike) cert PEM
# on the client side of the listener's own test. Gated on K2_E2E at runtime
# (see tunnel_tls_listener.rs); compiled unconditionally. aws-lc-rs matches
# the provider installed at boot (main.rs:223) so a single provider resolves.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
# Lock-free hot-swap of the live rustls ServerConfig: the cert auto-renewal
# loop (PRD §6) swaps a freshly-issued chain in WITHOUT dropping the TLS
# listener. Already in the tree via k2-core's cert_broker, so no new crate.
arc-swap = "1"

# reqwest blocking — Phase 2 Unit 5 Claude Auth OAuth refresh. Same
# features the Tauri side used (and k2so-core's llm::download still
# uses) so reqwest resolves to a single crate version.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Phase 2 Unit 2 — `libc::_exit` (LLM worker process exit that skips
# C++ static destructors so ggml_metal's cleanup doesn't race macOS
# Metal teardown) and `proc_pidinfo` (RSS watchdog on the worker
# subprocess). Same crate version that k2so-core already pulls in
# transitively; declaring it directly so daemon binary code can call
# these without going through a wrapper.
libc = "0.2"

# Phase 2 Unit 2 — parking_lot for the LLM host's Mutex. k2so-core
# already pins this version; declaring directly so daemon code can
# import it without a re-export hop.
parking_lot = "0.12"

# base64 — Phase 2 Unit 6 `/cli/fs/read-binary` encodes file bytes
# into the JSON response so the existing `/cli/*` dispatcher (JSON
# only) can carry them. ~33% wire overhead, but stays within the
# 50 MB binary-read cap which is the renderer's worst case (PDFs,
# DOCX, images). A streaming WS endpoint is Phase 3 work.
base64 = "0.22"

# P3 remote daemon self-update (binary-swap shape). `sha2` verifies the
# downloaded artifact's SHA-256 against the manifest; `minisign-verify`
# is the verify-ONLY pure-Rust minisign implementation used to check the
# artifact signature against the embedded `plugins.updater.pubkey`. No
# signing keys ever live in the daemon — verify only.
sha2 = "0.10"
minisign-verify = "0.2"

# K2 Mail S2 — DNS verification for domain onboarding (prd-email-server-v1
# §6.3). hickory-resolver (the maintained trust-dns successor; nothing else
# in the tree links a DNS client) provides the blocking system-conf resolver
# behind `mail::dns_verify::SystemResolver`; handlers + the poller call it
# from spawn_blocking. Tests NEVER use it — every test goes through the
# `DnsResolver` trait with canned answers (no real DNS in tests, ever).
hickory-resolver = "0.24"

# K2 Mail S9 — external assistant inboxes (prd-email-server-v1 §17.5): a
# sync IMAP client for the user's OWN accounts (Gmail app-passwords,
# Fastmail, company IMAP). `imap` 3.x is the maintained line (2.x is
# frozen); rustls-tls ONLY — TLS verification is always on (rustls-connector
# + platform root store), and native-tls stays out of the tree. Every
# protocol effect is wrapped behind `mail::external::ImapOps`, so unit
# tests use fakes / a scripted loopback mock — never a real mail host.
# imap-proto is imap's wire-type crate (NameAttribute::Drafts for the
# SPECIAL-USE detection); pinned to the minor imap itself uses.
# mail-parser (Apache-2.0/MIT standalone LIBRARY — not the Stalwart server;
# the §4 no-linking rule is about the AGPL sidecar) parses fetched RFC 822
# bytes into text/html/attachments; `full_encoding` pulls encoding_rs so
# non-UTF-8 charsets in real human inboxes (ISO-8859-*, Shift-JIS, …)
# decode instead of mojibake.
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }

# K2 Mail — LINKED inbox SEND (prd-email-server-v1 §17.5): a blocking SMTP
# submission client for the user's OWN external accounts (same
# app-password as the IMAP read/draft path). `lettre` is the maintained
# Rust SMTP line; rustls-tls ONLY — certificate verification is ALWAYS on
# (no code path relaxes it; native-tls stays out of the tree, matching the
# imap client above). Every SMTP effect is wrapped behind
# `mail::external_smtp::SmtpOps`, so unit tests use a scripted loopback
# mock on an ephemeral high port — never a real mail host.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
    "hostname",
    "pool",
] }

# Sandbox P2b worker — Linux-only deps for the host jail. Both are OPTIONAL and
# pulled in ONLY by the `sandbox-microvm` feature (via `dep:`), so a default or
# macOS build never compiles them. `nix` gives us the namespace / mount /
# pivot_root / cred-drop / signal syscalls; `seccompiler` builds + applies the
# seccomp-bpf allowlist. `libc` (prctl/pipe2/ioctl/FFI) is already a base dep.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = [
    "sched",
    "mount",
    "fs",
    "user",
    "process",
    "signal",
], optional = true }
seccompiler = { version = "0.4", optional = true }

[dev-dependencies]
# Enable k2so-core's `test-util` feature for integration tests that
# need the in-memory DB helper (`db::init_for_tests`). Production
# binaries don't link this path — only `cargo test` does.
k2-core = { path = "../k2-core", features = ["test-util"] }
# Federation route tests mint a fresh "peer" keypair to pin (distinct from
# the daemon's own tunnel key). Same rcgen version/features k2-core uses, so
# it resolves to the one crate already in the lock tree — no new dep.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# `tokio::time::pause` for the grid-emitter frame-budget tests —
# cadence assertions run on the paused virtual clock (deterministic,
# no sleep-and-hope). `full` does NOT include `test-util`; feature
# unification applies this to test builds only.
tokio = { version = "1", features = ["full", "test-util"] }
# Grid-emitter tests feed bytes straight into a session's Term via
# `vte::ansi::Processor` (standing in for alacritty's IO thread).
# Same version/features k2-core pins, so Cargo resolves it to the
# one `vte` already in the lock tree — no new crate.
vte = { version = "0.15", features = ["std", "ansi"] }
