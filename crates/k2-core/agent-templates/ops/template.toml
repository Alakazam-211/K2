schema = 1
id = "ops"
version = 2
name = "Ops"
summary = "Keeps machines, services and scheduled jobs running."
kind = "agent"
aliases = []
author = "K2"
shared_block = true

[agent]
role = "ops"
tool = "default"

[context]
catalog = ["wiki:index", "wiki:hygiene", "connections:roster", "heartbeats:roster"]

[permissions]
cards = true
suggest = ["compute.use"]

[params]
about = { label = "What should it focus on?", max = 500, required = false }

[hello]
brief = "Say hello to {{person}} on the Thread: who you are and what you're for. Then do what \"Your first conversation\" in your ROLE.md says: ask only the questions still open, one or two at a time; if none are, say what you understood and what you'll start on.\nStill open from your hire: {{open_questions}}"

[[questions]]
id = "systems"
ask = "Which machines and services will I look after?"
fills = "wiki:Systems map#Machines and services"

[[questions]]
id = "limits"
ask = "What may I change on my own, and what needs your OK first?"
fills = "role"

[[questions]]
id = "alerts"
ask = "Who should hear about a problem, and how fast?"
fills = "wiki:Systems map#Who to tell"
