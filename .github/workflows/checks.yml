# Quality gates — added at 0.40.31, the release where the tree first hit
# warning-zero (cargo, workspace-wide, --all-targets) and typecheck-zero
# (tsconfig.web.json). This workflow keeps it that way on every push/PR.
#
# NOTE: bare `tsc --noEmit` is VACUOUS in this repo (root tsconfig.json is
# {files: [], references: [...]}, and project references are not checked
# without --build) — typecheck:web is the real renderer check.
# typecheck:web runs tsc-rs (pinned; TS 7 rules). Fallback: typecheck:web:tsc.
# See docs/typecheck.md.
#
# The `k2` (src-tauri) crate is deliberately NOT checked here yet: it needs
# the webkitgtk/gtk stack plus a staged `binaries/frpc-<triple>` external
# binary (tauri-build validates it even for `cargo check`). The Linux
# packaging arc owns adding a full app-build job; release.sh Step 0.5 gates
# the k2 crate on the maintainer box in the meantime.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: typecheck:web + vitest + vite:build:web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Arch/Omarchy packaging lock (O14–O27 files)
        run: bash tests/packaging/arch-omarchy-bundle.sh

      # The Arch package only builds on k2-arch after a tag. These are the
      # text-level breaks (sum drift, missing source, shell syntax) that
      # do not need Arch. 0.43.0 died at the tag on a stale k2.install sum.
      - name: Arch PKGBUILD sources, sums, pkgver, syntax
        run: bash scripts/check-arch-pkgbuild.sh

      - name: Arch PKGBUILD check fails on broken fixtures
        run: bash tests/packaging/check-arch-pkgbuild.sh

      # release.sh pre-tag Arch gate, with stub gh/ssh (no GitHub, no k2-arch).
      - name: Arch build gate script (stubbed)
        run: bash tests/packaging/arch-build-gate.sh

      # Linux SHA256SUMS merge + release.sh Step 10.6 check, with a stub gh.
      - name: Linux SHA256SUMS merge and check (stubbed)
        run: bash tests/packaging/linux-sums.sh

      # release.sh's /var/tmp/k2-release.lock + wait for a compute-node job.
      - name: Release lock (temp paths, stub k2-node)
        run: bash tests/packaging/release-lock.sh

      # release.sh's k2-ptyd checks on the update bundle (prd-k2-ptyd-v1 P2/P59).
      - name: Release k2-ptyd checks (dry)
        run: bash tests/packaging/release-ptyd-checks.sh

      # release.sh K2_LINUX_BUILDS=shadow: submit, receipt checks, fetch,
      # byte checks and the shadow report, with stub k2/gh (no nodes).
      - name: Linux builds on K2 Compute (stubbed)
        run: bash tests/packaging/compute-release.sh

      # Update signing on z3mbpZ (prd-security-sweep-0464-v1 SS1/SS2):
      # sign-updater.sh, sign-daemon.sh, the Windows patch and the
      # release.sh/workflow wiring, with stub minisign/security/gh and
      # throwaway keys (no real key, no keychain, no GitHub).
      - name: Update signing on z3mbpZ (stubbed)
        run: bash tests/packaging/updater-signing.sh

      # The K2 Compute CI gate (scripts/ci/checks.sh mirrors this file;
      # the test fails on drift), run-checks, statuses, poller; stub k2.
      - name: CI gate on K2 Compute (stubbed)
        run: bash tests/packaging/ci-gate.sh

      # The macOS sidecars build in ONE cargo call, and release.sh's Step
      # 8.5 standalone daemon uses the same package set (stub cargo/bun).
      # release.sh's dot-progress waits and the Step 0.5 mac build env
      # (stubbed; mirrors scripts/ci/checks.sh web).
      - name: release.sh waits + Step 0.5 env (stubbed)
        run: bash tests/packaging/release-wait-and-preflight.sh

      - name: macOS sidecars build once (stubbed)
        run: bash tests/packaging/build-once.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: k2-home gate (PRD prd-k2so-cleanup-v1 §5)
        run: bash scripts/k2-home-gate.sh

      - name: private-docs gate (cloud-business docs stay in the private repo)
        run: bash scripts/private-docs-gate.sh

      - name: Typecheck renderer (tsc-rs, tsconfig.web.json)
        run: bun run typecheck:web

      - name: Vitest
        run: bunx vitest run --reporter=dot

      # Runtime S23: the App server SDK (sdk/server) and the must-not-break
      # contract suite typecheck on their own (Node, not the renderer).
      - name: Typecheck the App server SDK
        run: bunx tsc -p sdk/server/tsconfig.json

      # 0.46.6: the daemon embeds sdk/server/dist (the @k2/server tarball
      # `k2 app sdk add` vendors); it must be built from today's sources.
      - name: App server SDK dist is fresh
        run: node scripts/sdk-server-dist.mjs --check

      # prd-zen-user-widgets-v2 UW41, TUWA11: the widget CLI's offline
      # half (no grant verb, usage errors, the generated guide api page).
      - name: k2 zen widget CLI (no daemon)
        run: bash tests/cli/zen_widget_offline.sh

      # Hosted SPA production build (vite.config.web.ts). Build-only — no R2
      # publish. Catches Vite graph / asset / CSS regressions typecheck misses.
      - name: Vite build hosted web
        run: bun run vite:build:web

  rust:
    name: cargo check -D warnings (k2-core, k2-daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-22)

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: checks-x86_64

      # Same dep set daemon-binaries.yml uses for the C/C++ build scripts
      # (ggml/llama-cpp-2, libgit2, sqlite).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libssl-dev

      # cargo-nextest for the test steps, pinned (K2 Compute nodes get it
      # from run-checks.sh's `--needs cargo-nextest`).
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.149/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: cargo check (deny warnings, all targets)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p k2-core -p k2-client -p k2-daemon -p k2-node-proto -p k2-node -p k2-root-proto -p k2-root-helper -p k2-app-engine -p k2-ptyd --all-targets

      # The test steps below run cargo-nextest with the repo's `ci` profile
      # (.config/nextest.toml: every test in its own process, no retries,
      # JUnit). They all share RUSTFLAGS=-D warnings: a RUSTFLAGS change
      # rebuilds every crate, so mixing flags compiled the tree twice.
      # scripts/ci/checks.sh rust-test runs these same commands on K2
      # Compute (tests/packaging/ci-gate.sh fails on drift).

      # k2-client (0.46.3 build-speed): the thin client's leaf code that
      # moved out of k2-core (paths, migration, wake, perf, release sums…);
      # its tests no longer run under k2-core. Temp homes only.
      - name: cargo nextest k2-client
        env:
          RUSTFLAGS: -D warnings
        run: cargo nextest run --profile ci -p k2-client

      # k2-ptyd (prd-k2-ptyd-v1 R1: single point of failure for every
      # agent): the PTY host's own suite incl. the bounded protocol fuzz,
      # plus the daemon-side backend against the real binary. Runs the
      # binary against temp homes only; never ~/.k2.
      - name: cargo nextest k2-ptyd (Linux)
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build -p k2-ptyd --bin k2-ptyd
          cargo nextest run --profile ci -p k2-ptyd
          cargo nextest run --profile ci -p k2-core --test ptyd_backend

      # K2 root helper (prd-k2-root-helper-v1 RH16): a REQUIRED test step —
      # a bug here is a root bug. Pure unit tests over temp roots + the
      # built binary (never sudo, never root, never real /etc). Plus the
      # hermetic installer/provisioner tests and the test-keys example.
      - name: cargo nextest root helper
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo nextest run --profile ci -p k2-root-proto --features test-signer
          cargo nextest run --profile ci -p k2-root-helper
          cargo check -p k2-root-helper --features test-keys --examples
          cargo nextest run --profile ci -p k2-daemon --lib root_helper:: root_helper_routes::update_version_tests:: mail::helper:: update_routes::tests::daemon_update cell_server:: front443:: mail::front_listener::
          bash tests/cli/install_root_helper.sh
          bash tests/cli/root_helper_cli.sh
          bash tests/cli/front_cli.sh
          bash tests/cli/provision_mail_helper.sh
          bash tests/cli/daemon_unit_oompolicy.sh
          bash tests/cli/daemon_unit_runtime_dir.sh
          bash tests/cli/daemon_install_systemd_unit.sh
          bash tests/cli/daemon_status_ptyd.sh

      # Zen v2 (prd-zen-user-widgets-v2 UWB28): the verb catalog's lint,
      # the generated-file freshness check and the catalog-vs-ROUTES tests,
      # plus k2-core's Zen tests. Stale generated files: run
      # `cargo run -p k2-core --bin contract-gen`.
      - name: cargo nextest verb catalog + Zen
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo nextest run --profile ci -p k2-core --lib contract:: zen:: app_surface::
          cargo nextest run --profile ci -p k2-daemon --test contract_routes --test app_api_integration

      # K2 compute nodes (prd-k2-compute-nodes-v1 CN28): the wire, the node
      # runtime (real processes in temp dirs, loopback fakes only), the
      # controller core, and the headless daemon + real node contract test.
      # One daemon run: its lib tests named compute_/route_policy plus both
      # integration binaries (-E: kind(test) runs those binaries whole).
      - name: cargo nextest compute nodes
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo nextest run --profile ci -p k2-node-proto -p k2-node -p k2-redact
          cargo nextest run --profile ci -p k2-core --lib compute::
          cargo nextest run --profile ci -p k2-daemon --lib --test compute_integration --test compute_results_integration --test compute_secret_integration --test compute_place_integration -E 'kind(test) | test(compute_) | test(route_policy)'
          cargo nextest run --profile ci -p k2-vault --test compute_grant --test redact_pin

      # App runtime stage 1 (prd-k2-app-runtime-v1 §12.1, AR27): the Seed
      # store, validate, the deploy audit chain, the deploy pipeline and
      # the headless daemon contract (fixture Apps are python3 servers on
      # loopback; never a real agent CLI, never the real ~/.k2). The 0.46.1
      # door (lane 2): app-audit.db, remote passes, 0183, and
      # quotas/audit/suspend on a live gateway link. The guarded engine's
      # k2app-side binary (S11/S12): wire, caller check over socket pairs,
      # Quadlet rendering, seccomp, Seeds.
      - name: cargo nextest App runtime
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo nextest run --profile ci -p k2-core --lib deploy:: app_audit skin_link app_door app_grace::requests
          cargo nextest run --profile ci -p k2-daemon --lib --test apps_runtime_integration --test apps_door_integration --test apps_gateway_link_integration -E 'kind(test) | test(apps::)'
          cargo nextest run --profile ci -p k2-app-engine

      # Sew on K2, 0.46.1 (S27 grant hook + S28 chat pass + K6 keyring):
      # the chat grant, outbox and reconcile (link guests ignored, K-M6),
      # session revokes on the outbox, the pass mint per App link (K-M4),
      # the keyring and JWKS, and a fake Sew mgmt socket end to end.
      - name: cargo nextest Sew (grant hook, chat pass)
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo nextest run --profile ci -p k2-core --lib tool_hook:: sew_revoke:: skin::sew_tests connect_users::
          cargo nextest run --profile ci -p k2-daemon --lib --test chat_pass_integration --test chat_pass_mint_integration --test grant_hook_integration -E 'kind(test) | test(chat_pass::) | test(tool_hook_worker::) | test(sew_mgmt::)'

      # Custom/enterprise air-gap compile (`--features airgap`). Compiles
      # the GitHub update-ping URL out of k2-daemon; baked air-gap cannot
      # be turned off with K2_AIRGAP=0. Not a GitHub Release asset. Default
      # check above stays the cloud self-update build.
      - name: cargo check airgap feature
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p k2-core -p k2-daemon --features airgap --all-targets

  # prd-security-sweep-0464-v1 SS14: a new advisory in Cargo.lock or
  # bun.lock fails checks. Allowed ones are listed, each with a reason and
  # a review-by date at most 90 days out, in osv-scanner.toml (and, by ID,
  # in .cargo/audit.toml); an expired entry fails. Same steps as
  # `scripts/ci/checks.sh audit`. Needs the internet (crates.io, the
  # osv-scanner release, the RustSec database, osv.dev).
  # cargo audit denies unmaintained and unsound too, but not yanked
  # versions (no advisory ID to allow-list; they still print).
  audit:
    name: cargo audit + osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-22)

      - name: Advisory allow-list rules (reason, review date, expiry)
        run: python3 scripts/ci/audit-ignores.py check

      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --locked --version =0.22.2 --root target/audit-tools

      - name: Install osv-scanner (pinned, sha256-checked)
        run: bash scripts/ci/install-osv-scanner.sh target/audit-tools

      - name: Scanners still catch a known advisory (canary)
        run: bash tests/packaging/audit-canary.sh target/audit-tools

      - name: cargo audit
        run: target/audit-tools/bin/cargo-audit audit --deny unmaintained --deny unsound --file Cargo.lock

      - name: osv-scanner (bun.lock + Cargo.lock)
        run: target/audit-tools/osv-scanner scan source --lockfile bun.lock --lockfile Cargo.lock --config osv-scanner.toml
