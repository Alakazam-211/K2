# Built-in Zen page template `k2.texting@1` (prd-zen-mode-v1 Z10,
# prd-zen-gardens-v1 G11): the Default Garden.
#
# Data, not special code: `/cli/zen/get?garden=` returns this layout, these
# widgets and these controls as the resolved page, and the renderer draws
# from it. A Garden file (`gardens/<id>.toml`) may replace the layout and
# the built-in widgets with the same shape (G38); the controls always come
# from the template.
id = "k2.texting@1"
schema = 1

[layout]
kind = "columns"

[[layout.column]]
widget = "agents"
size = 34
min-width = 240

[[layout.column]]
widget = "conversation"
size = 66
min-width = 360

# Every widget, built-ins included, reaches K2 only through the Zen bridge.
# `caps` are the bridge verbs' capabilities this widget is granted; a
# built-in is granted by K2 (source "builtin"), never by grants.json.
[[widget]]
id = "agents"
kind = "agents"
column = 0
caps = ["agents:read", "agents:add", "presence:read"]

[widget.props]
# The widget's own Home picker (G27): it shows any Home's agents without
# moving the Home page's selection.
home-picker = true
order = "home"
server-tag = true
preview = true
status = ["working", "idle", "needs-you"]

[[widget]]
id = "conversation"
kind = "conversation"
column = 1
caps = ["agents:read", "presence:read", "thread:read", "thread:post"]

[widget.props]
compose = true
attachments = true
load-older = true

# Controls (Z27, G24). The page draws them; K2 binds and checks the required
# three (`zen-toggle`, `garden-switcher`, `drag-region`). The top band holds
# the Garden switcher (top left) and the drag strip; the footer under the
# Agents column (column 0) holds the Zen toggle, the way out, and Add agent
# (bottom left). K2 draws its own theme swatch in the top-right corner.
[[control]]
kind = "garden-switcher"
placement = "top-left"

[[control]]
kind = "drag-region"
placement = "top"

[[control]]
kind = "zen-toggle"
placement = "bottom-left"
column = 0

# Optional: opens K2's Add agent picker for the Agents widget's Home (`agents.add`).
[[control]]
kind = "add-agent"
placement = "bottom-left"
column = 0
