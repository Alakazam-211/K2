# Zen theme "basic": clean, smooth, simple. Built into K2 (read-only).
#
# Cool light scheme, soft dark scheme, K2 blue accent, `scheme = "auto"` follows this
# computer's light/dark setting. Every other theme starts from this one,
# so it sets every token.
#
# To change it, make an override: `k2 zen theme new basic` copies this
# file to ~/.k2/zen/themes/basic/theme.toml, where your edits sit on
# top of K2's copy. `k2 zen reset --theme basic` drops your override.
# App updates never touch your files.
schema = 1

[theme]
# auto follows this computer's light/dark setting.
scheme = "auto"

[colors.light]
canvas = "#f7f8fa"
surface = "#ffffff"
surface-raised = "#ffffff"
border = "#e3e6ec"
text = "#1a1d23"
text-muted = "#5f6672"
accent = "#2563eb"
accent-text = "#ffffff"
bubble-me = "#2563eb"
bubble-me-text = "#ffffff"
bubble-agent = "#eef1f5"
bubble-agent-text = "#1a1d23"
working = "#2f855a"
idle = "#a39b90"
needs-you = "#c27c0e"
danger = "#c53030"

[colors.dark]
canvas = "#121316"
surface = "#1a1b1f"
surface-raised = "#222328"
border = "#2e3036"
text = "#e6e8ec"
text-muted = "#9aa0ab"
accent = "#60a5fa"
accent-text = "#0b1220"
bubble-me = "#1d4ed8"
bubble-me-text = "#eff6ff"
bubble-agent = "#222328"
bubble-agent-text = "#e6e8ec"
working = "#5fbf8a"
idle = "#7d766d"
needs-you = "#e0a43a"
danger = "#f07167"

[font]
# One font for Zen and the terminals shown in it.
# system | rounded | serif | mono | meslo | jetbrains-mono | fira-code | lilex
# A proportional family (system, rounded, serif) uses meslo in terminals.
family = "system"
size = 14          # 12 to 20
line-height = 1.45 # 1.2 to 1.8

[shape]
radius = 14         # 0 to 28
bubble-radius = 18  # 0 to 28
gap = 12            # 4 to 24
list-width = 300    # 240 to 420

# Agent terminals shown in Zen use this palette.
[terminal.light]
foreground = "#1a1d23"
background = "#f7f8fa"
cursor = "#2563eb"
cursor-text = "#ffffff"
selection = "#dbe6fb"
black = "#2a2622"
red = "#b8322a"
green = "#3d7a3a"
yellow = "#9a6a12"
blue = "#2f5f9a"
magenta = "#8a3f86"
cyan = "#2a7a7a"
white = "#d8d0c4"
bright-black = "#6f675d"
bright-red = "#d0473e"
bright-green = "#4f944b"
bright-yellow = "#b8841f"
bright-blue = "#3f76b8"
bright-magenta = "#a3549f"
bright-cyan = "#3a9494"
bright-white = "#ffffff"

[terminal.dark]
foreground = "#e6e8ec"
background = "#121316"
cursor = "#60a5fa"
cursor-text = "#0b1220"
selection = "#263452"
black = "#262422"
red = "#f07167"
green = "#7fbf7a"
yellow = "#e0b45a"
blue = "#7aa7d8"
magenta = "#c792c7"
cyan = "#6fc1bd"
white = "#d8d0c4"
bright-black = "#7d766d"
bright-red = "#ff8a80"
bright-green = "#9ad694"
bright-yellow = "#f2cc7a"
bright-blue = "#9cc2ec"
bright-magenta = "#dcaadc"
bright-cyan = "#8fd6d2"
bright-white = "#ffffff"

[chrome]
# macOS window corners: system | square
corners = "system"
# macOS window buttons: round | square
stoplights = "round"
# Nudge the window buttons right and down, 0 to 24 px each.
stoplight-offset = [0, 0]

[bezier]
# name = [x1, y1, x2, y2]; y may leave 0 to 1 for overshoot.
# Built in: linear, ease, glide, soft, overshot.

[animation]
# name = [on, speed, curve, style]
# on is 1 or 0, speed is in tenths of a second, style is optional:
# fade | slide | slidefade | popin <n>%
# A child takes its parent's line until you set it:
# global > zen (zenIn, zenOut) > rows (rowIn, rowMove)
#        > messages (messageIn) > conversation (conversationSwitch)
#        > working (workingPulse)
global = [1, 3, "glide"]
zenIn = [1, 4, "glide", "fade"]
zenOut = [1, 3, "glide", "fade"]
rowIn = [1, 3, "glide", "slidefade"]
rowMove = [1, 3, "glide"]
messageIn = [1, 3, "glide", "popin 92%"]
conversationSwitch = [1, 2, "glide", "fade"]
workingPulse = [1, 12, "soft"]
