<!doctype html>
<html style="color-scheme:__K2_SHOT_SCHEME__">
<head>
<meta charset="utf-8">
<title>K2 widget shot</title>
<style>html,body{margin:0;padding:0;background:__K2_SHOT_CANVAS__;}#f{display:block;border:0;width:__K2_SHOT_WIDTH__px;height:__K2_SHOT_HEIGHT__px;background:transparent;color-scheme:__K2_SHOT_SCHEME__;}</style>
</head>
<body>
<iframe id="f" sandbox="allow-scripts" title="widget"></iframe>
<script>
// `k2 zen widget preview --shot` (0.46.3): the Garden canvas, the widget's
// sealed frame and a STAND-IN bridge that answers the frame's port the way
// K2's host bridge does (zen-custom-host.ts + zen-custom-bridge.ts), from
// sample data or the caller's --data fixtures. Nothing reaches a daemon.
//
// Fixtures (--data, one JSON object): "<verb> <first arg>" wins over
// "<verb>" (for example "sources.subscribe fleet" then
// "sources.subscribe"); "store" preloads the widget's store as key → value.
// The runner reads window.__k2shot: {ready, errors, refusals, calls}.
;(function () {
  'use strict'
  var HELLO = __K2_SHOT_HELLO__
  var THEME = __K2_SHOT_THEME__
  var DATA = __K2_SHOT_DATA__
  var NOW = Math.floor(Date.now() / 1000)
  var shot = (window.__k2shot = { ready: false, errors: [], refusals: [], calls: [] })
  var store = {}
  var rev = 0
  var seq = 0
  var initial = DATA && typeof DATA.store === 'object' && DATA.store ? DATA.store : {}
  Object.keys(initial).forEach(function (k) {
    rev += 1
    store[k] = { key: k, rev: rev, value: initial[k], updatedAt: NOW - 60, by: 'you' }
  })

  function fixture(verb, args) {
    var first = args && typeof args[0] === 'string' ? args[0] : null
    if (first !== null && Object.prototype.hasOwnProperty.call(DATA, verb + ' ' + first)) return { hit: true, value: DATA[verb + ' ' + first] }
    if (Object.prototype.hasOwnProperty.call(DATA, verb)) return { hit: true, value: DATA[verb] }
    return { hit: false }
  }

  function sampleView(address) {
    var name = String(address || 'sample').split('::')[0]
    return {
      address: String(address || name),
      name: name,
      label: name,
      kind: 'http-json',
      health: 'warn',
      phase: 'live',
      display: 'warn',
      reason: null,
      reasonText: null,
      fields: { target_version: '1.2.0' },
      items: [
        { key: 'alpha', health: 'ok', reason: null, fields: { version: '1.2.0', phase: 'ready' } },
        { key: 'bravo', health: 'warn', reason: 'version_behind', fields: { version: '1.1.4', phase: 'ready' }, soft: { count: 1, of: 3, level: 'crit' } },
        { key: 'charlie', health: 'ok', reason: null, fields: { version: '1.2.0', phase: 'ready' } },
      ],
      counts: { ok: 2, warn: 1, crit: 0, unknown: 0 },
      soft: { count: 0, of: 3 },
      serverNow: NOW,
      updatedAt: NOW - 20,
    }
  }

  function sampleAgents() {
    var caps = HELLO.caps || []
    var rows = [
      ['sample-agent::this-computer', 'Sample agent', 'working', 'Working', true],
      ['helper::this-computer', 'Helper', 'idle', 'Idle', false],
    ]
    return rows.map(function (r, i) {
      var row = {
        address: r[0], label: r[1], index: i, server: null, state: r[2], stateLabel: r[3], detail: null,
        working: r[4], needsYou: false, activity: r[4] ? 'tools' : null, counts: null, openable: true,
        selected: i === 0, avatar: null, color: null, image: null,
      }
      if (caps.indexOf('thread:read') >= 0) row.preview = { text: i === 0 ? 'On it: checking the fleet now.' : 'Done.', at: NOW - 30 * (i + 1), from: r[0], mine: false, seq: 2 }
      if (caps.indexOf('presence:read') >= 0) row.people = []
      return row
    })
  }

  function sampleThread(address) {
    var doc = function (n, from, body) {
      return { seq: n, id: 'm' + n, doc: { id: 'm' + n, kind: 'text', from: from, to: from === 'you' ? address : null, created_at: NOW - 120 + n * 30, body: body, via: null, choice: null } }
    }
    return {
      address: String(address),
      phase: 'ready',
      note: null,
      items: [doc(1, 'you', 'Can you check the fleet before the release?'), doc(2, String(address), 'On it. Every box answers; one is a version behind.'), doc(3, 'you', 'Which one?')],
      hasMore: false,
      turn: { state: 'working', since: NOW - 5 },
    }
  }

  function entries(prefix) {
    return Object.keys(store).sort().filter(function (k) { return !prefix || k.indexOf(prefix) === 0 }).map(function (k) { return store[k] })
  }

  function call(verb, args) {
    var f = fixture(verb, args)
    if (f.hit) return f.value
    var a0 = args && args[0]
    switch (verb) {
      case 'theme.get': return THEME
      case 'gardens.list': return [{ id: 'shot', name: 'Widget shot', index: 1 }]
      case 'gardens.current': return { id: 'shot', name: 'Widget shot', index: 1 }
      case 'viewer.get': return { kind: 'owner', name: 'You' }
      case 'widget.self': return { widget: HELLO.widget.name, garden: 'shot', placement: 'shot' }
      case 'agents.list': return sampleAgents()
      case 'presence.get': return []
      case 'thread.read': var t = sampleThread(a0); return { items: t.items, hasMore: false }
      case 'thread.post': seq += 1; return { id: 'shot-' + seq, seq: 100 + seq }
      case 'sources.read': return sampleView(a0)
      case 'sources.list': return [{ address: 'sample', label: 'sample', health: 'warn' }]
      case 'sources.history': return { field: String((args && args[1] && args[1].field) || 'value'), res: 'raw', points: [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return { t: NOW - (8 - i) * 300, v: [3, 4, 4, 6, 5, 7, 8, 7][i] } }) }
      case 'sources.refresh': return { queued: true, nextAt: NOW + 60 }
      case 'sources.ask': return { opened: false }
      case 'save.get': return null
      case 'save.keys': return []
      case 'store.get': return store[a0] || null
      case 'store.list': var p = typeof a0 === 'string' ? a0 : a0 && a0.prefix; return { items: entries(p), next: null }
      case 'store.put':
        rev += 1
        store[a0] = { key: a0, rev: rev, value: args[1], updatedAt: NOW, by: 'you' }
        return { rev: rev }
      case 'store.delete':
        var had = !!store[a0]
        delete store[a0]
        rev += 1
        return { rev: rev, deleted: had }
      default: return null
    }
  }

  function subscribeValue(verb, args) {
    var f = fixture(verb, args)
    if (f.hit) return f.value
    switch (verb) {
      case 'theme.changed': return THEME
      case 'agents.subscribe': return sampleAgents()
      case 'presence.subscribe': return []
      case 'thread.subscribe': return sampleThread(args && args[0])
      case 'sources.subscribe': return sampleView(args && args[0])
      case 'store.changes':
        var a0 = args && args[0]
        var p = typeof a0 === 'string' ? a0 : a0 && a0.prefix
        return { resync: true, items: entries(p) }
      default: return undefined
    }
  }

  var frame = document.getElementById('f')
  frame.addEventListener('load', function () {
    var ch = new MessageChannel()
    var port = ch.port1
    port.onmessage = function (e) {
      var m = e.data
      if (!m || typeof m !== 'object') return
      if (m.ready === true) { shot.ready = true; return }
      if (m.error && typeof m.error === 'object') { shot.errors.push(String(m.error.message || 'error').slice(0, 500)); return }
      if (typeof m.pong === 'number' || 'chord' in m || 'pointer' in m || typeof m.unsub === 'number') return
      if (typeof m.sub === 'number') {
        shot.calls.push(m.verb)
        var v = subscribeValue(m.verb, m.args || [])
        if (v !== undefined) port.postMessage({ sub: m.sub, value: v })
        return
      }
      if (typeof m.id === 'number') {
        shot.calls.push(m.verb)
        var value
        try {
          value = call(m.verb, m.args || [])
        } catch (err) {
          shot.refusals.push(m.verb)
          port.postMessage({ id: m.id, ok: false, error: { code: 'failed', message: String(err && err.message || err) } })
          return
        }
        port.postMessage({ id: m.id, ok: true, value: value === undefined ? null : value })
      }
    }
    frame.contentWindow.postMessage(HELLO, '*', [ch.port2])
  })
  frame.srcdoc = __K2_SHOT_FRAME__
})()
</script>
</body>
</html>
