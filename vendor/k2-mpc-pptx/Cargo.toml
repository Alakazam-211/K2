[workspace]
resolver = "2"
members = ["crates/pptx"]
# fuzz/: the cargo-fuzz targets, their own workspace (nightly and libFuzzer, never in a normal
# build; publish = false).
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The kit (k2-mpc-base), by path: checked out side by side, as the other type packs do (a host
# vendors both repos under one folder). Pinned to the kit's v0.24.0 (1ddeb73b, its public cut):
# v0.15.0's keyed limits (MPC-E415 and MPC-E822), the keyed outside-save rule and the carrier
# hook (`Pack::wants_carrier` and `Pack::encode_from`, which the live pack needs), v0.15.1's
# keyed costs and the carrier row's judge (`session::test_support::carrier_judge`, feature
# `test-support`, which the pack's tests use), and v0.16.0's view schema, addresses and view
# index (`Pack::view_schema`, `Pack::address_of`, `view_derive` with the carrier), the keyed
# watch's `Pack::watch_extras` and the structure index's row format 2
# (`IndexSpec::with_older_format`), and v0.18.0's keyed limit refusal
# (`SessionError::KeyedAtLimit`), v0.23.0's revert on a blob doc (`BlobSession::run_revert`,
# `SaveBase::Revert`), and v0.24.0's row format 3 (`DraftNode::own`,
# `IndexSpec::with_own_records`, the overlap check's `NodeChange::by_children`): a host
# vendors the kit at that tag beside this repo, and a
# contributor checks it out there at that commit (README, "Tests and checks"). Run
# `cargo update -p k2-mpc-base` and commit both locks (this one and fuzz/'s) when the pin moves.
k2-mpc-base = { path = "../k2-mpc-base/crates/base" }
# The shared package layer for docx, pptx and xlsx (k2-mpc-ooxml), by path the same way: its
# checkout sits beside this one, at k2-mpc-ooxml's v0.1.2 (306d3938, its cut): a host vendors it
# beside this repo, and a contributor checks it out there at that commit. Commit both locks when
# it moves.
k2-mpc-opc = { path = "../k2-mpc-ooxml/crates/opc" }

# Our own dev and test builds. Cargo applies a workspace's profiles only when that workspace
# is the one being built, so a host that vendors this repo keeps its own. Release builds are
# unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
