[workspace]
resolver = "2"
members = ["crates/base", "crates/conformance", "crates/spec-undo"]
# vendor/: copies of other repos by git subtree (vendor/README.md). Excluded so they never
# become members (no lints, fmt or tests of ours run on them).
exclude = ["spike", "vendor"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
publish = false
