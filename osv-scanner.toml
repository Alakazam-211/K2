# chrono 0.4.44
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "chrono is unmaintained; no known vulnerability. K2 uses it directly: k2-core (heartbeat schedules via chrono::Local in heartbeats/cron.rs, reminders, token usage, org chart), k2-daemon, k2-vault, k2-client, the app, and the vendored deckcraft-text in k2-deckrender; transitively via croner, imap, trash, chrono-tz, schemars (sew-proto 0.3 and 0.10) and pbjson-types (sew-lkproto). Plan: move to jiff (or time). K2's own ~1,000 call sites are one builder pass with wire and DB timestamp-format tests; removing chrono from the tree also waits on croner, imap, trash and Sew's crates dropping it. Any vulnerability advisory on chrono blocks."

# chrono-tz 0.10.4
[[IgnoredVulns]]
id = "RUSTSEC-2026-0555"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "chrono-tz is unmaintained; no known vulnerability. Direct dependency of k2-core (heartbeat schedules and reminders, token-usage days, org chart, Sew chat) and k2-daemon (heartbeat and settings routes, calendar providers, mail digests): it maps IANA zone names from a compiled-in table and converts times; no file or network reads. Its cost is stale zone data: rule changes after its bundled tzdata don't apply. Plan: jiff's time zones, in the same move as chrono. Any vulnerability advisory on chrono-tz blocks."

# crypto-bigint 0.5.5
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "Timing variability in constant-time operations; via p256 0.13 <- hpke in k2-core, for end-to-end push sealing (HPKE seals only in production; crypto-bigint only decodes and range-checks; scalar multiplication is p256's; long-term P-256 keys sign through ring). ssh-key 0.6.7 holds p256 at 0.13 (ssh-key 0.7 is a release candidate): revisit when ssh-key 0.7 ships."

