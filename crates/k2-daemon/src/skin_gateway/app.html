<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thread — K2</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header>
    <strong>Thread</strong>
    <span id="who"></span>
    <button id="out" type="button">Sign out</button>
  </header>
  <aside id="rooms"></aside>
  <main>
    <ol id="log"></ol>
    <form id="post">
      <input id="text" autocomplete="off" placeholder="Write in this room">
      <button type="submit">Post</button>
    </form>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
