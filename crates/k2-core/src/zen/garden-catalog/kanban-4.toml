# Garden catalog entry `k2.kanban@4` (Rosson 2026-10-15, for 0.45.7: "we'll
# include the new kanban garden as a template (we'll offer a default that
# can be manipulated after being added)").
#
# A Kanban board: columns of cards you add, edit, drag and delete, kept in
# this Garden's data (k2.store), so agents you allow can add and move cards
# too (`k2 store … --widget k2:kanban`). It starts with To do / Doing / Done
# and three cards that explain the board; everything is yours to change. One
# custom widget, the built-in `k2:kanban@4`, fills the window. Its toolbar
# sits in K2's top band; K2's own controls (the Garden switcher, the theme
# picker and the Zen toggle) sit in one small ⋯ menu at the top left, and
# Ctrl+Cmd+Z still leaves Zen. No usage chip (the catalog's norm, as the
# Diary) and no theme of its own.
#
# @2 (Rosson 2026-10-18, for 0.46.1): the Thread panel in K2's Thread look
# in K2 Companion's colours ([widget.props.config] look = "garden" keeps the
# Garden theme's colours).
# @3 (Rosson 2026-10-20, for 0.46.3): the same page on k2:kanban@3, whose
# Thread panel scrolls like K2's Thread: a message arriving never moves you
# when you have scrolled up (a "new messages" pill counts it and takes you
# down), and keeps you at the bottom when you are there. A synced Kanban
# Garden (template k2.kanban@1 or @2) showed that page; an own copy keeps the
# board it has. The board's data is the same (`data:k2:kanban`), so nothing
# moves.
# @4 (Rosson 2026-10-20, Thread parity for 0.46.3): the same page on
# k2:kanban@4, whose Thread panel has K2's Thread files and links: a
# message's files as chips (changed, moved or deleted, or "not shared with
# you"), images shown as the picture (click for full size), file paths
# that lead into the agent's workspace as links, files picked in the message
# box riding the post, the Thread marked read as you read it, catching up
# after you come back, and earlier messages as you scroll up. A synced
# Kanban Garden (template k2.kanban@1, @2 or @3) shows this page; an own
# copy keeps the board it has.
#
# Released files never change (a better page is kanban-5.toml). The
# [catalog] table is metadata, not part of the page.
id = "k2.kanban@4"
schema = 1

[catalog]
short = "kanban"
label = "Kanban"
description = "A board of cards in columns. Starts with To do, Doing and Done; drag, edit and add your own. Your agents can add and move cards too."
order = 20
# Offered in New Garden, never seeded: a new computer starts with Gardens
# 1 and 2 and the Diary.
new_users = false

# The whole window is the board: the ⋯ menu floats over its top band.
[layout]
kind = "columns"
canvas = "full"

[[layout.column]]
widget = "board"
size = 100
min-width = 360

[[widget]]
id = "board"
kind = "custom"
widget = "k2:kanban@4"
column = 0

# Chrome (prd-zen-freeform-chrome FC25): one small ⋯ menu, top left,
# holding the Garden switcher, the theme picker and the Zen toggle.
[[widget]]
id = "more"
kind = "menu"
slot = "top"
align = "start"
[widget.props]
icon = "dots"
label = "Kanban"

[[widget]]
kind = "garden-switcher"
slot = "menu"
menu = "more"

[[widget]]
kind = "theme-picker"
slot = "menu"
menu = "more"

[[widget]]
kind = "zen-toggle"
slot = "menu"
menu = "more"

# Controls (Z27, G24), as every template declares them for `page.controls`:
# the two required ones sit in the ⋯ menu, so K2 checks the menu's button
# (FC25); the empty band still drags the window.
[[control]]
kind = "garden-switcher"
placement = "menu:more"

[[control]]
kind = "drag-region"
placement = "top"

[[control]]
kind = "zen-toggle"
placement = "menu:more"
