[package]
name = "yrs"
version = "0.28.0"
description = "High performance implementation of the Yjs CRDT"
license = "MIT"
authors = ["Kevin Jahns <kevin.jahns@pm.me>", "Bartosz Sypytkowski <b.sypytkowski@gmail.com>"]
keywords = ["crdt", "yrs"]
edition = "2018"
homepage = "https://github.com/y-crdt/y-crdt/"
repository = "https://github.com/y-crdt/y-crdt/"
readme = "./README.md"

[features]
default = []
weak = []
sync = []
small-client = []
# k2, test-only: compiles the bugs tests/position_index.rs plants to prove they're caught.
# Never enable it in a build.
planted-position-bugs = []
# k2, test-only: compiles the touched-clients bug tests/touched_clients.rs plants to prove it's
# caught. Never enable it in a build.
planted-touched-bug = []
# k2, test-only (hardening): compiles the relay bug tests/update_event_relay.rs plants, to prove
# it's caught. Never enable it in a build.
planted-relay-bug = []

[dependencies]
thiserror = "2"
fastrand = { version = "2", features = ["js"] }
smallstr = { version = "0.3", features = ["union"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "const_new"] }
async-lock = "3.4"
async-trait = "0.1"
arc-swap = "1.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
dashmap = "6.2"

[dev-dependencies]
criterion = "0.8"
flate2 = "1"
ropey = "1.6.0"
proptest = "1.11"
proptest-derive = "0.8.0"
assert_matches2 = "0.1"
uuid = "1.26"

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "id_set"
harness = false

[lib]
doctest = true
bench = true
doc = true
