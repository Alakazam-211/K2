[package]
name = "k2-node"
# Versioned by k2-node-proto's PROTOCOL, not the product version.
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-Apache-2.0"
description = "K2 compute node runtime: runs a controller's jobs as its own OS user. Never links k2-core or k2-daemon (CN26)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "k2-node"
path = "src/main.rs"

[features]
# TEST ONLY: also trust the TEST minisign key for self-update, honour the
# K2_NODE_ADMIN_TEST_HOOK service-manager stand-in, and allow build.rs's
# version/broken overrides. Release builds never enable it; release
# signing refuses a binary containing K2_NODE_TEST_KEYS_ENABLED.
test-keys = ["k2-root-proto/test-signer"]

[[example]]
name = "k2-node-testsign"
path = "examples/testsign.rs"
required-features = ["test-keys"]

[dependencies]
k2-node-proto = { path = "../k2-node-proto" }
# Signed node builds use the root-helper key + verifier (node admin §8.1).
k2-root-proto = { path = "../k2-root-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "fs", "sync", "signal"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
k2-root-proto = { path = "../k2-root-proto", features = ["test-signer"] }
