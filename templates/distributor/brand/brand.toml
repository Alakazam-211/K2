# An example brand file for a made-up distributor: Globex Studio, command gy.
# Copy this folder into your own repo as brand/ and change the values.
#
# The K5 build reads this file when K2_BRAND_DIR names its folder (the
# pipeline sets it; you never edit K5's own brand/ folder). It knows the
# tables and keys below and nothing else: a table or key it does not know
# stops the build, so add only what K5's release notes say a brand file
# may hold. A field you leave out is K5's own value (brand/k2 in K5's
# repo); the README's field guide says which ones you must set.
#
# Before you ship, `bash scripts/brand.sh lint <this folder> --live
# --hosted` must pass on the K5 tag you build (the pipeline runs the lint
# on every build). --hosted refuses a brand that leaves out a field a
# hosted box of yours needs, or sets one of them to K5's own value.

# The brand's id: lowercase letters and digits, a letter first, 2 to 12
# long. Programs read it, people never type it. It is stamped into every
# binary of the build (the brand mark, checked before signing), and a
# coming K5 release also writes it into each server's data folder, so a
# server made by your build is never started by another brand's daemon.
# Pick it once: changing it later strands your users' servers.
id = "globex"

# The brand file's format. 1 is the only one K5 reads today. K5's release
# notes say when a new one comes and what changes.
schema = 1

[names]
# The product's name: what people read in prose, windows, menus and
# messages. 1 to 40 characters. It may not contain K2, K5 or Kessel, may
# not be another brand's product (in any case), and may not appear whole
# in K5's own text. It is never made from the command, nor the command
# from it: a build that prints one where the other belongs fails the
# output judges.
product = "Globex Studio"
# The name where space is short (left out: the product's).
short = "Globex"
# Your company, and the product with its maker (left out:
# "<product> by <company>").
company = "Globex Corporation"
lockup = "Globex Studio by Globex Corporation"
# What a box is called (left out: "<product> Server").
server = "Globex Studio Server"
# The account your users sign in with.
login = "Globex Account"

[cli]
# The command people and agents type, and the CLI's file name. Lowercase
# letters and digits, a letter first, 2 to 12 long. The policy refuses a
# system command, a shell builtin, a PowerShell or cmd.exe name, a
# developer tool or a common shell alias, our names and their look-alikes,
# a name another brand holds, and a name that is a word in K5's own text.
# `--live` also asks the build host's shells and the package indexes.
# Every help page, study page, permission card, skill and `Ask with:` line
# of your build says this name; nothing reads it at run time.
name = "gy"

# Other names this build answers to. An alias may only be one of your own
# former command names (never k2, k5 or another brand's), each with a mode:
#   silent     runs, says nothing;
#   notice     runs, and prints one line naming your current command;
#   tombstone  runs nothing, prints the command to type now, exits 127.
# A new brand has none. To rename your command later, put the old name
# here as "notice", then "tombstone" a release or two after.
aliases = []

# Packaging values. bundle_id: the macOS bundle id. update_feed: the
# desktop app's update manifest (https). desktop_id: the Linux .desktop
# file's and icon's name. gui_binary: the Linux GUI program's name.
[package]
bundle_id = "example.globex.studio"
update_feed = "https://updates.globex.example/studio/latest.json"
desktop_id = "globex-studio"
gui_binary = "globex-studio"

# The update keys your build trusts: minisign public key lines, primaries
# first, your backup last, and the same key as update_pubkey in
# distributor.conf. They sign your daemon, and so are also the trust root
# of the Sew pins it carries. Never one of K5's (the
# build refuses that). This one is a placeholder made only for tests: its
# private half never existed, and `brand.sh lint --hosted` refuses it, so
# put your own key here before you ship.
[update]
keys = [
    { role = "primary", key_id = "E5A48B9699901B0F", pubkey = "RWQPG5CZlouk5cumw8FmJEvxMK5bNan2q2fBqrqyCWOY7/rp5kSjA9Ri" },
]

# Where your boxes are named: <subdomain>.<label>. That is their only
# name: a box of yours gets no second name under K5's own zone.
[zones]
label = "studio.example.invalid"

# Where your updates come from, besides [package] update_feed: the
# headless daemon's manifest, and the folder a release's files are in.
[feeds]
daemon = "https://updates.globex.example/studio/daemon-latest.json"
downloads = "https://updates.globex.example/studio/download"

# Your icons and colour. icons: a folder in this brand folder. accent:
# #RRGGBB, or leave it out for the style's own.
[look]
icons = "assets/icons"
accent = "#2F6FE0"

# Where your users are sent. Every link is https; dashboard and feedback
# may be "" (no account page; the Send feedback button off).
[links]
site = "https://studio.example.invalid"
support_email = "help@studio.example.invalid"
support_url = "https://studio.example.invalid/support"
terms = "https://studio.example.invalid/terms"
privacy = "https://studio.example.invalid/privacy"
dashboard = ""
feedback = ""

# The address system mail to your users comes from, and the name on it.
# Each box sends from its own server name ({server}: noreply@{server} is
# noreply@box.partner.example for the box box.partner.example), so SPF,
# DKIM and DMARC go on each box's name, never on your apex domain.
# postal: whether your boxes may join Postal (true or false).
[mail]
system_from = "noreply@{server}"
system_from_name = "Globex Studio"
postal = false

# What calls and chat name the service.
[sew]
call_name = "Globex Studio"

# Left out, so they are K5's own: [control] (Connect, the certificate
# broker, push and the relays are ours; a brand that sets [control] sets
# all six), [machine] (the home folder, program and unit names: a brand
# may not rename them yet) and [phone] (your boxes pair with our
# phone app unless you have your own: then set bundle_id, team_id and
# push_topic).
