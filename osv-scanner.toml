# rustls 0.22.4 (alias RUSTSEC-2026-0348)
[[IgnoredVulns]]
id = "GHSA-h2v8-394m-p7vv"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "Brotli certificate decompression (RFC 8879), which rustls added in 0.23 behind the off-by-default brotli feature. rustls 0.22.4 has no certificate compression code at all (no CertDecompressor, no brotli dependency or feature), so the bug can't be there; osv's range simply starts at 0. 0.22.4 comes only via imap 3.0.0-alpha.15 (the newest imap) -> rustls-connector 0.19. K2's rustls 0.23 is 0.23.46, the fixed version. Fix: move imap off rustls-connector 0.19."

