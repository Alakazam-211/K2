[package]
name = "k2"
version = "0.46.5"
edition = "2021"
description = "Developer workspace with terminals, git worktrees, and agent presets"
license = "FSL-1.1-Apache-2.0"

[lib]
name = "k2_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "k2"
path = "src/main.rs"

[dependencies]
# The thin client's shared crate: K2 paths, process bootstrap, launchd +
# bundle layout, the keychain account session, perf timers, release sums.
# NOT k2-core (0.46.4): this app is connection points + OS integration
# only, and everything that needs k2-core (DB, workspaces, heartbeats,
# agents) is reached over the daemon's /cli/* routes. Linking k2-core here
# compiled its whole tree (SQLite, llama.cpp, oxc, git2, ngrok, …) a
# second time in every release build, with different features than the
# daemon's build.
k2-client = { path = "../crates/k2-client" }

# NOTE: tauri's `unstable` (multiwebview, for the Browser Tab) is pulled in
# ONLY via the opt-in `browser-pane` cargo feature below — never here.
# `devtools` so Settings → General → Open DevTools works in release builds
# (open_devtools is cfg'd on debug_assertions | feature = "devtools").
tauri = { version = "2.12", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-deep-link = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
# Desktop notification on FeedbackCreated (Feedback F2 —
# prd-agent-feedback-notifications §6). macOS Notification Center via
# the standard Tauri v2 plugin; the renderer fires it through
# @tauri-apps/plugin-notification.
tauri-plugin-notification = "2.5"

# Cross-platform OS keychain for K2 Connect remote-host tokens. Backs
# the `k2_secret_{set,get,delete}` Tauri commands. Keyed by ConnectHost
# id so a remembered remote token persists across restarts without ever
# touching plaintext (`connect-hosts.json` holds only non-secret fields).
#
# Backends: macOS Keychain · Linux Secret Service · Windows Credential
# Manager — so this is Linux-ready out of the box. The `apple-native`,
# `windows-native`, and `sync-secret-service` features select the
# native store per platform.
#
# LINUX DEPENDENCY: `sync-secret-service` talks to libsecret over D-Bus,
# which requires the system `libsecret` runtime (package `libsecret-1-0`
# on Debian/Ubuntu, `libsecret` on Fedora/Arch) AND a running Secret
# Service provider (gnome-keyring / KWallet). Document this in the Linux
# build/runtime notes when Linux packaging lands.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
url = "2"
libc = "0.2"
# Phase 2 Unit 2 — `llama-cpp-2` + `encoding_rs` direct deps removed.
# LLM inference moved to k2so-daemon; src-tauri/src no longer imports
# either crate. k2so-core still pulls in `llama-cpp-2` (with `metal`
# + `sampler` features) for the LlmManager type, and `encoding_rs`
# for token decoding — they're available transitively but Tauri's
# own source tree doesn't need to compile them as direct deps.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tauri-plugin-drag = "2.1.0"
tauri-plugin-opener = "2.6"
notify = { version = "7", features = ["macos_fsevent"] }
# Daemon /events subscriber (daemon_events.rs): plain ws to 127.0.0.1.
tungstenite = "0.24"
parking_lot = "0.12"

# 0.46.4: removed direct deps no src-tauri source used (they came over
# with modules that later moved to k2-core / the daemon): git2 (vendored
# OpenSSL), ngrok, alacritty_terminal, portable-pty, fontdue, qoi,
# argon2, subtle, ignore, trash, getrandom, glob, futures, futures-util,
# tokio-tungstenite, vte, ahash, notify-debouncer-mini, and the unix PTY
# helpers (polling, rustix, mio, signal-hook, signal-hook-mio).

# ONLY genuinely mac-only deps belong here. For ~15 months this section
# header sat at the TOP of the dependency list (just `objc`/`cocoa` intended),
# silently scoping the ~40 deps that followed it to macOS — invisible on mac,
# and the reason the k2 crate could never resolve on Linux (opener/drag plugin
# permission schemas were never emitted). Found by the 0.40.31 Linux port.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
# WKWebView history via tauri::Webview::with_webview. Same objc2-web-kit
# line wry 0.57 pins; WKNavigation exposes goBack / goForward.
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "WKWebView",
    "WKNavigation",
    # Browser freeze-frame (commands/browser_snapshot.rs).
    "WKSnapshotConfiguration",
    "block2",
] }
# Browser freeze-frame: snapshot NSImage → CGImage → ImageIO JPEG, and the
# pane's corner radius (commands/browser_webviews.rs). Same 0.3.2 lines wry
# 0.57 pins.
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSResponder",
    "NSView",
    "NSColor",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
] }
# Same tao tauri-runtime-wry uses (path-patched to third_party/tao). Only for
# `tao::platform::macos::set_event_fault_hook` (src/event_faults.rs).
tao = "0.37"
log = "0.4"
# Traffic-light positioning + observers (commands/traffic_lights.rs): objc2
# sends are `C-unwind`, so `objc2::exception::catch` can stop an ObjC
# exception before it reaches an `extern "C"` IMP. Same lines tao uses.
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSGeometry",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSValue",
] }

# Linux page history is webkit2gtk::WebView on the child tauri already
# stores. Same pin as wry 0.57 (=2.0.2) so this is not a second webkit.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Browser freeze-frame: the WebKitGTK snapshot is a cairo image surface.
# Same 0.18 line webkit2gtk 2.0.2 uses.
cairo-rs = "0.18"

# Windows page history is the controller's ICoreWebView2, not a new webview.
# Tauri 2.12 / wry 0.57 use webview2-com 0.39 and windows-core 0.62.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Browser freeze-frame: CapturePreview writes into an SHCreateMemStream.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
default = ["browser-pane"]
# Embedded Browser Tab (PRD prd-browser-pane-v1.md). Pulls tauri's
# `unstable` multiwebview API, which has documented whole-app side effects
# (WindowEvent::Focused regression, tauri #12568) — watch focus-dependent
# paths after upgrades. ON by default since the browser-pane arc shipped
# (renderer BrowserPane + tabs-store 'browser' items drive these commands).
# Feature-less builds keep the inert stub: `cargo check -p k2 --no-default-features`.
browser-pane = ["tauri/unstable"]

[dev-dependencies]
# Benchmark framework for src-tauri/benches/*.rs. Dev-only; never ships in
# release binaries. Provides baseline-vs-current comparison + statistical
# significance reporting (mean, stddev, p99, outlier rejection).
criterion = { version = "0.5", features = ["html_reports"] }

# Test / bench only (never in `cargo build`): the k2-core helper tests in
# commands/k2so_agents.rs + agent_hooks.rs and benches/perf.rs (terminal
# reflow) exercise k2-core directly. `test-util` enables db::shared()'s
# in-memory fallback.
k2-core = { path = "../crates/k2-core", features = ["test-util"] }

# benches/perf.rs drives raw SQLite inserts directly. rusqlite was removed
# as a DIRECT dependency of this crate (Phase 2 close-out, 2026-05-23) but
# the bench still needs it; dev-only, same bundled version k2-core pins,
# so cargo reuses the one compiled artifact. Never ships in release.
rusqlite = { version = "0.31", features = ["bundled"] }

# Sandbox dirs for the worktree command's path-safety unit tests.
tempfile = "3"

# benches/perf.rs only (grid-hash and file-walk baselines). Were normal
# deps until 0.46.4; no src-tauri source uses them.
ahash = "0.8"
ignore = "0.4"

# commands::secrets tests: a throwaway file keychain per test (open, unlock,
# item ops), so they pass on compute nodes, whose job user has no default
# keychain, and never write the login keychain. The same security-framework
# 3 keyring's apple-native backend links: no new crate.
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"

[[bench]]
name = "perf"
harness = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# The `objc` crate's `msg_send!` macro expands to `#[cfg(cargo-clippy)]`
# gates that the newer Rust `unexpected_cfgs` lint doesn't recognize.
# Declaring `cargo-clippy` as an expected cfg value silences the
# warnings cleanly; upstream objc is frozen at a version that pre-dates
# the stricter cfg check. Replace with objc2 migration as a follow-up.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
