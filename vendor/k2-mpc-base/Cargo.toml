[workspace]
resolver = "2"
members = ["crates/base", "crates/conformance", "crates/spec-undo"]
# vendor/: copies of other repos by git subtree (vendor/README.md). Excluded so they never
# become members (no lints, fmt or tests of ours run on them). fuzz/: the cargo-fuzz targets,
# their own workspace (nightly and libFuzzer, never in a normal build; tools/README.md).
exclude = ["spike", "vendor", "fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
publish = false

# The kit's own dev and test builds (tools/README.md, "Build settings"). Cargo applies a
# workspace's profiles only when that workspace is the one being built, so a host that vendors
# the kit keeps its own. Release builds (the soak, the measurements) are unchanged.
# Line tables only: backtraces keep file:line; full variable info is dropped (target/ halves).
[profile.dev]
debug = "line-tables-only"

# Dependencies (the vendored engine among them) at opt-level 1: the tests run several times
# faster for a slower cold build. Debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 1
