[package]
name = "kessel-audio"
version = "0.1.0"
edition = "2021"
# sonora's MSRV.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "A real-time voice audio pipeline in pure Rust: devices, echo cancellation, noise suppression and gain control, Opus, jitter buffers with loss concealment, mixing and levels."
authors = ["Alakazam Labs"]
readme = "README.md"
documentation = "https://docs.rs/kessel-audio"
repository = "https://github.com/Alakazam-211/K2"
keywords = ["audio", "voice", "opus", "echo-cancellation", "jitter-buffer"]
categories = ["multimedia::audio"]
# Only the code, the README and the licences ship. Everything else stays in the
# repository: tests/ (tests/data is CC BY 4.0 speech for the metric tests, see
# the `speech-tests` feature; tests/scrub.rs is the repository's own publish
# check), scripts/, deny.toml and the changelog.
include = ["src/", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["cpal", "os-voice"]
# System audio devices through cpal (CoreAudio, WASAPI, ALSA). Without it only
# the null device backend is available, which needs no audio hardware or
# system libraries. cpal's `realtime` feature stays off: it pulls an MPL-2.0
# crate. objc2 and block2 reach macOS's microphone permission calls; cpal
# already uses objc2, and the permission check is why block2 is here.
cpal = ["dep:cpal", "dep:objc2", "dep:block2"]
# On iOS and Android, `Backend::OsVoiceProcessing`: the OS's own echo
# cancellation, noise suppression and gain control (iOS's VoiceProcessingIO
# audio unit through coreaudio-rs; Android's AAudio through ndk, API 28 or
# later). Does nothing on other targets.
os-voice = ["dep:coreaudio-rs", "dep:objc2-audio-toolbox", "dep:objc2-avf-audio", "dep:ndk"]
# cpal's PulseAudio host (a pure-Rust protocol client; works on PipeWire
# through pipewire-pulse).
pulseaudio = ["cpal", "cpal/pulseaudio"]
# Tests only: the metric tests that play real speech. They read tests/data,
# which isn't in the published package, so this only compiles from a repository
# checkout.
speech-tests = []
# Tests only: run the CPU bars in a debug build (a release build always runs
# them). Turn on only if the root manifest sets `opt-level = 3` for sonora*,
# ropus and rubato: a dependency's profile settings can't do that from here, and
# unoptimised they miss the bars by a long way.
cpu-bars = ["speech-tests"]

[dependencies]
bytes = "1"
crossbeam-queue = "0.3"
rtrb = "0.3"
# Pinned exactly: echo cancellation behaviour and the AGC2 tuning were
# measured against this version. Changing it means re-running the metric tests.
sonora = "=0.2.0"
# Pure-Rust Opus, bit-exact with the reference implementation (encode and
# decode, including DTX, in-band FEC and PLC).
ropus = "=0.12.18"
rubato = "5.0.1"
cpal = { version = "0.18.2", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

# The same versions and features cpal uses on iOS, so nothing new is built.
[target.'cfg(target_os = "ios")'.dependencies]
coreaudio-rs = { version = "0.14.2", optional = true, default-features = false, features = ["core_audio", "audio_toolbox"] }
objc2-audio-toolbox = { version = "0.3", optional = true, default-features = false, features = ["std", "AUComponent", "AudioUnitProperties"] }
objc2-avf-audio = { version = "0.3", optional = true, default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", optional = true, default-features = false, features = ["audio", "api-level-28"] }

[dev-dependencies]
rustfft = "6"
serde_json = "1"

[package.metadata.docs.rs]
features = ["pulseaudio"]
# The phone backend's API is only on iOS and Android.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-ios", "aarch64-linux-android"]

[lints.rust]
missing_docs = "warn"
