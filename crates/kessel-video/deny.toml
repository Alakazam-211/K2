# cargo-deny policy for kessel-video:
#   cargo deny check licenses bans
# tests/licences.rs enforces the same licence rules in `cargo test`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
exclude-dev = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
deny = [
    # No C codec library or bindings: H.264 comes from the OS, VP8 from Rust.
    { crate = "openh264" },
    { crate = "openh264-sys2" },
    { crate = "vpx-sys" },
    { crate = "env-libvpx-sys" },
    { crate = "ffmpeg-sys-next" },
    { crate = "ffmpeg-next" },
]
