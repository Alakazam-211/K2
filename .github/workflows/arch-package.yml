# Arch / Omarchy pacman package.
#
# The Mac release.sh does not compile this GUI. On a pushed release tag
# the k2-arch runner (Arch, not the Ubuntu k2-linux box) runs
# packaging/arch/build-release-pkg.sh and uploads
# k2-<version>-x86_64.pkg.tar.zst onto that GitHub release.
#
# Pre-tag gate: release.sh (scripts/arch-build-gate.sh) dispatches this
# with upload=false, ref=<release commit> and a gate_id. That run builds
# the same package and keeps it only as a short-lived workflow artifact.
# It never touches a release. gate_id goes into run-name so the script
# can find the run it started.
#
# runs-on includes k2-arch and must not include k2-linux. The Ubuntu ship
# runner also has self-hosted + Linux + X64. The extra label is what keeps
# makepkg off that box and apt jobs off this one.
#
# After the upload, the `sums` job adds the package's line to the
# release's SHA256SUMS-linux-x86_64.txt (scripts/linux-sums.sh). The build
# job first waits for app-linux.yml to create that file and fails if it
# never does. The desktop updater refuses a package with no line.
#
# No .sig. Do not pacman -U. Do not add a Linux GUI key to latest.json.

name: arch-package

run-name: ${{ inputs.gate_id && format('arch-package gate {0}', inputs.gate_id) || format('arch-package {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release to upload to (e.g. v0.40.150 or v0.40.150a). Required when upload is true."
        required: false
        default: ""
      ref:
        description: "Git ref to build. Empty uses the tag. Use main for a follow-up release."
        required: false
        default: ""
      upload:
        description: "Upload the package to the release. false = build only and keep it as a workflow artifact (release.sh pre-tag gate)."
        type: boolean
        required: false
        default: true
      gate_id:
        description: "Set by release.sh so it can find this run. Leave empty by hand."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: k2-arch-ship
  cancel-in-progress: false

jobs:
  build-arch-pkg:
    name: Build Arch package (x86_64)
    runs-on: [self-hosted, linux, k2-arch]
    timeout-minutes: 180
    outputs:
      sums_line: ${{ steps.sums_line.outputs.line }}
    steps:
      - name: Check inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_REF: ${{ inputs.ref }}
          IN_UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          if [ "$IN_UPLOAD" = "true" ] && [ -z "$IN_TAG" ]; then
            echo "::error::upload=true needs a tag to upload to"
            exit 1
          fi
          if [ "$IN_UPLOAD" != "true" ] && [ -z "$IN_REF" ] && [ -z "$IN_TAG" ]; then
            echo "::error::upload=false needs a ref (or tag) to build"
            exit 1
          fi

      - name: Checkout (at the release tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build k2-<version>-x86_64.pkg.tar.zst
        env:
          K2_GMAIL_CLIENT_ID: ${{ secrets.K2_GMAIL_CLIENT_ID }}
          K2_GMAIL_CLIENT_SECRET: ${{ secrets.K2_GMAIL_CLIENT_SECRET }}
          K2_MICROSOFT_CLIENT_ID: ${{ secrets.K2_MICROSOFT_CLIENT_ID }}
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IN_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          # Do not assign SHELLOPTS. Bash marks it readonly, and the build
          # script already strips it around makepkg.
          command -v pacman
          command -v makepkg
          if [ -n "$IN_REF" ]; then
            packaging/arch/build-release-pkg.sh
          else
            VER="${IN_TAG#v}"
            packaging/arch/build-release-pkg.sh "$VER"
          fi
          pkg="$(find dist -maxdepth 1 -name 'k2-*-x86_64.pkg.tar.zst' -size +0c | head -1)"
          test -n "$pkg"
          echo "PKG_PATH=$pkg" >> "$GITHUB_ENV"

      - name: Upload to release
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$IN_TAG" "$PKG_PATH" --clobber

      # The SUMS line for exactly the file just uploaded. The `sums` job
      # writes it into the release's SHA256SUMS-linux-x86_64.txt.
      - name: SHA256SUMS line for the package
        id: sums_line
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          set -euo pipefail
          line="$(scripts/linux-sums.sh line "$PKG_PATH")"
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      # app-linux.yml creates SHA256SUMS-linux-x86_64.txt. Wait for it here,
      # OUTSIDE the k2-linux-sums concurrency group, so the `sums` job never
      # holds that group while app-linux's merge needs it. Fails loudly when
      # the file never appears.
      - name: Wait for the app-linux SHA256SUMS file
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          K2_RELEASE_REPO: ${{ github.repository }}
        run: scripts/linux-sums.sh wait "$IN_TAG" 150

      # Gate build: keep the package for a day so a human can pull it with
      # `gh run download`. Never a release asset.
      - name: Keep as a workflow artifact (gate build, no release)
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package-gate
          path: ${{ env.PKG_PATH }}
          retention-days: 1
          if-no-files-found: error

  # Add the package's line to the release's SHA256SUMS-linux-x86_64.txt:
  # download, replace or append, re-upload with --clobber, read back.
  # Shares k2-linux-sums-<tag> with app-linux.yml's merge job, so the two
  # read-modify-writes never overlap. Idempotent: a re-run replaces the line.
  sums:
    name: Add the package to SHA256SUMS-linux-x86_64.txt
    needs: build-arch-pkg
    if: github.event_name != 'workflow_dispatch' || inputs.upload
    runs-on: [self-hosted, linux, k2-arch]
    timeout-minutes: 15
    concurrency:
      group: k2-linux-sums-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout (for scripts/linux-sums.sh)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - name: Merge the line into the release SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          K2_RELEASE_REPO: ${{ github.repository }}
          SUMS_LINE: ${{ needs.build-arch-pkg.outputs.sums_line }}
        run: |
          set -euo pipefail
          test -n "$SUMS_LINE"
          printf '%s\n' "$SUMS_LINE" > "$RUNNER_TEMP/arch.sums"
          scripts/linux-sums.sh merge "$IN_TAG" "$RUNNER_TEMP/arch.sums"
