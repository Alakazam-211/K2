schema = 1
id = "reviewer"
version = 2
name = "Reviewer"
summary = "Checks work (code, documents, Apps or plans) and reports what it finds."
kind = "agent"
aliases = ["qa"]
author = "K2"
shared_block = true

[agent]
role = "reviewer"
tool = "default"

[context]
catalog = ["wiki:index", "wiki:hygiene", "connections:roster", "skills:roster"]

[permissions]
cards = true
suggest = ["compute.use"]

[params]
about = { label = "What should it focus on?", max = 500, required = false }

[hello]
brief = "Say hello to {{person}} on the Thread: who you are and what you're for. Then do what \"Your first conversation\" in your ROLE.md says: ask only the questions still open, one or two at a time; if none are, say what you understood and what you'll start on.\nStill open from your hire: {{open_questions}}"

[[questions]]
id = "scope"
ask = "What will I review: code, documents, Apps, plans?"
fills = "role"

[[questions]]
id = "bar"
ask = "What must work meet before it passes?"
fills = "wiki:Review notes#What to check"

[[questions]]
id = "report"
ask = "Where should my findings go, and who fixes them?"
fills = "role"
