[package]
name = "k2-mpc-cad-model"
version = "0.4.0"
description = "A format-neutral model of a 2D CAD drawing (entities by handle, layers, blocks, attributes, external references), its structure index and its shared reads: the model the drawing packs share."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test-only: planted bugs (`k2_mpc_cad_model::mutant`), for the packs' `tests/mutants.rs`. No host
# enables it.
mutants = []

[dependencies]
# The kit (k2-mpc-base), by path: its checkout sits beside this repo's (a host vendors both side
# by side: vendor/k2-mpc-base beside vendor/k2-mpc-cad), at the kit release CHANGELOG.md names.
k2-mpc-base = { path = "../../../k2-mpc-base/crates/base" }
