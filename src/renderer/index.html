<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Absolute origin path: edge Worker serves /favicon.ico from R2 loader/. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <title>K2</title>
    <script>
      // Hosted web tab title before React boots: `<sub> | K2` on *.app.k2.dev.
      (function () {
        try {
          var h = (location.hostname || '').toLowerCase();
          if (!h || h === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(h)) {
            if (h === 'localhost') document.title = 'localhost | K2';
            return;
          }
          var sub = h.split('.')[0];
          if (sub) document.title = sub + ' | K2';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      /* Prevent white flash while loading */
      html, body { background: #0a0a0a; margin: 0; padding: 0; }
    </style>
    <script>
      // Stamp Style attributes before first paint so styles.generated.css
      // resolves without a flash. localStorage is this client's own record
      // of the choice (never the daemon's). Runs before any module, so retired
      // ids are mapped here too: keep this in step with STYLE_ID_ALIASES and
      // DEFAULT_SELECTION (lib/style-resolve.ts).
      (function () {
        var html = document.documentElement;
        function read(key, fallback) {
          try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
        }
        // No saved style, or the first launch of 0.46.11 (its one-time switch
        // flag is missing): the default look, Glass under Auto (Obsidian for a
        // light system, Dusk (id `yellow`) for a dark one), each palette with its own accent
        // unless DEFAULT_PALETTE_ACCENTS names one. The store saves it on this
        // launch (stores/style.ts migrateToDefaultLook).
        var switching = read('k2.style.migrated-0-46-11-glass', '') !== '1';
        var fresh = switching || !read('k2.style', '');
        var savedStyle = fresh ? 'glass' : read('k2.style', 'glass');
        var style = savedStyle === 'square' ? 'terminal'
          : savedStyle === 'bezel' || savedStyle === 'glass-next' || savedStyle === 'glass-classic' ? 'glass'
          : savedStyle;
        html.setAttribute('data-style', style);
        var mode = fresh ? 'auto' : read('k2.scheme', 'dark');
        // The side of the mode: under Auto, the OS appearance.
        var side = mode;
        if (mode === 'auto') {
          side = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        // Under Auto, the per-side key is the person's pick for this
        // appearance, right even after an OS flip while the app was closed.
        // Under a fixed mode k2.palette is the choice, and the other key may
        // hold an Auto pick. stores/style.ts keeps them all in sync.
        var palette = fresh ? (side === 'light' ? 'obsidian' : 'yellow')
          : mode === 'auto'
          ? read('k2.palette.' + side, '') || read('k2.palette', '')
          : read('k2.palette', '') || read('k2.palette.' + side, '');
        // Bezel's palettes moved: Graphite to Dusk (id `yellow`), Porcelain to Veil.
        if (savedStyle === 'bezel') palette = side === 'light' ? 'veil' : 'yellow';
        // A palette from a retired style is not on its new style: use that
        // style's default for this appearance.
        var known = {
          terminal: { charcoal: 1, paper: 1, yellow: 1, dark: 'charcoal', light: 'paper' },
          glass: { obsidian: 1, veil: 1, yellow: 1, dark: 'obsidian', light: 'veil' }
        }[style];
        if (known && known[palette] !== 1) palette = known[side];
        // A palette has one polarity; Auto can show a dark one on a light OS.
        var polarity = { charcoal: 'dark', obsidian: 'dark', yellow: 'dark', paper: 'light', veil: 'light' }[palette];
        var scheme = mode === 'auto' && polarity ? polarity : side;
        html.setAttribute('data-scheme', scheme);
        html.setAttribute('data-palette', palette || 'charcoal');
        // The accent: ready-made values the style store saves per appearance,
        // each from the accent of the palette that appearance shows
        // (k2.accent.<style>.<palette>). Used only if they are for this style
        // and palette, and only as plain colours; anything else leaves the
        // palette's own accent.
        // The default look's accents, as lib/style-accent derives them from
        // DEFAULT_PALETTE_ACCENTS (lib/style-resolve) for Dusk (dark, id `yellow`) and
        // Obsidian (light); null is the palette's own. style-accent.test.ts
        // derives these from that constant and fails until they agree.
        var defaultAccent = { dark: null, light: null };
        try {
          var accent = JSON.parse(read('k2.accent.stamp.' + side, '') || 'null');
          if (switching || (fresh && !(accent && accent.style === style && accent.palette === palette))) accent = defaultAccent[side];
          // A stamp from before accents moved per palette, while Glass's
          // shared accent is the Yellow the 0.46.11 switch forced on: the
          // store drops it this launch (lib/style-id-migration
          // migrateSharedAccentKeys), so don't paint it first.
          var oldGlass = (read('k2.accent.glass', '') || '').trim().toLowerCase();
          if (!switching && style === 'glass' && read('k2.style.migrated-accent-per-palette', '') !== '1'
            && (oldGlass === 'yellow' || oldGlass === '#ffc700' || oldGlass === '#e6b400')) accent = null;
          if (accent && accent.style === style && accent.palette === palette && accent.vars) {
            Object.keys(accent.vars).forEach(function (name) {
              if (/^--[a-z-]+$/.test(name) && /^#[0-9a-f]{6}$/i.test(accent.vars[name])) {
                html.style.setProperty(name, accent.vars[name]);
              }
            });
          }
        } catch (e) { /* a damaged stamp only costs the pre-paint */ }
        // Bezel had no density control, so its saved gaps never carry over.
        var gaps = savedStyle === 'bezel' || fresh ? '' : read('k2.gaps', '');
        if (gaps) html.setAttribute('data-gaps', gaps);
        if (scheme === 'light') {
          // Override the dark anti-flash <style> above before first paint.
          html.style.background = '#fafafa';
          document.addEventListener('DOMContentLoaded', function () {
            document.body.style.background = '#fafafa';
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
