# The app-wide cargo-deny policy: what K2 ships (the app, the daemon and
# their workers), checked against the real Cargo.lock, and every other
# Cargo.lock K2 owns (the app template, third_party: SIDE in the script).
#
#   bash scripts/ci/cargo-deny.sh            (scripts/ci/checks.sh audit runs it)
#
# The script runs `cargo deny --manifest-path <crate>/Cargo.toml check
# --config deny.toml advisories bans licenses sources` once per shipped
# crate, each with its own default features: the features the release
# builds use (scripts/lib/build-binaries.sh, scripts/ci/build-linux-bins.sh,
# scripts/windows/build-nsis-release.ps1). Never --all-features: test-only
# features (test-keys, test-hostile, provider-fakes, sew-test-pins...) are
# not shipped. The shipped crate list is in that script.
#
# One policy for the app. The deny.toml files under crates/ stay for those
# crates' own published checks; this gate reads only this file.

[graph]
# Every target the app and its workers ship: Linux x86 and Arm (the daemon,
# k2-node, the root helper, the App engine, the Linux app), the Mac (Apple
# silicon only: no Intel build ships) and Windows (the NSIS Alpha).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    # Once a wasm build ships:
    # "wasm32-unknown-unknown",
]
# Dev-dependencies are not shipped. Build-time (proc-macro, build-script)
# dependencies stay in the check.
exclude-dev = true

[advisories]
# The RustSec database, fetched at check time. A vulnerability in a shipped
# crate fails the check, and so do unmaintained and unsound notices (the
# cargo-deny defaults, kept). Every ignore carries its reason here and has
# its entry, with a review-by date, in osv-scanner.toml (the advisory
# ledger; scripts/ci/audit-ignores.py checks both). The reasons below are
# the ledger's; renew or drop an entry in both places.
# The list covers all twelve crate trees, so a run that doesn't meet an
# ignore only warns; scripts/ci/cargo-deny.sh fails when an ignore matches
# none of the twelve (a stale ignore is removed, not kept).
unused-ignored-advisory = "warn"
ignore = [
    # rsa 0.9.10 (k2-vault directly and via ssh-key 0.6.7)
    { id = "RUSTSEC-2023-0071", reason = "K2's only RSA private-key operation is k2-vault's ssh-agent signing (ssh_agent.rs AgentKey::sign): PKCS#1 v1.5 signatures, SHA-2 only, through rsa's try_sign_with_rng, which blinds the exponentiation with a fresh random factor and checks the result (rsa_decrypt_and_check). K2 does no RSA decryption, so Marvin's padding oracle has nothing to query, and ssh-key's own unblinded RSA signer is never called (RSA keys go through to_rsa). The agent socket serves same-uid peers only (SO_PEERCRED / getpeereid). A remote ssh server can time only signatures over a padded hash it can't choose, a burst of 60 and 240/min per (session, secret) by default; forwarded connections are refused by default (that check trusts the client's session-bind). No fixed rsa release exists: revisit when upstream's constant-time rewrite (rsa 0.10) ships." },
    # proc-macro-error 1.0.4
    { id = "RUSTSEC-2024-0370", reason = "Unmaintained proc-macro helper (build time only), via gtk-rs 0.18 macros of the Linux Tauri stack. Revisit with Tauri's gtk-rs update." },
    # instant 0.1.13
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained (no known vulnerability); via notify 7 -> notify-types. Revisit with notify 8." },
    # unsafe-libyaml 0.2.11
    { id = "RUSTSEC-2024-0449", reason = "Unmaintained only (no known vulnerability), via serde_yaml 0.9 in k2-core. The input is hostile by design: cli_folder_trust/scan.rs reads skill and agent frontmatter from folders before they are trusted, and caps each read at 256 KiB per file (MAX_FILE_BYTES); workspace/launch_profile.rs is the other user. Replacing serde_yaml depends on a maintained YAML parser on the licence allowlist that reads the same nested frontmatter in both files (a new crate, so a Steward ruling first)." },
    # rustls-pemfile 2.2.0
    { id = "RUSTSEC-2025-0134", reason = "Unmaintained (functionality moved into rustls-pki-types); used to read local PEM files (k2-core, k2-daemon, native-certs). No known vulnerability. Replace with rustls-pki-types' PEM API." },
    # bincode 1.3.3
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained (no known vulnerability). One use: k2-core's ptyd saved-screen file (terminal/ptyd/snapshot.rs, 0.46.5 S4), K2's own file (0600 in a 0700 dir under <K2 home>/run), written and read by the same daemon user. Decode is bounded: magic + FORMAT header, a file of at most 64 MiB, gzip inflate capped at 256 MiB, bincode with_limit, then a trial restore under catch_unwind; anything else is removed and the session replays from the ring. Fix: 0.46.6 replaces the codec (postcard as FORMAT 2, keeping a read-only FORMAT 1 reader for one release), then drop bincode." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0008", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature. Seven k2-core files use git2 (git.rs, git_changes.rs, git_notes.rs, git_tools.rs, turn_changes.rs, worktree_task.rs, deploy/build.rs); none calls the affected APIs. Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0183", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature. Seven k2-core files use git2 (git.rs, git_changes.rs, git_notes.rs, git_tools.rs, turn_changes.rs, worktree_task.rs, deploy/build.rs); none calls the affected APIs. Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # git2 0.19.0
    { id = "RUSTSEC-2026-0184", reason = "Unsound Buf deref / Remote::list / blame_buffer Signature. Seven k2-core files use git2 (git.rs, git_changes.rs, git_notes.rs, git_tools.rs, turn_changes.rs, worktree_task.rs, deploy/build.rs); none calls the affected APIs. Fix: git2 0.20+/0.21 (dependency-majors PRD)." },
    # ttf-parser 0.21.1
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained (no known vulnerability); via fontdue in k2-core's terminal font renderer, which only loads K2's own bundled Meslo font (include_bytes). Revisit with a fontdue update." },
    # quick-xml 0.38.4, quick-xml 0.39.2
    { id = "RUSTSEC-2026-0194", reason = "Quadratic attribute check / NsReader allocation DoS. 0.38: k2-core thumbs.rs and k2-node-proto results.rs parse local or job-produced XML (no NsReader), and Tauri's plist reads XML at build time and, at runtime on the Mac, the app's own Info.plist; 0.39: wayland-scanner proc-macro at build time. Fix: quick-xml 0.41." },
    # quick-xml 0.38.4, quick-xml 0.39.2
    { id = "RUSTSEC-2026-0195", reason = "Quadratic attribute check / NsReader allocation DoS. 0.38: k2-core thumbs.rs and k2-node-proto results.rs parse local or job-produced XML (no NsReader), and Tauri's plist reads XML at build time and, at runtime on the Mac, the app's own Info.plist; 0.39: wayland-scanner proc-macro at build time. Fix: quick-xml 0.41." },
    # smallstr 0.3.1
    { id = "RUSTSEC-2026-0215", reason = "Unmaintained advisory only; reached through the vendored yrs fork (in the daemon, and in k2-export through k2-mpc-base), in maintenance mode and leaving text at the native switch." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0367", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). k2-core is on zip 9.0.5 (fixed); left: the updater's zip 4.6.1. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0368", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). k2-core is on zip 9.0.5 (fixed); left: the updater's zip 4.6.1. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0369", reason = "Advisories are in ZipArchive::extract()/ZipStreamReader::extract(); K2 never calls them (own extractor fs_extract.rs masks modes to 0o777 since 0.46.3; tauri-plugin-updater's zip 4.6 is Windows-installer only). k2-core is on zip 9.0.5 (fixed); left: the updater's zip 4.6.1. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test." },
    # zvariant 5.10.0
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener), and zbus is also a direct dependency of k2-deskd and kessel-video. No known vulnerability. Revisit with zbus 6." },
    # zbus_names 4.3.1
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener), and zbus is also a direct dependency of k2-deskd and kessel-video. No known vulnerability. Revisit with zbus 6." },
    # zvariant_derive 5.10.0
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained zbus sub-crate split; Linux desktop D-Bus (notify-rust, opener), and zbus is also a direct dependency of k2-deskd and kessel-video. No known vulnerability. Revisit with zbus 6." },
    # crypto-bigint 0.5.5
    { id = "RUSTSEC-2026-0387", reason = "Timing variability in constant-time operations; via p256 0.13 <- hpke in k2-core, for end-to-end push sealing (HPKE seals only in production; crypto-bigint only decodes and range-checks; scalar multiplication is p256's; long-term P-256 keys sign through ring). ssh-key 0.6.7 holds p256 at 0.13 (ssh-key 0.7 is a release candidate): revisit when ssh-key 0.7 ships." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0429", reason = "DoS only (abort on a symlink entry with a huge declared size), in ZipArchive::extract(). K2's own zip readers (k2-core fs_extract.rs extract_entries, sim/android/sdk.rs extract, jscheck/inspect.rs load_zip, sim/android/apk.rs read) walk by_index/by_name and read the bytes; none calls extract(). The one extract() caller is tauri-plugin-updater 2.13 extract_zip (Windows only), and src-tauri commands/updater.rs app_update_install passes it only bytes already verified with k2_release_keys. k2-core is on zip 9.0.5 (fixed); left: the updater's zip 4.6.1. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test (its install() changes)." },
    # chrono 0.4.44
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no known vulnerability. K2 uses it directly: k2-core (heartbeat schedules via chrono::Local in heartbeats/cron.rs, reminders, token usage, org chart), k2-daemon, k2-vault, k2-client, the app, and the vendored deckcraft-text in k2-deckrender; transitively via croner, imap, trash, chrono-tz and schemars (sew-proto 0.3 and 0.11). Plan: move to jiff (or time). K2's own ~1,000 call sites are one builder pass with wire and DB timestamp-format tests; removing chrono from the tree also waits on croner, imap, trash and Sew's crates dropping it. Any vulnerability advisory on chrono blocks." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0545", reason = "zip 4.6.1 only, via tauri-plugin-updater 2.13.0 (Windows target only); k2-core, k2-node and k2-deckrender are on zip 9.0.5 (fixed). The flaw is on the AES password read paths (by_index_decrypt, by_name_decrypt) with the aes-crypto feature; this zip build has no features (no aes/hmac deps in Cargo.lock) and the updater never decrypts: its extract_zip reads with ZipArchive, and only bytes app_update_install has already verified. The plugin's webview commands are not granted: src-tauri/capabilities/default.json grants no updater:* permission and the web build shims @tauri-apps/plugin-updater to a no-op; installs go only through K2's own command (src-tauri/src/commands/updater.rs) after k2_release_keys::verify_app_update. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test." },
    # zip 4.6.1
    { id = "RUSTSEC-2026-0548", reason = "zip 4.6.1 only, via tauri-plugin-updater 2.13.0 (Windows target only); k2-core, k2-node and k2-deckrender are on zip 9.0.5 (fixed). The flaw is in ZipStreamReader / read_zipfile_from_stream, which trust the local headers; the updater's extract_zip reads with ZipArchive (the central directory), and only bytes app_update_install has already verified; k2 zen inspect refuses a bundle whose local headers disagree with its central directory (validate_header_consistency). The plugin's webview commands are not granted: src-tauri/capabilities/default.json grants no updater:* permission and the web build shims @tauri-apps/plugin-updater to a no-op; installs go only through K2's own command (src-tauri/src/commands/updater.rs) after k2_release_keys::verify_app_update. Fix: tauri-plugin-updater 2.14.1 (zip 9), parked for 0.46.16 behind a signed self-update test." },
    # chrono-tz 0.10.4
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; no known vulnerability. Direct dependency of k2-core (heartbeat schedules and reminders, token-usage days, org chart, Sew chat) and k2-daemon (heartbeat and settings routes, calendar providers, mail digests): it maps IANA zone names from a compiled-in table and converts times; no file or network reads. Its cost is stale zone data: rule changes after its bundled tzdata don't apply. Plan: jiff's time zones, in the same move as chrono. Any vulnerability advisory on chrono-tz blocks." },
]

[licenses]
# The Kessel licence allowlist. A dual (OR) licence passes when one of its
# options is here. Anything not here is rejected, including MPL-2.0, GPL,
# LGPL, CC0, OFL-1.1 and Ubuntu-font-1.0. The crate-scoped exceptions below
# are the only way past it: CC0-1.0 for notify and tiny-keccak; MPL-2.0
# for cssparser, cssparser-macros, selectors, dtoa-short and option-ext.
# Each covers that crate only (all versions); any other MPL or CC0 crate is
# still a finding. An exception no shipped tree uses fails the gate
# (scripts/ci/cargo-deny.sh): remove it rather than let it linger. The
# CC0-1.0 exception for to_method belongs to the video worker, which K2
# doesn't ship yet: it stays in that worker's own crate policy and comes
# back here when the worker lands.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# One policy for twelve crate trees: a licence on the list that one tree
# doesn't use is expected, not a finding.
unused-allowed-license = "allow"

# Rosson 11-03, Tauri's five; unmodified, source on crates.io
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

# Rosson 11-03, Tauri's five; unmodified, source on crates.io
[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

# Rosson 11-03, Tauri's five; unmodified, source on crates.io
[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

# Rosson 11-03, Tauri's five; unmodified, source on crates.io
[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

# Rosson 11-03, Tauri's five; unmodified, source on crates.io
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# Rosson 11-08, card 70d82c46
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

# Rosson 11-08, card 70d82c46
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "allow"
deny = [
    # deckcraft's bundled-font crate must be disabled, not licensed.
    { crate = "epaint_default_fonts" },
    # No C TLS, HTTP or zlib in any shipped tree (Steward, gix S0, 0.46.18):
    # gix runs on zlib-rs and has no network features here.
    { crate = "openssl-sys" },
    { crate = "curl-sys" },
    { crate = "libz-ng-sys" },
    # libgit2's bundled zlib, only until git2 leaves the tree (gix S7).
    { crate = "libz-sys", wrappers = ["libgit2-sys"] },
    # MPL-2.0, pulled only by gix's forbidden pack-cache-lru-static.
    { crate = "uluru" },
]

# gix: pure-Rust features only (prd research-gix-instead-of-libgit2-v1 §4).
# max-performance / max-control / pack-cache-lru-static pull uluru (MPL);
# `default` and `extras` carry them and the credential/network stack; no
# alternative zlib backend; no HTTP or network transport of any kind.
[[bans.features]]
crate = "gix"
deny = [
    "default",
    "extras",
    "max-performance",
    "max-control",
    "pack-cache-lru-static",
    "zlib-sirocco",
    "credentials",
    "blocking-network-client",
    "async-network-client",
    "async-network-client-async-std",
    "blocking-http-transport-curl",
    "blocking-http-transport-curl-openssl",
    "blocking-http-transport-curl-rustls",
    "blocking-http-transport-reqwest",
    "blocking-http-transport-reqwest-native-tls",
    "blocking-http-transport-reqwest-rust-tls",
    "blocking-http-transport-reqwest-rust-tls-trust-dns",
]

[[bans.features]]
crate = "gix-pack"
deny = ["pack-cache-lru-static"]

[[bans.features]]
crate = "gix-zlib"
deny = ["sirocco"]

[[bans.features]]
crate = "gix-transport"
deny = [
    "blocking-client",
    "async-client",
    "http-client",
    "http-client-curl",
    "http-client-curl-openssl",
    "http-client-curl-rust-tls",
    "http-client-insecure-credentials",
    "http-client-reqwest",
    "http-client-reqwest-native-tls",
    "http-client-reqwest-rust-tls",
    "http-client-reqwest-rust-tls-trust-dns",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is pinned by commit (rev = <full sha>);
# scripts/ci/cargo-deny.sh checks the Cargo.toml files for that.
required-git-spec = "rev"
unused-allowed-source = "allow"
# Sew's public mirror (sew-crates) retired with Sew 0.10.4: sew-call-client
# and tauri-plugin-sew-voice 0.8.2 are on crates.io.
# postal-sdk (MIT, Alakazam Labs) during Postal's S1: a git pin by full sha
# (Kessel Steward 2026-11-17), until its first crates.io release.
allow-git = ["https://github.com/Alakazam-211/postal-bot"]
