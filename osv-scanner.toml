# Advisories K2 lets through (prd-security-sweep-0464-v1 SS14).
#
# osv-scanner reads this file (scripts/ci/checks.sh audit, .github/workflows/checks.yml audit).
# It is also the ledger for .cargo/audit.toml: every RustSec ID cargo audit ignores must be here.
# Each entry: the advisory id, ignoreUntil = the review-by date (at most 90 days out), and why it
# is not reachable or can't be fixed yet. After ignoreUntil, osv-scanner reports it again and
# scripts/ci/audit-ignores.py fails, so the part goes red until someone re-checks it.
# One entry per advisory: when it has a RUSTSEC id and a GHSA alias, list the RUSTSEC id
# (cargo audit needs it; osv-scanner matches it through the alias). A second entry for the
# twin is reported as an unused ignore.
#
# Review dates: 2026-12-05 where a lockfile-only bump fixes it (do the bump, delete the entry);
# 2027-01-15 where it needs a major bump (the dependency-majors PRD, 0.46.5+) or upstream.
# Lock bumps: `cargo update -p <crate>` on this lock also re-points about 15 unrelated crates'
# windows-sys to older copies; the tokio/quinn bump kept only its own entries, so the next
# ordinary `cargo update` brings that re-pointing back: make it its own gated commit.
# Written 2026-10-24 from cargo-audit 0.22.2 + osv-scanner v2.6.0 (compute job 9b26630f) and
# cargo tree -i / bun.lock reverse deps.

