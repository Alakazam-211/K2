# rsa 0.9.10 (k2-vault directly and via ssh-key 0.6.7)
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "K2's only RSA private-key operation is k2-vault's ssh-agent signing (ssh_agent.rs AgentKey::sign): PKCS#1 v1.5 signatures, SHA-2 only, through rsa's try_sign_with_rng, which blinds the exponentiation with a fresh random factor and checks the result (rsa_decrypt_and_check). K2 does no RSA decryption, so Marvin's padding oracle has nothing to query, and ssh-key's own unblinded RSA signer is never called (RSA keys go through to_rsa). The agent socket serves same-uid peers only (SO_PEERCRED / getpeereid). A remote ssh server can time only signatures over a padded hash it can't choose, a burst of 60 and 240/min per (session, secret) by default; forwarded connections are refused by default (that check trusts the client's session-bind). No fixed rsa release exists: revisit when upstream's constant-time rewrite (rsa 0.10) ships."

