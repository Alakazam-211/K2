[package]
name = "kessel-video"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Cameras, screen capture, pixels and video codecs for apps that bring their own transport: H.264 through the operating system's codecs, a codec-neutral submit-and-poll API, and a scripted fake backend for tests."
authors = ["Alakazam Labs"]
readme = "README.md"
documentation = "https://docs.rs/kessel-video"
# repository = TODO: set when the public repository's home is decided.
keywords = ["video", "camera", "screen-capture", "h264", "webrtc"]
categories = ["multimedia::video"]
# Not published until the API settles and the release is approved.
publish = false
# tests/scrub.rs is the repository's own publish check.
exclude = ["tests/scrub.rs"]

[features]
# The API types and traits, `null()` and `fake` need no feature, no OS
# library and no `unsafe`.
default = ["system"]
# `fake::FakeBackend` is always compiled; this feature exists so a
# consumer's own test feature can name it.
fake = []
# macOS (and later iOS): AVFoundation, ScreenCaptureKit, VideoToolbox. System
# frameworks through FFI; no codec library is linked or shipped.
apple = ["dep:objc2", "dep:block2"]
# Media Foundation cameras and Windows Graphics Capture screens (H.264
# MFTs later). OS components through the `windows` crate.
windows = ["dep:windows", "dep:windows-future"]
# V4L2 cameras (raw ioctls) and the xdg-desktop-portal ScreenCast (zbus,
# pure Rust) with PipeWire (the system's libpipewire, loaded at run time:
# nothing to install at build time). No H.264: Linux has no OS codec.
linux = ["dep:libc", "dep:zbus", "dep:serde"]
# Camera2/CameraX, MediaCodec, MediaProjection (not built yet).
android = []
# VP8 encoding and decoding in pure Rust (the vp8-encoder and vp8-decoder
# crates) as software codecs in every backend.
vp8 = ["dep:vp8-decoder", "dep:vp8-encoder"]
# The OS backend for the target, plus VP8. Naming all four is safe: each
# backend's dependencies are target-specific and its code is cfg-gated to
# its OS, so a Linux build compiles only the Linux backend (Cargo features
# can't be target-gated themselves).
system = ["apple", "windows", "linux", "android", "vp8"]

[dependencies]
bytes = "1"
crossbeam-queue = "0.3"
thiserror = "2"
vp8-decoder = { version = "0.1", path = "../vp8-decoder", optional = true }
vp8-encoder = { version = "0.1", path = "../vp8-encoder", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
serde = { version = "1", optional = true }
zbus = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
