# CMake 4 dropped compatibility with cmake_minimum_required < 3.5, which some
# vendored C deps (prost-build's protobuf, llama.cpp) still declare. Without
# this, fresh builds fail on Macs that have CMake 4 (z3mbpZ, z3mbp).
# Harmless on older CMake and on Linux.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# Oldest macOS our Mac binaries support (GitHub #62). rustc, clang (cc crate)
# and CMake all read this, so every Rust and vendored C/Obj-C object agrees.
# Without it, clang targets the build Mac's own OS. llama.cpp's ggml-metal
# then binds macOS-15-only classes (MTLResidencySetDescriptor) strongly even
# though the code sits behind @available(macOS 15), so dyld kills k2-daemon
# before main() on macOS 14 and older. With an older target clang weak-links
# them and the @available check does its job. 11.0 is the floor for Apple
# Silicon (we ship aarch64 only) and matches rustc's default. Keep it in step
# with tauri.conf.json bundle.macOS.minimumSystemVersion and the daemon
# helper's LSMinimumSystemVersion (scripts/macos-daemon-helper-app.sh).
# Harmless on Linux. An explicit MACOSX_DEPLOYMENT_TARGET in the env wins.
MACOSX_DEPLOYMENT_TARGET = "11.0"
