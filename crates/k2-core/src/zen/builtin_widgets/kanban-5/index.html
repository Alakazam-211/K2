<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<link rel="stylesheet" href="kanban.css">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Board">
    <input type="search" id="search" placeholder="Filter cards" autocomplete="off" aria-label="Filter cards">
    <button class="btn" id="btnExport" type="button" title="Copy the board as markdown">Export</button>
    <button class="btn" id="btnImport" type="button" title="Add columns and cards from markdown">Import</button>
    <button class="btn" id="btnAgents" type="button" title="How your agents can work on this board">For agents</button>
    <button class="btn" id="btnThread" type="button" aria-pressed="false" title="Show or hide the Thread beside the board" hidden>Thread</button>
    <button class="btn" id="btnSend" type="button" title="Pick an agent in the Thread first" disabled hidden>Send board</button>
  </div>
</header>

<p class="banner" id="banner" role="status" hidden></p>

<div class="shell">
  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" aria-label="Kanban board"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="editor" hidden>
  <form class="dlg" id="editorForm" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <h3 id="editorTitle">Card</h3>
    <label class="field" for="edTitle">Title</label>
    <input id="edTitle" type="text" maxlength="300" autocomplete="off">
    <label class="field" for="edNote">Note <span class="hint">markdown</span></label>
    <textarea id="edNote" rows="8" maxlength="20000"></textarea>
    <label class="field" for="edCol">Column</label>
    <select id="edCol"></select>
    <p class="by-line" id="edBy"></p>
    <div class="dlg-actions">
      <button class="btn danger" id="edDelete" type="button">Delete</button>
      <span class="spacer"></span>
      <button class="btn" id="edCancel" type="button">Cancel</button>
      <button class="btn primary" id="edSave" type="submit">Save</button>
    </div>
  </form>
</div>

<div class="overlay" id="confirm" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="confirm-extra" id="confirmExtra"></div>
    <div class="dlg-actions" id="confirmActions"></div>
  </div>
</div>

<div class="overlay" id="textPanel" hidden>
  <div class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="textTitle">
    <h3 id="textTitle"></h3>
    <p id="textHint"></p>
    <textarea id="textBody" rows="14" spellcheck="false"></textarea>
    <div class="dlg-actions">
      <button class="btn" id="textClose" type="button">Close</button>
      <button class="btn primary" id="textGo" type="button">Copy</button>
    </div>
  </div>
</div>

<script src="md.js"></script>
<script src="kanban.js"></script>
<script src="thread.js"></script>
</body>
</html>
