[package]
name = "k2-test-sh-shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "TEST ONLY (Windows): runs the sh script next to it in Git Bash, so the shell-script fakes K2's tests write (fake frpc, agent shims) run as real .exe files there. Never shipped."

[[bin]]
name = "k2-test-sh-shim"
path = "src/main.rs"

# windows-sys 0.61 is the copy already in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
