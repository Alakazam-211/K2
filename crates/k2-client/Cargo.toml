[package]
name = "k2-client"
version = "0.46.2"
edition = "2021"
license = "FSL-1.1-Apache-2.0"
description = "What the K2 thin client needs without k2-core: paths, process bootstrap, launchd/bundle layout, keychain account session, release sums, small views. k2-core re-exports it."

[lib]
path = "src/lib.rs"

[features]
# Test builds of downstream crates (k2-core's `test-util`) never touch the
# developer's real login keychain: `account_session::read_keychain_item`
# returns None when this is on. Not a runtime feature.
test-util = []

# Versions match k2-core's so the lockfile keeps one copy of each.
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2.17"
core-foundation = "0.10"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
