# Remote-update P1 — Linux standalone daemon binaries.
#
# release.sh (run on the maintainer's macOS box) builds + signs the NATIVE
# macos-aarch64 standalone daemon and emits daemon-latest.json. macOS is the
# wrong tool for cross-compiling the daemon's C/C++ deps (ggml, sqlite,
# libgit2) for Linux, so the Linux artifacts are produced HERE on the
# AX41 self-hosted runner (`k2-linux` / k2-sandbox-01) and uploaded to
# the SAME GitHub release. Not GitHub-hosted ubuntu-latest.
#
# Trigger: a pushed release tag (v<x.y.z>). The matrix builds
# x86_64-unknown-linux-gnu (native) and aarch64-unknown-linux-gnu (via the
# gnu cross toolchain) and uploads k2-daemon-linux-<arch> + its .sha256
# UNSIGNED (prd-security-sweep-0464-v1 SS1, 0.46.6). The update key is not
# a GitHub secret any more: z3mbpZ signs the daemons with
# scripts/sign-daemon.sh (release.sh Step 10.5), uploads the .sig files and
# then merges them into daemon-latest.json, so the manifest never lists a
# .sig that isn't up yet. Daemons fetch only what the manifest lists.
#
# Asset names MUST match what daemon-latest.json references:
#   k2-daemon-linux-x86_64{,.sha256}    (.sig added on z3mbpZ)
#   k2-daemon-linux-aarch64{,.sha256}   (.sig added on z3mbpZ)
#
# The legacy k2-mail-helper (0.44.1–0.45.3) is no longer built or shipped
# (0.45.4, Rosson 2026-10-10): install-root-helper.sh retires it. The
# install-mail-helper.sh name stays as a wrapper for the root installer.
#
# K2 root helper (0.45.4+, prd-k2-root-helper-v1). Built here UNSIGNED:
#   k2-root-helper-linux-x86_64{,.sha256}
#   k2-root-helper-linux-aarch64{,.sha256}
#   install-root-helper.sh
# The .sig is added afterwards on z3mbpZ by scripts/sign-root-helper.sh with
# the separate root-helper key (never a GitHub secret, never the updater
# key). Daemons fetch only signed assets, so an unsigned window is a
# harmless 404 for auto-heal.
#
# k2-node (0.45.5+, prd-k2-node-admin-v1 §8.1). Also built here UNSIGNED:
#   k2-node-linux-x86_64{,.sha256}
#   k2-node-linux-aarch64{,.sha256}
# k2-node has a root mode, so its .sig is the ROOT-HELPER key's, added on
# z3mbpZ by scripts/sign-k2-node.sh (trusted comment
# `file:k2-node-linux-<arch> version:<v> protocol:<p>`). This workflow no
# longer signs k2-node with the updater key. Until the .sig is up, daemons
# and controllers refuse the asset (fail closed).
#
# k2-app-engine (0.46.1+, prd-k2-app-runtime-v1 §10.6, S11). Built here
# UNSIGNED, Linux only:
#   k2-app-engine-linux-x86_64{,.sha256}
#   k2-app-engine-linux-aarch64{,.sha256}
# The root helper installs it (`apps install-engine`) to run as k2app, so
# its .sig is the ROOT-HELPER key's, added on z3mbpZ by
# scripts/sign-app-engine.sh (trusted comment
# `file:k2-app-engine-linux-<arch> version:<v> protocol:<p>`). Until the .sig
# is up, daemons and the helper refuse the asset (fail closed).
#
# Do NOT attach an air-gap daemon to the GitHub release. `--features airgap`
# is a custom/enterprise compile (bakes air-gap ON, omits the GitHub
# daemon-latest.json ping URL). Distribution is off-band / portal, not
# `gh release upload`. Cloud Linux self-update stays on the untagged assets.
#
# Secrets (repo Settings → Secrets and variables → Actions). No update
# signing key: those two secrets are deleted (SS1; sign-daemon.sh
# --preflight refuses a release while they exist).
#   K2_GMAIL_CLIENT_ID                  — pre-packaged Gmail OAuth client id
#                                         (option_env! into mail/oauth/mod.rs)
#   K2_GMAIL_CLIENT_SECRET              — matching desktop client secret
#   K2_MICROSOFT_CLIENT_ID              — optional MS client id (not the DTL bug)
#
# Without K2_GMAIL_CLIENT_* the Linux binary ships
# client_id=REPLACE_ME.apps.googleusercontent.com and email-link fails with
# Google invalid_client (DTL proof). macOS release.sh sources .env; this
# workflow MUST inject Gmail at compile time and strings-check the binary.

name: daemon-binaries

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag that already exists (e.g. CI was added after the
  # tag, or a transient failure). Provide the tag, e.g. v0.39.33.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build + attach Linux daemon binaries to (e.g. v0.39.33)"
        required: true

permissions:
  contents: write # needed to upload assets to the GitHub release

# One AX41 runner — do not stack x86 + aarch64 + app-linux on the DEV daemon.
concurrency:
  group: k2-linux-ship
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: /home/k2-ci/cargo-target

jobs:
  build-linux-daemon:
    name: Build k2-daemon (${{ matrix.target }})
    runs-on: [self-hosted, linux, k2-linux]
    # id-token + attestations: the build-provenance attestation that
    # sign-daemon.sh requires before z3mbpZ signs a daemon (security review
    # of SS1). contents: the release upload.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: k2-daemon-linux-x86_64
            root_asset: k2-root-helper-linux-x86_64
            node_asset: k2-node-linux-x86_64
            engine_asset: k2-app-engine-linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            asset: k2-daemon-linux-aarch64
            root_asset: k2-root-helper-linux-aarch64
            node_asset: k2-node-linux-aarch64
            engine_asset: k2-app-engine-linux-aarch64
            cross: true

    steps:
      - name: Checkout (at the release tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-22)
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          # Self-hosted k2-linux shares k2-ci's ~/.cargo with the release gate.
          # rust-cache's bin cleanup deleted ~/.cargo/bin/rustup after a job
          # (0.41.6 daemon-binaries ended 05:46Z, the moment rustup vanished),
          # which broke the next release gate with `cargo: command not found`.
          cache-bin: false

      # Native x86_64 build deps + (for aarch64) the gnu cross toolchain that
      # provides the aarch64-linux-gnu-gcc linker cargo needs. cmake/clang
      # cover the daemon's C/C++ deps (ggml/llama-cpp-2, libgit2, sqlite).
      # AX41 already has these once; skip apt when k2-ci has no sudo.
      - name: Install build dependencies
        run: |
          if ! sudo -n true 2>/dev/null; then
            echo "no passwordless sudo — using preinstalled AX41 toolchain"
            command -v cmake
            command -v clang
            if [ "${{ matrix.cross }}" = "true" ]; then
              command -v aarch64-linux-gnu-gcc
            fi
            exit 0
          fi
          # Drop leftover ubuntu-latest third-party apt repos (microsoft/azure-cli)
          # whose mirror intermittently 500s `apt-get update` with a corrupt
          # InRelease — transient infra, unrelated to our build. We install
          # nothing from them. (See app-linux.yml for the v0.40.34 incident.)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libssl-dev
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # Point cargo + the C/C++ build scripts at the cross compilers for the
      # aarch64 target. No-op for the native x86_64 job.
      - name: Configure aarch64 cross-compilers
        if: matrix.cross == true
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Build k2-daemon + k2-node + k2-root-helper + k2-app-engine (release, standalone bins)
        env:
          # Priority: Gmail (customer-facing invalid_client on DTL). MS optional.
          K2_GMAIL_CLIENT_ID: ${{ secrets.K2_GMAIL_CLIENT_ID }}
          K2_GMAIL_CLIENT_SECRET: ${{ secrets.K2_GMAIL_CLIENT_SECRET }}
          K2_MICROSOFT_CLIENT_ID: ${{ secrets.K2_MICROSOFT_CLIENT_ID }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/require-mail-oauth-build-env.sh
          source scripts/require-mail-oauth-build-env.sh
          require_mail_oauth_build_env
          # The path mappings every Linux builder uses (K2 Compute's
          # build-linux-bins.sh too), so the two can build the same bytes.
          # shellcheck source=scripts/ci/repro-build-env.sh
          source scripts/ci/repro-build-env.sh
          k2_repro_build_env "$PWD"
          # k2-ptyd P84: the daemon embeds the PTY host (install-daemon.sh
          # and the self-updater fetch only k2-daemon). Built first for the
          # same target; K2_REQUIRE_PTYD_EMBED=1 fails the daemon build
          # without it.
          # shellcheck source=scripts/linux-ptyd-embed.sh
          source scripts/linux-ptyd-embed.sh
          k2_ptyd_build_for_embed "${{ matrix.target }}"
          # The export worker rides inside the daemon the same way
          # (prd-k2-core-exports-v1, vs-live §3.1).
          k2_export_build_for_embed "${{ matrix.target }}"
          cargo build --release \
            --target ${{ matrix.target }} \
            --bin k2-daemon \
            --bin k2-node
          # Runner .env sets CARGO_TARGET_DIR=/home/k2-ci/cargo-target
          TARGET_DIR="${CARGO_TARGET_DIR:-target}"
          cp "$TARGET_DIR/${{ matrix.target }}/release/k2-daemon" \
             "${{ matrix.asset }}"
          assert_daemon_embeds_ptyd "${{ matrix.asset }}"
          assert_daemon_embeds_export "${{ matrix.asset }}"
          # The marker sign-daemon.sh requires exactly once (version + arch).
          test "$(grep -a -o 'K2_DAEMON_BUILD v=[0-9.]* os=linux arch=[a-z0-9_]*;' "${{ matrix.asset }}" | wc -l)" = 1
          # The root helper (prd-k2-root-helper-v1): its own crate, no
          # features (never test-keys). Signed LATER on z3mbpZ with the
          # separate root-helper key (scripts/sign-root-helper.sh); CI
          # never sees that key and uploads no .sig for it.
          cargo build --release --target ${{ matrix.target }} -p k2-root-helper
          cp "$TARGET_DIR/${{ matrix.target }}/release/k2-root-helper" \
             "${{ matrix.root_asset }}"
          if grep -a -q K2_ROOT_HELPER_TEST_KEYS_ENABLED "${{ matrix.root_asset }}"; then
            echo "root helper was built with test-keys — refusing" >&2; exit 1
          fi
          test "$(grep -a -o 'K2_ROOT_HELPER_BUILD v=[0-9.]* proto=[0-9]* arch=[a-z0-9_]*;' "${{ matrix.root_asset }}" | wc -l)" = 1
          # Compute nodes: k2-node ships beside the daemon so `k2 compute
          # local enable` never needs a hand-copied binary, and controllers
          # send it to nodes as a signed self-update. Signed LATER on z3mbpZ
          # with the root-helper key (scripts/sign-k2-node.sh), never here.
          cp "$TARGET_DIR/${{ matrix.target }}/release/k2-node" \
             "${{ matrix.node_asset }}"
          if grep -a -q K2_NODE_TEST_KEYS_ENABLED "${{ matrix.node_asset }}"; then
            echo "k2-node was built with test-keys — refusing" >&2; exit 1
          fi
          test "$(grep -a -o 'K2_NODE_BUILD v=[0-9.]* proto=[0-9]* os=linux arch=[a-z0-9_]*;' "${{ matrix.node_asset }}" | wc -l)" = 1
          # The App engine (S11): its own crate, no features (never
          # test-keys). Signed LATER on z3mbpZ with the root-helper key
          # (scripts/sign-app-engine.sh), never here.
          cargo build --release --target ${{ matrix.target }} -p k2-app-engine
          cp "$TARGET_DIR/${{ matrix.target }}/release/k2-app-engine" \
             "${{ matrix.engine_asset }}"
          if grep -a -q K2_APP_ENGINE_TEST_KEYS_ENABLED "${{ matrix.engine_asset }}"; then
            echo "k2-app-engine was built with test-keys — refusing" >&2; exit 1
          fi
          test "$(grep -a -o 'K2_APP_ENGINE_BUILD v=[0-9.]* proto=[0-9]* arch=[a-z0-9_]*;' "${{ matrix.engine_asset }}" | wc -l)" = 1
          file "${{ matrix.asset }}" "${{ matrix.node_asset }}" "${{ matrix.root_asset }}" "${{ matrix.engine_asset }}"
          assert_daemon_oauth_not_placeholder "${{ matrix.asset }}"

      # Published for every asset: sign-daemon.sh, sign-root-helper.sh,
      # sign-k2-node.sh and sign-app-engine.sh check the downloads on z3mbpZ.
      - name: Compute sha256
        run: |
          set -euo pipefail
          sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"
          sha256sum "${{ matrix.root_asset }}" | tee "${{ matrix.root_asset }}.sha256"
          sha256sum "${{ matrix.node_asset }}" | tee "${{ matrix.node_asset }}.sha256"
          sha256sum "${{ matrix.engine_asset }}" | tee "${{ matrix.engine_asset }}.sha256"

      # Attach the UNSIGNED binaries + .sha256 to the release for this tag.
      # The daemon manifest (daemon-latest.json) is produced by release.sh
      # and gets the Linux entries from sign-daemon.sh after signing; the
      # daemon assets use the exact names that manifest references. The
      # helper assets are never listed in that manifest (root-owned file;
      # ops install it with install-mail-helper.sh).
      # Signed provenance for the daemon bytes (Sigstore, this repo, this
      # workflow, this commit). sign-daemon.sh runs `gh attestation verify`
      # against exactly those and refuses to sign without it.
      - name: Attest daemon build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      # The daemon assets are uploaded WITHOUT --clobber: a daemon already
      # on the release is never silently replaced. What sign-daemon.sh
      # really relies on is the attestation above plus the local tag
      # commit. To redo a build: delete the two assets, then
      # `gh workflow run daemon-binaries.yml --ref v<x> -f tag=v<x>`. The
      # other assets are signed with the root-helper key and keep --clobber.
      - name: Upload to release
        env:
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$IN_TAG"
          # A dispatch input is user text: env only, never spliced into the
          # script (security review), and it must look like a release tag.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh release upload "$TAG" \
            "${{ matrix.asset }}" \
            "${{ matrix.asset }}.sha256"
          gh release upload "$TAG" \
            "${{ matrix.node_asset }}" \
            "${{ matrix.node_asset }}.sha256" \
            "${{ matrix.root_asset }}" \
            "${{ matrix.root_asset }}.sha256" \
            "${{ matrix.engine_asset }}" \
            "${{ matrix.engine_asset }}.sha256" \
            --clobber

  # The root installer the daemon's "mail helper not installed" hint points
  # at: <release>/download/<tag>/install-mail-helper.sh. Same tag as the
  # helper assets it fetches. No build; runs even if a matrix leg fails
  # (the installer then reports the missing asset by name).
  upload-mail-helper-installer:
    name: Attach install-mail-helper.sh
    runs-on: [self-hosted, linux, k2-linux]
    steps:
      - name: Checkout (at the release tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Upload installer
        env:
          IN_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash -n scripts/install-mail-helper.sh
          bash -n scripts/install-root-helper.sh
          TAG="$IN_TAG"
          # A dispatch input is user text: env only, never spliced into the
          # script (security review), and it must look like a release tag.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh release upload "$TAG" scripts/install-mail-helper.sh scripts/install-root-helper.sh --clobber

  # No manifest merge here any more (SS1): z3mbpZ signs the Linux daemons
  # and merges them into daemon-latest.json itself (scripts/sign-daemon.sh,
  # using scripts/merge-daemon-manifest.py), after their .sig is up.
