# Remote-update P1 — Linux standalone daemon binaries.
#
# release.sh (run on the maintainer's macOS box) builds + signs the NATIVE
# macos-aarch64 standalone daemon and emits daemon-latest.json. macOS is the
# wrong tool for cross-compiling the daemon's C/C++ deps (ggml, sqlite,
# libgit2) for Linux, so the Linux artifacts are produced HERE on the
# AX41 self-hosted runner (`k2-linux` / k2-sandbox-01) and uploaded to
# the SAME GitHub release. Not GitHub-hosted ubuntu-latest.
#
# Trigger: a pushed release tag (v<x.y.z>). The matrix builds
# x86_64-unknown-linux-gnu (native) and aarch64-unknown-linux-gnu (via the
# gnu cross toolchain), minisign-signs each with the SAME updater key the
# Tauri app uses (so P3 verifies against plugins.updater.pubkey), and
# uploads k2-daemon-linux-<arch> + its .sig as release assets.
#
# Asset names MUST match what daemon-latest.json references:
#   k2-daemon-linux-x86_64{,.sig}
#   k2-daemon-linux-aarch64{,.sig}
#
# Do NOT attach an air-gap daemon to the GitHub release. `--features airgap`
# is a custom/enterprise compile (bakes air-gap ON, omits the GitHub
# daemon-latest.json ping URL). Distribution is off-band / portal, not
# `gh release upload`. Cloud Linux self-update stays on the untagged assets.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — the minisign private key STRING
#                                         (same key as ~/.tauri/k2-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
#   K2_GMAIL_CLIENT_ID                  — pre-packaged Gmail OAuth client id
#                                         (option_env! into mail/oauth/mod.rs)
#   K2_GMAIL_CLIENT_SECRET              — matching desktop client secret
#   K2_MICROSOFT_CLIENT_ID              — optional MS client id (not the DTL bug)
#
# Without K2_GMAIL_CLIENT_* the Linux binary ships
# client_id=REPLACE_ME.apps.googleusercontent.com and email-link fails with
# Google invalid_client (DTL proof). macOS release.sh sources .env; this
# workflow MUST inject Gmail at compile time and strings-check the binary.

name: daemon-binaries

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag that already exists (e.g. CI was added after the
  # tag, or a transient failure). Provide the tag, e.g. v0.39.33.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build + attach Linux daemon binaries to (e.g. v0.39.33)"
        required: true

permissions:
  contents: write # needed to upload assets to the GitHub release

# One AX41 runner — do not stack x86 + aarch64 + app-linux on the DEV daemon.
concurrency:
  group: k2-linux-ship
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: /home/k2-ci/cargo-target

jobs:
  build-linux-daemon:
    name: Build k2-daemon (${{ matrix.target }})
    runs-on: [self-hosted, linux, k2-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: k2-daemon-linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            asset: k2-daemon-linux-aarch64
            cross: true

    steps:
      - name: Checkout (at the release tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native x86_64 build deps + (for aarch64) the gnu cross toolchain that
      # provides the aarch64-linux-gnu-gcc linker cargo needs. cmake/clang
      # cover the daemon's C/C++ deps (ggml/llama-cpp-2, libgit2, sqlite).
      # AX41 already has these once; skip apt when k2-ci has no sudo.
      - name: Install build dependencies
        run: |
          if ! sudo -n true 2>/dev/null; then
            echo "no passwordless sudo — using preinstalled AX41 toolchain"
            command -v cmake
            command -v clang
            if [ "${{ matrix.cross }}" = "true" ]; then
              command -v aarch64-linux-gnu-gcc
            fi
            exit 0
          fi
          # Drop leftover ubuntu-latest third-party apt repos (microsoft/azure-cli)
          # whose mirror intermittently 500s `apt-get update` with a corrupt
          # InRelease — transient infra, unrelated to our build. We install
          # nothing from them. (See app-linux.yml for the v0.40.34 incident.)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libssl-dev
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # Point cargo + the C/C++ build scripts at the cross compilers for the
      # aarch64 target. No-op for the native x86_64 job.
      - name: Configure aarch64 cross-compilers
        if: matrix.cross == true
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Build k2-daemon (release, standalone bin)
        env:
          # Priority: Gmail (customer-facing invalid_client on DTL). MS optional.
          K2_GMAIL_CLIENT_ID: ${{ secrets.K2_GMAIL_CLIENT_ID }}
          K2_GMAIL_CLIENT_SECRET: ${{ secrets.K2_GMAIL_CLIENT_SECRET }}
          K2_MICROSOFT_CLIENT_ID: ${{ secrets.K2_MICROSOFT_CLIENT_ID }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/require-mail-oauth-build-env.sh
          source scripts/require-mail-oauth-build-env.sh
          require_mail_oauth_build_env
          cargo build --release \
            --target ${{ matrix.target }} \
            --bin k2-daemon
          # Runner .env sets CARGO_TARGET_DIR=/home/k2-ci/cargo-target
          TARGET_DIR="${CARGO_TARGET_DIR:-target}"
          cp "$TARGET_DIR/${{ matrix.target }}/release/k2-daemon" \
             "${{ matrix.asset }}"
          file "${{ matrix.asset }}"
          assert_daemon_oauth_not_placeholder "${{ matrix.asset }}"

      # Sign with the Tauri updater key via the tauri CLI signer (produces a
      # base64-wrapped minisign signature identical in format to the macOS
      # K2SO.app.tar.gz.sig and the macos-aarch64 daemon .sig). P3 verifies
      # this against plugins.updater.pubkey.
      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Sign binary (minisign via tauri signer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "${{ matrix.asset }}"
          test -f "${{ matrix.asset }}.sig"
          # tauri signer writes the .sig as BASE64 of the minisig text; the
          # daemon self-updater (minisign_verify) and plain minisign need
          # the RAW text — publish that. (Found by the first real Shape B
          # two-version e2e, 2026-07-06.)
          if ! head -c 17 "${{ matrix.asset }}.sig" | grep -q "untrusted comment"; then
            base64 -d < "${{ matrix.asset }}.sig" > "${{ matrix.asset }}.sig.raw"
            head -c 17 "${{ matrix.asset }}.sig.raw" | grep -q "untrusted comment"
            mv "${{ matrix.asset }}.sig.raw" "${{ matrix.asset }}.sig"
          fi

      - name: Compute sha256 (for logs / manual manifest merge)
        run: sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      # Attach the binary + .sig to the release for this tag. The daemon
      # manifest (daemon-latest.json) is produced by release.sh; these assets
      # use the exact names that manifest references.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            "${{ matrix.asset }}" \
            "${{ matrix.asset }}.sig" \
            --clobber

  # release.sh generates daemon-latest.json BEFORE this workflow builds the
  # Linux daemons, so the manifest it uploads only carries macos-aarch64 —
  # and a Linux daemon checking for updates finds no artifact for its
  # platform key. (0.40.29-era daemons fold that into "up to date", which is
  # how cfed.k2.dev sat on 0.40.29 while 0.40.31 was out.) This job runs
  # after both matrix legs, merges the linux-* entries into the released
  # manifest, and re-uploads it. Idempotent: re-runs overwrite the same keys.
  merge-daemon-manifest:
    name: Merge linux artifacts into daemon-latest.json
    needs: build-linux-daemon
    runs-on: [self-hosted, linux, k2-linux]
    steps:
      - name: Merge + re-upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          # The manifest + binaries were uploaded to THIS tag's release
          # (manifest by release.sh Step 8.5, binaries by the matrix job).
          # Exact cloud-update names only. Never glob `k2-daemon-linux-*`
          # in a way that could pick up a privately built `*-airgap` binary
          # — that compile is custom/enterprise and is not a release asset.
          gh release download "$TAG" --repo "$REPO" \
            -p daemon-latest.json \
            -p k2-daemon-linux-x86_64 \
            -p k2-daemon-linux-x86_64.sig \
            -p k2-daemon-linux-aarch64 \
            -p k2-daemon-linux-aarch64.sig \
            --skip-existing
          python3 - "$BASE" <<'PY'
          import hashlib, json, sys
          base = sys.argv[1]
          m = json.load(open("daemon-latest.json"))
          for target in ("linux-x86_64", "linux-aarch64"):
              name = f"k2-daemon-{target}"
              digest = hashlib.sha256(open(name, "rb").read()).hexdigest()
              m["artifacts"][target] = {
                  "url": f"{base}/{name}",
                  "sig": f"{base}/{name}.sig",
                  "sha256": digest,
              }
          leaked = [k for k in m["artifacts"] if "airgap" in k]
          if leaked:
              raise SystemExit(f"daemon-latest.json must not list airgap assets: {leaked}")
          json.dump(m, open("daemon-latest.json", "w"), indent=2)
          print("merged platforms:", sorted(m["artifacts"]))
          PY
          gh release upload "$TAG" daemon-latest.json --repo "$REPO" --clobber
