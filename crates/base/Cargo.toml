[package]
name = "k2-mpc-base"
version = "0.9.8+2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Multiplayer kit for file-type packs: docs on K2-defined primitives (engine hidden), text diff and three-way merge, file codecs; sessions, presence, persistence, history, text tools and the agent-parity framework."

[features]
# Decoding bytes from remote clients (sync step 1/2, updates). Off by default, and a host must
# not enable it until the strict decoder lands (docs/ARCHITECTURE.md, rule 4).
# **Build-time guard (K10):** with this feature, the crate doesn't compile unless the build
# also sets `--cfg k2_mpc_untrusted_wire_ack` (docs/HOST-WIRE.md: the six gates first).
# The kit's own tests enable it (self dev-dependency below); this repo's .cargo/config.toml
# sets the cfg for builds run inside it.
untrusted-wire = []
# Test-only hooks for the engine-generic conformance suite (`crates/conformance`): an
# in-process sync between two of this kit's docs and a comparable state vector. Off by
# default; no host enables it.
conformance = []
# Test-only: choose the engine's edit path per thread, shadow each edit through another path,
# and mint client IDs from a seed (`k2_mpc_base::differential`: the differential tests and the
# soak's shadow mode). Off by default; no host enables it.
differential = []
# Test-only: plant a bug in the engine's position index (the vendored Yrs's feature of the
# same name), to prove the kit reports what the index's shadow check finds (v0.9.7). Never in
# a build.
planted-position-bugs = ["differential", "yrs/planted-position-bugs"]
# Test-only: the store's record decoders as entry points for the fuzz targets (`fuzz/`,
# `k2_mpc_base::fuzzing`). Off by default; no host enables it.
fuzzing = []

[dependencies]
# The engine is private to this crate: Yrs v0.28.0 plus the k2 patches (`Doc::transact_mut_as`,
# bounded decoder reservations), vendored at a tag (`vendor/yrs/VENDORED`, `docs/YRS-FORK.md`).
# Pinned exactly: its encoding is part of the stored format.
yrs = { path = "../../vendor/yrs", version = "=0.28.0" }
thiserror = "2"
# Same major as the host already uses, so vendoring adds no second copy.
redb = "2"
# Regexes for the text tools (grep, sed): linear-time engines only, size-limited per pattern.
# The meta engine for leftmost-first search and captures, the lazy DFA for POSIX
# leftmost-longest match ends.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "hybrid", "nfa-pikevm", "nfa-backtrack", "dfa-onepass"] }

[dev-dependencies]
k2-mpc-base = { path = ".", features = ["untrusted-wire", "differential", "conformance"] }
# (conformance: `Session::char_blame` for the tests that read roots; test builds only, the feature only adds functions)
proptest = "1"
rand = { version = "0.8", features = ["small_rng"] }
# Tests stand in for remote clients with raw Yrs docs (Yjs wire-compatible): the same copy.
yrs = { path = "../../vendor/yrs", version = "=0.28.0" }

[lints.rust]
# K10's acknowledgement cfg (lib.rs): a known name, not an unexpected one.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(k2_mpc_untrusted_wire_ack)"] }
