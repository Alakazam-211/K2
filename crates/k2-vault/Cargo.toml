[package]
name = "k2-vault"
version = "0.45.0"
edition = "2021"
license = "FSL-1.1-Apache-2.0"
description = "K2 vault: one encrypted store for passwords, tokens and keys, used in-process by the daemon behind the SecretStore trait."

# The vault is its own small crate (cores direction): no dependency on
# k2-core or k2-daemon. The daemon links it; clients never do.
#
# Crypto (KV3): RustCrypto XChaCha20-Poly1305 / ChaCha20-Poly1305, HKDF and
# HMAC over SHA-256, X25519 for the age-format holders (recovery, backup,
# clone target). The full `age` crate pulls an i18n stack (~20 crates), so
# the age v1 X25519 format is written here directly (`agefmt.rs`) and
# checked byte-for-byte against `age` in the tests only.
[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
# OVH API v1 request signatures ($1$ SHA-1; PRD vault-gaps item 2).
sha1 = "0.10"
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Engine signing keys (asymmetric engine tokens) and signed clone carries (VS20).
ed25519-dalek = "2"
bech32 = "0.9"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Exact-value redaction, shared with k2-node (compute secret-env SE24b).
k2-redact = { path = "../k2-redact" }
idna = "1"
url = "2"
argon2 = "0.5"
libc = "0.2"
parking_lot = "0.12"
# `agent` delivery for ssh keys (prd-vault-gaps-v1 item 3): key parsing and
# signatures from RustCrypto (Apache-2.0 OR MIT); the ssh-agent protocol
# subset is written by hand in `ssh_agent.rs`. `rsa` ships with
# RUSTSEC-2023-0071 (Marvin timing side channel) accepted on purpose (Q7):
# SHA-2 only, rate-limited, same-uid peers only. `p256` verifies ECDSA
# host keys in session binds; it is never served.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rsa", "p256", "getrandom"] }
rsa = { version = "0.9.10", features = ["sha2"] }
signature = "2"

# Windows: owner-only DACLs stand in for 0700/0600 (k2-winsec); VirtualLock
# and the page size for Key32; FILE_FLAG_OPEN_REPARSE_POINT for no-follow
# opens. windows-sys 0.61 is the copy already in Cargo.lock.
[target.'cfg(windows)'.dependencies]
k2-winsec = { path = "../k2-winsec" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[features]
# Test fakes (FakeKeyStore, fake root helper, cheap KDF). Never in release
# builds (VS14).
test-util = []

[dev-dependencies]
age = { version = "0.11", default-features = false }
# Integration tests use the fakes.
k2-vault = { path = ".", features = ["test-util"] }
